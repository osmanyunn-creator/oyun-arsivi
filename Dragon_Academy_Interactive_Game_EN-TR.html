<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0B153C"><title>Dragon Academy - The Missing Rainbow Egg</title>
<style>:root{--night:#0b153c;--night2:#17245a;--purple:#6b3fc6;--violet:#9a62e8;--pink:#d94882;--sky:#4ac4ed;--mint:#51c99d;--gold:#f2b943;--paper:#fff6e7;--ink:#27304b;--muted:#6c728c}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#33458f 0,#151f51 36%,#080f2d 100%);color:white;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;background-image:radial-gradient(#f2b943 1px,transparent 1px),radial-gradient(#9a62e8 1px,transparent 1px);background-size:47px 47px,89px 89px;background-position:7px 13px,33px 29px}.top{position:sticky;top:0;z-index:5;background:#0b153cf2;border-bottom:1px solid #f2b94388;backdrop-filter:blur(12px)}.topin{max-width:1000px;margin:auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-family:Georgia,serif;color:var(--gold);font-weight:900;letter-spacing:.06em}.actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:flex-end}button{font:800 12px system-ui;border:1px solid #f2b943;border-radius:999px;background:transparent;color:#fff6e7;padding:8px 12px;cursor:pointer}button.active{background:var(--gold);color:var(--night)}button.primary{border:0;border-radius:12px;padding:13px 18px;background:linear-gradient(90deg,var(--pink),var(--purple));color:white;font-size:15px}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--sky);outline-offset:2px}.wrap{max-width:1000px;margin:auto;padding:26px 15px 70px}.progress{height:8px;background:#ffffff22;border-radius:99px;margin-bottom:18px;overflow:hidden}.progress span{height:100%;display:block;background:linear-gradient(90deg,var(--mint),var(--gold),var(--pink));transition:width .3s}.card{position:relative;overflow:hidden;background:var(--paper);color:var(--ink);border:1px solid var(--gold);border-radius:22px;padding:clamp(22px,5vw,46px);box-shadow:0 28px 70px #0006}.card:after{content:"";position:absolute;width:150px;height:150px;right:-85px;bottom:-85px;border-radius:50%;border:20px solid #9a62e81f}.content{position:relative;z-index:1}.eyebrow{font-size:11px;letter-spacing:.15em;text-transform:uppercase;font-weight:900;color:var(--purple)}h1,h2{font-family:Georgia,serif;color:var(--night);margin:.25em 0}h1{font-size:clamp(39px,8vw,70px);line-height:.96}h2{font-size:clamp(28px,5vw,43px)}.lead{font-size:18px;line-height:1.6}.egg{width:170px;height:220px;border:7px solid var(--violet);border-radius:50% 50% 45% 45%/60% 60% 40% 40%;margin:24px auto;background:repeating-linear-gradient(0deg,#fff 0 28px,var(--pink) 28px 40px,#fff 40px 58px,var(--gold) 58px 70px,#fff 70px 88px,var(--mint) 88px 100px,#fff 100px 118px,var(--sky) 118px 130px,#fff 130px)}.meta,.nav,.map{display:flex;gap:9px;flex-wrap:wrap}.meta span,.step{background:#eee5ff;color:var(--purple);padding:8px 11px;border-radius:999px;font-weight:900;font-size:12px}.nav{margin-top:25px}.nav .primary{flex:1;min-width:180px}.map{margin-bottom:18px}.step.now{background:var(--purple);color:white}.step.done{background:var(--mint);color:var(--night)}.mission{background:white;border:1px solid #dfd6c6;border-radius:17px;padding:18px;margin:16px 0}.visual{min-height:150px;display:grid;place-items:center;background:var(--night2);color:white;border:1px solid var(--gold);border-radius:16px;padding:18px;text-align:center;font-size:clamp(22px,6vw,42px);line-height:1.65}.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:18px 0}.answers button{color:var(--night);background:white;border:2px solid #d9d2c3;border-radius:12px;padding:13px}.answers button:hover{border-color:var(--purple)}.answers button.correct{background:#d9f7e9;border-color:#2d9a68}.feedback{font-weight:900;min-height:24px}.ok{color:#207a54}.bad{color:#b72d4d}.hint{background:#fff0bf;border-left:5px solid var(--gold);padding:13px 15px;border-radius:9px;margin-top:12px}.vault{text-align:center;background:var(--night2);color:white;border-radius:17px;padding:25px}.vault h2{color:white}select{padding:12px;border-radius:10px;border:2px solid var(--gold);font-weight:800;margin:5px}.cert{text-align:center;background:var(--night);color:white;border:7px double var(--gold);border-radius:18px;padding:30px}.cert h2{color:white}input{width:min(100%,450px);padding:11px;border:0;border-bottom:2px solid var(--gold);background:transparent;color:white;text-align:center;font-size:20px}.saved{font-size:10px;color:#d6d8ed}@media(max-width:600px){.answers{grid-template-columns:1fr}.brand{font-size:14px}}@media print{.top,.nav,.progress{display:none!important}body{background:white}body:before{display:none}.wrap{padding:0}.card{box-shadow:none;border:0}}</style></head>
<body><header class="top"><div class="topin"><div class="brand">DRAGON ACADEMY</div><div class="actions"><span id="saved" class="saved">Saved locally</span><button id="enBtn" onclick="setLang('en')">EN</button><button id="trBtn" onclick="setLang('tr')">TR</button><button onclick="resetAll()" id="resetBtn">Reset</button></div></div></header><main class="wrap"><div class="progress"><span id="bar"></span></div><section class="card" id="app"></section></main>
<script>const DATA=[{"title": ["The Hatchery Color Code", "Kuluçkahane Renk Kodu"], "skill": ["Pattern + observation", "Örüntü + gözlem"], "q": ["Four baby dragons blink: PINK, GOLD, MINT, PINK, GOLD, MINT, PINK, ... What comes next?", "Yavru ejderhalar yanıp sönüyor: PEMBE, ALTIN, NANE, PEMBE, ALTIN, NANE, PEMBE, ... Sırada ne var?"], "visual": "pattern", "answers": [["GOLD", "MINT", "SKY", "PINK"], ["ALTIN", "NANE", "GÖK", "PEMBE"]], "correct": ["GOLD", "ALTIN"], "hint": ["The pattern repeats every three colors.", "Örüntü her üç renkte bir tekrar ediyor."], "clue": ["GOLD", "ALTIN"]}, {"title": ["Runestone Decoder", "Rün Taşı Şifre Çözücü"], "skill": ["Code-breaking", "Şifre çözme"], "q": ["SUN = 3, STAR = 2, MOON = 5. What is SUN + STAR + MOON?", "GÜNEŞ = 3, YILDIZ = 2, AY = 5. GÜNEŞ + YILDIZ + AY kaçtır?"], "visual": "runes", "answers": [["8", "9", "10", "12"], ["8", "9", "10", "12"]], "correct": ["10", "10"], "hint": ["Replace each rune with its number, then add.", "Her rünü sayısıyla değiştir, sonra topla."], "clue": ["BLUE", "MAVİ"]}, {"title": ["The Sleepy Dragon Maze", "Uykucu Ejderha Labirenti"], "skill": ["Visual planning", "Görsel planlama"], "q": ["Spark passes five stars on the safe route to the crystal. How many stars?", "Spark kristale giden güvenli yolda beş yıldızdan geçiyor. Kaç yıldız var?"], "visual": "trail", "answers": [["4", "5", "6", "7"], ["4", "5", "6", "7"]], "correct": ["5", "5"], "hint": ["Count only the stars between Spark and the crystal.", "Spark ile kristal arasındaki yıldızları say."], "clue": ["GREEN", "YEŞİL"]}, {"title": ["Potion Shelf Mix-Up", "İksir Rafı Karmaşası"], "skill": ["Logic + comparison", "Mantık + karşılaştırma"], "q": ["Which potion is round, striped and has a star stopper?", "Hangi iksir yuvarlak, çizgili ve yıldız tıpalı?"], "visual": "potions", "answers": [["A", "B", "C", "D"], ["A", "B", "C", "D"]], "correct": ["C", "C"], "hint": ["All three clues must match the same potion.", "Üç ipucunun da aynı iksirle eşleşmesi gerekir."]}, {"title": ["Dragon Scale Search", "Ejderha Pulu Araması"], "skill": ["Spot the detail", "Detayı bul"], "q": ["Seven scales match. One has a different lower curve. Which letter is odd?", "Yedi pul aynı. Birinin alt kıvrımı farklı. Hangi harf farklı?"], "visual": "scales", "answers": [["B", "D", "F", "H"], ["B", "D", "F", "H"]], "correct": ["F", "F"], "hint": ["Compare the bottom point of every scale.", "Her pulun alt ucunu karşılaştır."]}, {"title": ["The Library Number Trail", "Kütüphane Sayı Yolu"], "skill": ["Ordering", "Sıralama"], "q": ["Order the books from smallest to largest, then read the letters.", "Kitapları en küçükten en büyüğe sırala, sonra harfleri oku."], "visual": "books", "answers": [["MOON", "MONO", "OMON", "NOOM"], ["KODU", "KOUD", "ODUK", "DUKO"]], "correct": ["MOON", "KODU"], "hint": ["Start with 3, then 7, then 11, then 14.", "3, sonra 7, sonra 11, sonra 14 ile başla."]}, {"title": ["Constellation Count", "Takımyıldızı Sayımı"], "skill": ["Selective counting", "Seçici sayma"], "q": ["Count ONLY yellow stars. Ignore blue stars and moons.", "SADECE sarı yıldızları say. Mavi yıldızları ve ayları sayma."], "visual": "stars", "answers": [["5", "6", "7", "8"], ["5", "6", "7", "8"]], "correct": ["7", "7"], "hint": ["Ignore blue stars and moons.", "Mavi yıldızları ve ayları sayma."], "clue": ["PURPLE", "MOR"]}, {"title": ["The Whispering Door", "Fısıldayan Kapı"], "skill": ["Riddle", "Bilmece"], "q": ["I have a face but no eyes. I have two hands but no fingers. I tell time. What am I?", "Yüzüm var ama gözüm yok. İki ibrem var ama parmaklarım yok. Zamanı söylerim. Ben neyim?"], "visual": "clock", "answers": [["CLOCK", "BOOK", "MIRROR", "WINDOW"], ["SAAT", "KİTAP", "AYNA", "PENCERE"]], "correct": ["CLOCK", "SAAT"], "hint": ["It hangs on a wall and tells time.", "Duvarda asılı olabilir ve zamanı gösterir."]}];const COPY={en:{saved:'Saved locally',reset:'Reset',eye:'INTERACTIVE KIDS ESCAPE ROOM',title:'The Missing Rainbow Egg',lead:'The Rainbow Egg vanished before the Moonrise Ceremony. Solve eight missions and unlock the final vault!',start:'Start Adventure',guide:'Grown-up Guide',guideBody:'For ages 6-10 and 1-6 players. Solve missions in order. Use a gentle hint only when needed. Progress is saved on this device.',begin:'Begin Mission 1',back:'Back',next:'Next Mission',hint:'Need a hint?',wrong:'Not quite. Try again!',correct:'Correct! Mission cleared.',clue:'Vault clue',vault:'Final Rainbow Vault',vaultBody:'Choose the four colors revealed by the mission rules.',unlock:'Unlock Vault',success:'VAULT OPEN! The Rainbow Egg is safe!',fail:'The runes flicker. Check the four rules and try again.',cert:'Junior Keeper Certificate',awarded:'Awarded to',name:'Type your name',certBody:'for recovering the Missing Rainbow Egg with courage, teamwork and clever puzzle-solving.',again:'Play Again',toVault:'Go to Final Vault'},tr:{saved:'Yerel olarak kaydedildi',reset:'Sıfırla',eye:'İNTERAKTİF ÇOCUK KAÇIŞ OYUNU',title:'Kayıp Gökkuşağı Yumurtası',lead:'Gökkuşağı Yumurtası Ay Doğuşu Töreni’nden önce kayboldu. Sekiz görevi çöz ve final kasasını aç!',start:'Macerayı Başlat',guide:'Yetişkin Rehberi',guideBody:'6-10 yaş ve 1-6 oyuncu için. Görevleri sırayla çözün. Yalnızca gerektiğinde küçük ipucu kullanın. İlerleme bu cihazda kaydedilir.',begin:'1. Göreve Başla',back:'Geri',next:'Sonraki Görev',hint:'İpucu ister misin?',wrong:'Henüz değil. Tekrar dene!',correct:'Doğru! Görev tamamlandı.',clue:'Kasa ipucu',vault:'Final Gökkuşağı Kasası',vaultBody:'Görev kurallarının ortaya çıkardığı dört rengi seç.',unlock:'Kasayı Aç',success:'KASA AÇILDI! Gökkuşağı Yumurtası güvende!',fail:'Rünler titriyor. Dört kuralı kontrol edip tekrar dene.',cert:'Genç Koruyucu Sertifikası',awarded:'Bu sertifika',name:'Adını yaz',certBody:'Kayıp Gökkuşağı Yumurtası’nı cesaret, takım çalışması ve akıllı bulmaca çözme ile kurtardığı için verilmiştir.',again:'Tekrar Oyna',toVault:'Final Kasaya Geç'}};const KEY='dragon-academy-v2';let S={lang:'en',screen:'cover',mission:0,solved:Array(8).fill(false),vault:['','','',''],certName:''};try{const q=JSON.parse(localStorage.getItem(KEY)||'{}');S={...S,...q};if(!Array.isArray(S.solved)||S.solved.length!==8)S.solved=Array(8).fill(false)}catch(e){}const C=()=>COPY[S.lang],L=a=>a[S.lang==='en'?0:1],esc=v=>String(v??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function save(){localStorage.setItem(KEY,JSON.stringify(S));document.getElementById('saved').textContent=C().saved}function setLang(l){S.lang=l;save();render()}function go(screen){S.screen=screen;save();scrollTo({top:0,behavior:'smooth'});render()}function vis(k){let en=S.lang==='en';return {pattern:en?'🩷 🟨 🟩  🩷 🟨 🟩  🩷 ❓':'PEMBE · ALTIN · NANE  ·  PEMBE · ALTIN · NANE  ·  PEMBE · ?',runes:en?'☀ = 3   ★ = 2   ☾ = 5':'GÜNEŞ = 3   ★ = 2   AY = 5',trail:'🐉  ★  ★  ★  ★  ★  💎',potions:'A 🧪  B ⚗  C ⚗★  D 🧴★',scales:'A ◆ B ◆ C ◆ D ◆<br>E ◆ F ◇ G ◆ H ◆',books:en?'14/N · 3/M · 11/O · 7/O':'14/U · 3/K · 11/D · 7/O',stars:'⭐ 🔷 ⭐ 🌙 ⭐ 🔷<br>⭐ 🌙 ⭐ ⭐ 🌙 ⭐',clock:'🕰'}[k]}
function shell(eye,title,body,nav=''){return `<div class="content"><div class="eyebrow">${eye}</div><h2>${title}</h2>${body}<div class="nav">${nav}</div></div>`}function cover(){return shell(C().eye,C().title,`<p class="lead">${C().lead}</p><div class="egg"></div><div class="meta"><span>AGES 6-10</span><span>1-6 PLAYERS</span><span>35-50 MIN</span><span>8 MISSIONS</span><span>NO PRINTING NEEDED</span></div>`,`<button class="primary" onclick="go('guide')">${C().start}</button>`)}function guide(){return shell(C().guide,C().guide,`<p class="lead">${C().guideBody}</p><div class="mission"><b>PDF + HTML</b><p>${S.lang==='en'?'Choose print or digital. No cutting or special props are required.':'Yazdırma veya dijital oyunu seçin. Kesme veya özel malzeme gerekmez.'}</p></div>`,`<button onclick="go('cover')">${C().back}</button><button class="primary" onclick="S.mission=0;go('mission')">${C().begin}</button>`)}
function mission(){let d=DATA[S.mission],idx=S.mission,answers=L(d.answers),solved=S.solved[idx];let map=DATA.map((x,i)=>`<span class="step ${i===idx?'now':S.solved[i]?'done':''}">${i+1}</span>`).join('');let buttons=answers.map(a=>`<button ${solved?'disabled':''} class="${solved&&a===L(d.correct)?'correct':''}" onclick="answer('${String(a).replace(/'/g,"\'")}')">${esc(a)}</button>`).join('');return shell(`${S.lang==='en'?'MISSION':'GÖREV'} ${idx+1} / 8`,L(d.title),`<div class="map">${map}</div><p><b>${L(d.skill)}</b></p><p class="lead">${L(d.q)}</p><div class="visual">${vis(d.visual)}</div><div class="answers">${buttons}</div><button onclick="toggleHint()">${C().hint}</button><div id="hint" class="hint" hidden>${L(d.hint)}</div><div class="feedback ${solved?'ok':''}">${solved?C().correct:''}</div>${solved&&d.clue?`<div class="hint"><b>${C().clue}:</b> ${L(d.clue)}</div>`:''}`,`<button onclick="prev()">${C().back}</button>${solved?`<button class="primary" onclick="next()">${idx===7?C().toVault:C().next}</button>`:''}`)}function answer(a){let d=DATA[S.mission];if(a===String(L(d.correct))){S.solved[S.mission]=true;save();render()}else{document.querySelector('.feedback').className='feedback bad';document.querySelector('.feedback').textContent=C().wrong}}function toggleHint(){let h=document.getElementById('hint');h.hidden=!h.hidden}function prev(){S.mission>0?(S.mission--,save(),render()):go('guide')}function next(){if(!S.solved[S.mission])return;if(S.mission<7){S.mission++;save();render()}else go('vault')}
const colors=['GOLD','BLUE','GREEN','PURPLE','PINK','ORANGE','MINT','SKY'];const tr={GOLD:'ALTIN',BLUE:'MAVİ',GREEN:'YEŞİL',PURPLE:'MOR',PINK:'PEMBE',ORANGE:'TURUNCU',MINT:'NANE',SKY:'GÖK'};function vault(){let opts=i=>`<select onchange="S.vault[${i}]=this.value;save()"><option value="">${S.lang==='en'?'Color':'Renk'} ${i+1}</option>${colors.map(x=>`<option value="${x}" ${S.vault[i]===x?'selected':''}>${S.lang==='tr'?tr[x]:x}</option>`).join('')}</select>`;return shell('FINAL CHALLENGE',C().vault,`<div class="vault"><p>${C().vaultBody}</p>${[0,1,2,3].map(opts).join('')}<p><button class="primary" onclick="checkVault()">${C().unlock}</button></p><div id="vf" class="feedback"></div></div>`,`<button onclick="S.mission=7;go('mission')">${C().back}</button>`)}function checkVault(){let ok=S.vault.join('-')==='GOLD-BLUE-GREEN-PURPLE';let el=document.getElementById('vf');el.className='feedback '+(ok?'ok':'bad');el.textContent=ok?C().success:C().fail;if(ok)setTimeout(()=>go('cert'),550)}function cert(){return shell('DRAGON ACADEMY',C().cert,`<div class="cert"><div class="egg"></div><p>${C().awarded}</p><input id="certName" value="${esc(S.certName)}" placeholder="${C().name}"><p>${C().certBody}</p><p>★ 🐉 ★</p></div>`,`<button onclick="go('vault')">${C().back}</button><button class="primary" onclick="resetAll()">${C().again}</button>`)}function resetAll(){if(confirm(S.lang==='en'?'Erase saved progress and start again?':'Kayıtlı ilerleme silinsin ve baştan başlansın mı?')){let lang=S.lang;S={lang,screen:'cover',mission:0,solved:Array(8).fill(false),vault:['','','',''],certName:''};save();render()}}function render(){document.documentElement.lang=S.lang;document.getElementById('enBtn').classList.toggle('active',S.lang==='en');document.getElementById('trBtn').classList.toggle('active',S.lang==='tr');document.getElementById('resetBtn').textContent=C().reset;document.getElementById('saved').textContent=C().saved;document.getElementById('bar').style.width=(S.solved.filter(Boolean).length/8*100)+'%';let f={cover,guide,mission,vault,cert}[S.screen]||cover;document.getElementById('app').innerHTML=f();let n=document.getElementById('certName');if(n)n.oninput=()=>{S.certName=n.value;save()}}render();</script></body></html>
