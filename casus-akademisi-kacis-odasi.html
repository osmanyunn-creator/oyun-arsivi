<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="A bilingual, interactive Spy Academy escape-room companion for ages 8 and up.">
<title>Spy Academy / Casus Akademisi: Operation Firefly</title>
<style>
  :root{
    --ink:#16213a; --ink2:#1e2c4d; --orange:#e8622c; --orange-light:#ff8c52;
    --yellow:#ffd166; --paper:#fbf6e9; --paper2:#fff2d8; --text:#16213a; --muted:#8d8a78;
    --shadow:0 18px 40px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ background:var(--ink); color:var(--paper); font-family:'Trebuchet MS',Arial,sans-serif; min-height:100vh; }
  #app{max-width:900px; margin:0 auto; padding:0 16px 60px;}

  .radarhead{ position:relative; height:80px; overflow:hidden; margin-bottom:20px;
    background:radial-gradient(ellipse at 50% 120%, #1e2c4d 0%, var(--ink) 75%);
    border-bottom:1px solid rgba(232,98,44,.3); display:flex; align-items:center; justify-content:center;
  }
  .radar{ position:absolute; left:24px; top:50%; transform:translateY(-50%); width:52px; height:52px; border-radius:50%;
    border:2px solid rgba(255,209,102,.4); background:radial-gradient(circle, rgba(255,209,102,.08), transparent 70%);
  }
  .radar::before{ content:""; position:absolute; inset:10px; border-radius:50%; border:1px solid rgba(255,209,102,.3); }
  .radar::after{ content:""; position:absolute; top:50%; left:50%; width:26px; height:2px; background:linear-gradient(90deg, var(--yellow), transparent);
    transform-origin:left center; animation:sweep 2.4s linear infinite; }
  @keyframes sweep{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
  .brand-text{ font-family:'Poppins'; font-weight:800; font-size:20px; color:var(--yellow); letter-spacing:.01em; }
  .topbar-right{ position:absolute; right:16px; top:50%; transform:translateY(-50%); display:flex; align-items:center; gap:10px; }
  .lang-toggle{display:flex; border:1px solid var(--yellow); border-radius:20px; overflow:hidden;}
  .lang-toggle button{background:transparent; border:none; color:var(--muted); padding:5px 13px; font-family:'Poppins'; font-weight:700; font-size:11.5px; cursor:pointer;}
  .lang-toggle button.active{background:var(--yellow); color:#16213a;}
  .progress-pill{ font-family:'Poppins'; font-weight:700; font-size:12px; color:var(--paper); border:1px solid var(--orange); background:rgba(232,98,44,.25); padding:5px 12px; border-radius:20px;}

  .card{ background:var(--paper); color:var(--text); border-radius:16px; padding:32px 30px 26px; box-shadow:var(--shadow); border:3px solid var(--ink); position:relative; animation:fadeUp .45s ease; }
  @keyframes fadeUp{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }
  .eyebrow{ font-family:'Poppins'; font-weight:700; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--orange); margin:0 0 10px; }
  h1.t{ font-family:'Poppins'; font-weight:800; font-size:clamp(22px,4vw,30px); color:#16213a; margin:0 0 14px; line-height:1.2; }
  h2.t{ font-family:'Poppins'; font-weight:800; font-size:21px; color:#16213a; margin:0 0 12px; }
  .body p{ font-family:'Quicksand',sans-serif; font-weight:500; font-size:16.5px; line-height:1.65; color:var(--text); margin:0 0 14px; }
  .roomtag{ display:inline-block; font-family:'Poppins'; font-weight:700; font-size:11px; letter-spacing:.08em; color:#fff; background:var(--orange); padding:4px 12px; border-radius:20px; margin-bottom:10px; }
  .puzzlebox{ border:3px solid var(--ink); border-radius:14px; padding:18px 20px; margin:16px 0; background:var(--paper2); }
  .puzzlebox .lbl{ font-family:'Poppins'; font-weight:700; font-size:10.5px; color:var(--orange); text-transform:uppercase; letter-spacing:.06em; margin-bottom:8px; }
  .scramble{ font-family:'Poppins'; font-weight:800; font-size:24px; letter-spacing:.25em; text-align:center; background:#fff; border:2px dashed var(--orange); border-radius:10px; padding:12px; margin:10px 0; }
  .answer-row{ display:flex; align-items:center; gap:10px; margin-top:14px; flex-wrap:wrap; }
  .answer-row input{ width:54px; height:54px; text-align:center; font-family:'Poppins'; font-weight:800; font-size:20px; border:3px solid var(--ink); border-radius:10px; background:#fff; color:var(--text); }
  .btn{ background:var(--ink); color:var(--paper); border:2px solid var(--yellow); border-radius:10px; padding:12px 18px; font-family:'Poppins'; font-weight:700; font-size:13.5px; cursor:pointer; transition:.15s; }
  .btn:hover{ background:var(--orange); border-color:var(--orange-light); }
  .btn:focus-visible,.lang-toggle button:focus-visible{outline:3px solid #fff; outline-offset:3px;}
  .btn:disabled{ opacity:.4; cursor:not-allowed; }
  .btn.wide{ width:100%; }
  .btn.ghost{ background:transparent; color:var(--orange); border:2px solid var(--orange); }
  .feedback{ font-family:'Poppins'; font-weight:700; font-size:13px; margin-top:10px; min-height:18px; }
  .feedback.good{ color:#1f8a4c; }
  .feedback.bad{ color:var(--orange); }
  .hint-toggle{ margin-top:14px; }
  .hint-body{ margin-top:10px; border:2px dashed var(--orange); border-radius:10px; padding:12px 14px; background:#fff2d8; font-family:'Quicksand',sans-serif; font-weight:600; font-size:13.5px; color:#5a4020; display:none; }
  .hint-body.open{ display:block; }
  .map-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin:18px 0 8px; }
  .room-card{ background:var(--ink2); border:2px solid var(--yellow); border-radius:14px; padding:16px 14px; text-align:center; cursor:pointer; transition:.15s; color:var(--paper); position:relative; }
  .room-card:hover{ background:var(--orange); border-color:var(--orange-light); }
  .room-card .check{ position:absolute; top:8px; right:10px; color:var(--yellow); font-size:14px; }
  .room-card .name{ font-family:'Poppins'; font-weight:700; font-size:12.5px; }
  .dials{ display:flex; gap:14px; justify-content:center; margin:22px 0; }
  .dial{ width:62px; height:62px; border:4px solid var(--ink); border-radius:14px; display:flex; align-items:center; justify-content:center; font-family:'Poppins'; font-weight:800; font-size:22px; background:#fff; color:var(--text); }
  .dial.empty{ color:#ccc; }
  .choices{ display:flex; flex-direction:column; gap:10px; margin-top:20px; }
  .stamp{ display:inline-block; border:4px solid var(--orange); color:var(--orange); font-family:'Poppins'; font-weight:800; letter-spacing:.04em; padding:8px 20px; transform:rotate(-4deg); border-radius:12px; margin:8px 0 18px; font-size:17px; }
  .banner{ background:rgba(232,98,44,.1); border:2px solid var(--orange); color:#a04420; font-family:'Quicksand',sans-serif; font-weight:700; font-size:13px; padding:10px 14px; border-radius:10px; margin-bottom:16px; }
  .language-card{text-align:center; padding-top:42px; padding-bottom:42px;}
  .language-mark{width:76px;height:76px;margin:0 auto 18px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    border:3px solid var(--ink);background:linear-gradient(145deg,var(--yellow),var(--orange-light));font-weight:800;font-size:24px;}
  .language-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:24px;}
  .offline-note{font-family:'Trebuchet MS',Arial,sans-serif;font-weight:700;font-size:12.5px;color:#5a4020;
    background:#fff2d8;border:2px dashed var(--orange);border-radius:10px;padding:10px 12px;margin:18px 0 0;}
  @media (max-width:640px){
    #app{padding-left:12px;padding-right:12px;}
    .radarhead{height:112px;margin-bottom:14px;align-items:flex-start;}
    .radar{width:38px;height:38px;left:12px;top:30px;}
    .radar::after{width:19px;}
    .brand-text{position:absolute;left:60px;right:12px;top:17px;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .topbar-right{top:auto;right:12px;bottom:14px;transform:none;}
    .card{padding:22px 18px 20px;}
  }
  @media (max-width:420px){
    .language-actions{grid-template-columns:1fr;}
    .scramble{font-size:20px;letter-spacing:.18em;}
    .dials{gap:7px;}
    .dial{width:53px;height:53px;}
  }
  @media (prefers-reduced-motion:reduce){.radar::after,.card{animation:none;}html{scroll-behavior:auto;}}
  .card::before{
    content:""; position:absolute; top:50%; left:50%; width:340px; height:340px;
    transform:translate(-50%,-50%); border-radius:50%; border:3px solid #e8622c;
    opacity:.05; z-index:0; pointer-events:none;
  }
  .card::after{
    content:""; position:absolute; top:50%; left:50%; width:260px; height:260px;
    transform:translate(-50%,-50%); border-radius:50%; border:1px solid #e8622c;
    opacity:.05; z-index:0; pointer-events:none;
  }
  .card > *{ position:relative; z-index:1; }
</style>
</head>
<body>
<div class="radarhead">
  <div class="radar"></div>
  <div class="brand-text" id="brandLabel">SPY ACADEMY</div>
  <div class="topbar-right">
    <div class="progress-pill" id="progressPill">·</div>
    <div class="lang-toggle" aria-label="Language / Dil">
      <button type="button" id="btnEN" onclick="setLang('en')" aria-label="English">EN</button>
      <button type="button" id="btnTR" onclick="setLang('tr')" aria-label="Türkçe">TR</button>
    </div>
  </div>
</div>
<div id="app"></div>

<script>
const T = {
  brand:{en:"SPY ACADEMY", tr:"CASUS AKADEMİSİ"},
  begin:{en:"Begin Training", tr:"Eğitime Başla"},
  cont:{en:"Continue", tr:"Devam Et"},
  oathBtn:{en:"Take the Oath", tr:"Yemini Et"},
  toMap:{en:"See the Academy Map", tr:"Akademi Haritasını Gör"},
  toRooms:{en:"Start Searching", tr:"Aramaya Başla"},
  checkBtn:{en:"Check", tr:"Kontrol Et"},
  correct:{en:"Yes! Digit locked in.", tr:"Evet! Rakam kilitlendi."},
  wrong:{en:"Not quite — try again.", tr:"Tam değil — tekrar dene."},
  showHint:{en:"🔍 Show Hint", tr:"🔍 İpucunu Göster"},
  hideHint:{en:"Hide Hint", tr:"İpucunu Gizle"},
  toVault:{en:"Go to the Vault", tr:"Kasaya Git"},
  needAll:{en:"Solve all four rooms first.", tr:"Önce dört odayı da çözün."},
  enterCode:{en:"Open the Vault", tr:"Kasayı Aç"},
  backHub:{en:"◂ Back to the Map", tr:"◂ Haritaya Dön"},
  playAgain:{en:"Train Again", tr:"Tekrar Eğitim Al"},
  players:{en:"Agents: 1–6 · Time: 20–30 min", tr:"Ajan Sayısı: 1–6 · Süre: 20–30 dakika"},
};

const ROOM_META = [
  {key:"locker", icon:"🔐", en:"Locker Room", tr:"Dolap Odası"},
  {key:"code", icon:"📡", en:"Code Room", tr:"Şifre Odası"},
  {key:"map", icon:"🗺", en:"Map Room", tr:"Harita Odası"},
  {key:"trophy", icon:"🏆", en:"Trophy Room", tr:"Kupa Odası"},
];

const ROOMS = {
  locker:{ digit:"4", title:{en:"Locker 214", tr:"214 Numaralı Dolap"},
    flavor:{en:"Every trainee gets a locker. Taped inside Locker 214, a note left by a trainee before you — letters all jumbled up.",
            tr:"Her çırağın bir dolabı var. 214 numaralı dolabın içine yapıştırılmış, senden önceki bir çırağın bıraktığı, harfleri karman çorman bir not var."},
    puzzleLbl:{en:"Unscramble the Word", tr:"Kelimeyi Çöz"},
    scramble:"R O F U",
    puzzleText:{en:"Unscramble the letters to spell a number!", tr:"Harfleri çözerek bir sayı yaz!"},
    hint:{en:"It rhymes with \"door\" and comes right after three. (FOUR)", tr:"Üçten hemen sonra gelir. (DÖRT)"} },
  code:{ digit:"7", title:{en:"The Agent Wheel", tr:"Ajan Çarkı"},
    flavor:{en:"A poster shows the Academy's secret Agent Wheel — every letter shifted forward by one. Today's number is scrambled on the chalkboard.",
            tr:"Bir poster, Akademi'nin gizli Ajan Çarkı'nı gösteriyor — her harf bir ileri kaydırılmış. Bugünün sayısı kara tahtaya karışık yazılmış."},
    puzzleLbl:{en:"The Agent Wheel", tr:"Ajan Çarkı"},
    scramble:"T F W F O",
    puzzleText:{en:"Shift every letter back by one to reveal a number word!", tr:"Bir sayı ortaya çıkarmak için her harfi bir geri kaydır!"},
    hint:{en:"T comes after S. F comes after E. The answer comes after six and before eight. (SEVEN)", tr:"Cevap altı ile sekiz arasında. (YEDİ)"} },
  map:{ digit:"2", title:{en:"The Clocktower Stairs", tr:"Saat Kulesi Merdivenleri"},
    flavor:{en:"A big map of Old Clocktower Hall covers the table, the stairs marked in careful handwriting.",
            tr:"Eski Saat Kulesi Salonu'nun büyük bir haritası masayı kaplıyor, merdivenler özenli bir el yazısıyla işaretlenmiş."},
    puzzleLbl:{en:"Stair Math", tr:"Merdiven Matematiği"},
    puzzleText:{en:"The clocktower has 12 steps. A secret door opens every 6th step. How many times does it open on the way up?",
                tr:"Saat kulesinde 12 basamak var. Gizli bir kapı her 6. basamakta açılıyor. Tepeye çıkarken kaç kez açılır?"},
    hint:{en:"12 ÷ 6 = ? Count by sixes: 6, 12.", tr:"12 ÷ 6 = ? Altışar say: 6, 12."} },
  trophy:{ digit:"5", title:{en:"The Academy Star", tr:"Akademi Yıldızı"},
    flavor:{en:"The Trophy Room's ceiling is painted with the Academy's star emblem.",
            tr:"Kupa Odası'nın tavanı Akademi'nin yıldız amblemiyle boyanmış."},
    puzzleLbl:{en:"Count the Points", tr:"Köşeleri Say"},
    puzzleText:{en:"⭐ — Count the points on the star. That's your last digit!", tr:"⭐ — Yıldızın köşelerini say. Bu son rakamın!"},
    hint:{en:"Count slowly, one point at a time, all the way around.", tr:"Yavaşça say, bir köşe bir köşe, yıldızın etrafında."} }
};
const ROOM_ORDER = ["locker","code","map","trophy"];

let STATE = { lang:null, screen:"language", digits:{locker:null,code:null,map:null,trophy:null}, hints:{} };

function L(obj){ return obj[STATE.lang || 'en']; }
function setLang(l){
  STATE.lang = l;
  document.documentElement.lang = l;
  document.getElementById('btnEN').classList.toggle('active', l==='en');
  document.getElementById('btnTR').classList.toggle('active', l==='tr');
  document.getElementById('brandLabel').textContent = L(T.brand);
  if(STATE.screen === 'language') STATE.screen = 'cover';
  render();
}
function go(screen){ STATE.screen = screen; window.scrollTo({top:0,behavior:'smooth'}); render(); }
function resetGame(){
  const selectedLang = STATE.lang || 'en';
  STATE = {lang:selectedLang, screen:'cover', digits:{locker:null,code:null,map:null,trophy:null}, hints:{}};
  render();
}
function allSolved(){ return Object.values(STATE.digits).every(d=>d!==null); }
function codeString(){ return ROOM_ORDER.map(k=>STATE.digits[k]).join(""); }
function digitsOnly(input){ input.value = input.value.replace(/\D/g, '').slice(0,1); }
function advanceVault(input,nextId){ digitsOnly(input); if(input.value && nextId) document.getElementById(nextId).focus(); }

function checkDigit(key){
  const input = document.getElementById('input_'+key);
  const fb = document.getElementById('fb_'+key);
  const val = (input.value||"").trim();
  if(val === ROOMS[key].digit){
    STATE.digits[key] = val;
    fb.textContent = L(T.correct); fb.className = "feedback good"; input.disabled = true;
  } else {
    fb.textContent = L(T.wrong); fb.className = "feedback bad";
  }
}
function toggleHint(key){
  STATE.hints[key] = !STATE.hints[key];
  document.getElementById('hint_'+key).classList.toggle('open', STATE.hints[key]);
  document.getElementById('hintbtn_'+key).textContent = STATE.hints[key] ? L(T.hideHint) : L(T.showHint);
}
function checkVault(){
  const boxes = ['v1','v2','v3','v4'].map(id=>document.getElementById(id).value.trim());
  go(boxes.join("") === codeString() ? 'graduated' : 'tryagain');
}
function updateProgressPill(){
  const pill = document.getElementById('progressPill');
  if(!pill) return;
  pill.textContent = Object.values(STATE.digits).filter(d=>d!==null).length + " / 4";
}

function renderLanguage(){
  return `<div class="card language-card">
    <div class="language-mark">SA</div>
    <p class="eyebrow">SPY ACADEMY · CASUS AKADEMİSİ</p>
    <h1 class="t">Choose Your Language<br>Dilini Seç</h1>
    <div class="body"><p>Start the digital mission in English or Turkish.<br>Dijital görevi İngilizce veya Türkçe başlat.</p></div>
    <div class="language-actions">
      <button type="button" class="btn wide" onclick="setLang('en')">English</button>
      <button type="button" class="btn wide" onclick="setLang('tr')">Türkçe</button>
    </div>
    <div class="offline-note">No installation required · Kurulum gerekmez · Works offline / Çevrimdışı çalışır</div>
  </div>`;
}

function renderCover(){
  return `<div class="card">
    <p class="eyebrow">${STATE.lang==='en'?'TOP SECRET · TRAINEE HANDBOOK':'ÇOK GİZLİ · ÇIRAK EL KİTABI'}</p>
    <h1 class="t">${STATE.lang==='en'?'Spy Academy: Operation Firefly':'Casus Akademisi: Operasyon Ateşböceği'}</h1>
    <div class="body"><p>${STATE.lang==='en'?'A print-and-play escape room for trainee agents, ages 8 and up. Four rooms. Four puzzles. One graduation.':'8 yaş ve üzeri çırak ajanlar için bir kaçış odası. Dört oda. Dört bilmece. Bir mezuniyet.'}</p></div>
    <div class="offline-note">${STATE.lang==='en'?'No installation required. This file works offline in your browser.':'Kurulum gerekmez. Bu dosya tarayıcınızda çevrimdışı çalışır.'}</div>
    <div class="choices"><button type="button" class="btn wide" onclick="go('howto')">${L(T.begin)}</button></div>
  </div>`;
}
function renderHowTo(){
  return `<div class="card">
    <p class="eyebrow">${STATE.lang==='en'?'HOW TO PLAY':'NASIL OYNANIR'}</p>
    <h2 class="t">${STATE.lang==='en'?'Welcome, Trainee':'Hoş Geldin, Çırak'}</h2>
    <div class="body">
      <p>${STATE.lang==='en'?'Your team moves through four rooms of Old Clocktower Hall. Solve each puzzle to earn a digit, then unlock the Vault.':"Ekibiniz Eski Saat Kulesi Salonu'nun dört odasından geçiyor. Her bilmeceyi çözerek bir rakam kazanın, sonra Kasa'yı açın."}</p>
      <p style="font-family:'Poppins'; font-size:12.5px; color:var(--muted);">${L(T.players)}</p>
    </div>
    <div class="choices"><button class="btn wide" onclick="go('mission')">${L(T.cont)}</button></div>
  </div>`;
}
function renderMission(){
  return `<div class="card">
    <p class="eyebrow">${STATE.lang==='en'?'THE MISSION':'GÖREV'}</p>
    <h2 class="t">${STATE.lang==='en'?'The Missing Compass':'Kayıp Pusula'}</h2>
    <div class="body">
      <p>${STATE.lang==='en'?"Someone swiped the Academy's Golden Compass right off its pedestal. The Shadow Foxes are the prime suspects — hiding it behind puzzles only a real agent could solve.":"Biri Akademi'nin Altın Pusulası'nı kaidesinden çalmış. Baş şüpheliler Gölge Tilkiler — onu ancak gerçek bir ajanın çözebileceği bilmecelerin ardına saklamışlar."}</p>
    </div>
    <div class="choices"><button class="btn wide" onclick="go('oath')">${L(T.cont)}</button></div>
  </div>`;
}
function renderOath(){
  return `<div class="card">
    <p class="eyebrow">${STATE.lang==='en'?'BEFORE YOU BEGIN':'BAŞLAMADAN ÖNCE'}</p>
    <h2 class="t">${STATE.lang==='en'?'The Agent Oath':'Ajan Yemini'}</h2>
    <div class="body">
      <p style="font-weight:700; text-align:center; font-size:18px;">${STATE.lang==='en'
        ?'"I promise to notice everything, whisper when needed, never trust a talking parrot, and always finish my mission before snack time."'
        :'"Her şeyi fark etmeye, gerektiğinde fısıldamaya, konuşan hiçbir papağana güvenmemeye, ve görevimi her zaman atıştırmalık vaktinden önce bitirmeye söz veriyorum."'}</p>
      <p style="text-align:center; font-style:italic;">${STATE.lang==='en'?'Right hand on heart. Left hand, secret finger-cross.':'Sağ el kalpte. Sol el, gizli parmak çaprazında.'}</p>
    </div>
    <div class="choices"><button class="btn wide" onclick="go('hub')">${L(T.oathBtn)}</button></div>
  </div>`;
}
function renderMap(){
  return `<div class="card">
    <p class="eyebrow">${STATE.lang==='en'?'OLD CLOCKTOWER HALL':'ESKİ SAAT KULESİ SALONU'}</p>
    <h2 class="t">${STATE.lang==='en'?'Four Rooms to Search':'Aranacak Dört Oda'}</h2>
    <div class="map-grid">
      ${ROOM_META.map(r=>`<div class="room-card" onclick="go('${r.key}')">${STATE.digits[r.key]?'<span class="check">✓</span>':''}<div style="font-size:24px;">${r.icon}</div><div class="name">${r[STATE.lang]}</div></div>`).join("")}
    </div>
    <div class="choices"><button class="btn wide" onclick="go('vault')">${L(T.toVault)}</button></div>
  </div>`;
}
function renderRoom(key){
  const r = ROOMS[key];
  const solved = STATE.digits[key] !== null;
  return `<div class="card">
    <span class="roomtag">${ROOM_META.find(m=>m.key===key)[STATE.lang]}</span>
    <h2 class="t">${r.title[STATE.lang]}</h2>
    <div class="body"><p>${r.flavor[STATE.lang]}</p></div>
    <div class="puzzlebox">
      <div class="lbl">${r.puzzleLbl[STATE.lang]}</div>
      ${r.scramble?`<div class="scramble">${r.scramble}</div>`:""}
      <p style="font-family:'Quicksand',sans-serif; font-weight:600; font-size:14.5px; text-align:center; margin:0;">${r.puzzleText[STATE.lang]}</p>
    </div>
    <div class="answer-row">
      <input id="input_${key}" maxlength="1" inputmode="numeric" pattern="[0-9]*" aria-label="${STATE.lang==='en'?'Vault digit':'Kasa rakamı'}" oninput="digitsOnly(this)" onkeydown="if(event.key==='Enter')checkDigit('${key}')" ${solved?'disabled value="'+r.digit+'"':''} placeholder="?">
      <button type="button" class="btn" onclick="checkDigit('${key}')" ${solved?'disabled':''}>${L(T.checkBtn)}</button>
      <span class="feedback ${solved?'good':''}" id="fb_${key}" role="status" aria-live="polite">${solved?L(T.correct):''}</span>
    </div>
    <div class="hint-toggle">
      <button class="btn ghost" id="hintbtn_${key}" onclick="toggleHint('${key}')">${STATE.hints[key]?L(T.hideHint):L(T.showHint)}</button>
      <div class="hint-body ${STATE.hints[key]?'open':''}" id="hint_${key}">${r.hint[STATE.lang]}</div>
    </div>
    <div class="choices" style="margin-top:20px;"><button class="btn ghost wide" onclick="go('hub')">${L(T.backHub)}</button></div>
  </div>`;
}
function renderVault(){
  const ready = allSolved();
  return `<div class="card">
    <p class="eyebrow">${STATE.lang==='en'?'THE CLOCKTOWER VAULT':'SAAT KULESİ KASASI'}</p>
    <h2 class="t">${STATE.lang==='en'?'Four Digits to Graduate':'Mezuniyet İçin Dört Rakam'}</h2>
    <div class="dials">${ROOM_ORDER.map(k=>`<div class="dial ${STATE.digits[k]?'':'empty'}">${STATE.digits[k]||'?'}</div>`).join("")}</div>
    ${ready?`
    <div class="answer-row" style="justify-content:center;">
      <input id="v1" maxlength="1" inputmode="numeric" pattern="[0-9]*" aria-label="1" oninput="advanceVault(this,'v2')" placeholder="?">
      <input id="v2" maxlength="1" inputmode="numeric" pattern="[0-9]*" aria-label="2" oninput="advanceVault(this,'v3')" placeholder="?">
      <input id="v3" maxlength="1" inputmode="numeric" pattern="[0-9]*" aria-label="3" oninput="advanceVault(this,'v4')" placeholder="?">
      <input id="v4" maxlength="1" inputmode="numeric" pattern="[0-9]*" aria-label="4" oninput="advanceVault(this,null)" onkeydown="if(event.key==='Enter')checkVault()" placeholder="?">
    </div>
    <div class="choices"><button class="btn wide" onclick="checkVault()">${L(T.enterCode)}</button></div>`
    : `<p style="text-align:center; font-family:'Poppins'; font-weight:600; color:var(--muted);">${L(T.needAll)}</p>`}
    <div class="choices"><button class="btn ghost wide" onclick="go('hub')">${L(T.backHub)}</button></div>
  </div>`;
}
function renderGraduated(){
  return `<div class="card">
    <div class="stamp">${STATE.lang==='en'?'Graduated!':'Mezun Oldunuz!'}</div>
    <h2 class="t">${STATE.lang==='en'?'The Vault Swings Open':'Kasa Açılıyor'}</h2>
    <div class="body"><p>${STATE.lang==='en'
      ?'There it is — the Golden Compass, safe and shining. Somewhere down the hall, muffled giggling. Your Trainer grins: "Nicely done, Agents. Go on — hold it up. You earned it."'
      :'İşte orada — Altın Pusula, güvende ve parıldıyor. Salonun bir yerinden boğuk kıkırdamalar geliyor. Eğitmeniniz gülümsüyor: "Aferin, Ajanlar. Hadi — kaldırın onu. Bunu hak ettiniz."'}</p></div>
    <div class="choices"><button type="button" class="btn wide" onclick="resetGame()">${L(T.playAgain)}</button></div>
  </div>`;
}
function renderTryAgain(){
  return `<div class="card">
    <div class="stamp" style="border-color:var(--muted); color:var(--muted);">${STATE.lang==='en'?'Not Yet!':'Henüz Değil!'}</div>
    <h2 class="t">${STATE.lang==='en'?'Training Day Continues':'Eğitim Günü Devam Ediyor'}</h2>
    <div class="body"><p>${STATE.lang==='en'
      ?"The Vault doesn't budge — not yet. Even the best agents need a few tries. Check your four digits and give it another go."
      :"Kasa henüz açılmıyor. En iyi ajanlar bile birkaç deneme yapar. Dört rakamınızı kontrol edip tekrar deneyin."}</p></div>
    <div class="choices">
      <button class="btn wide" onclick="go('vault')">${STATE.lang==='en'?'Try Again':'Tekrar Dene'}</button>
      <button type="button" class="btn ghost wide" onclick="resetGame()">${L(T.playAgain)}</button>
    </div>
  </div>`;
}

function render(){
  const app = document.getElementById('app');
  let html = "";
  if(STATE.screen==='language') html = renderLanguage();
  else if(STATE.screen==='cover') html = renderCover();
  else if(STATE.screen==='howto') html = renderHowTo();
  else if(STATE.screen==='mission') html = renderMission();
  else if(STATE.screen==='oath') html = renderOath();
  else if(STATE.screen==='hub') html = renderMap();
  else if(ROOM_ORDER.includes(STATE.screen)) html = renderRoom(STATE.screen);
  else if(STATE.screen==='vault') html = renderVault();
  else if(STATE.screen==='graduated') html = renderGraduated();
  else if(STATE.screen==='tryagain') html = renderTryAgain();
  app.innerHTML = html;
  updateProgressPill();
}
render();
</script>
</body>
</html>
