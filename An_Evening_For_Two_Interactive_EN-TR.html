<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>An Evening For Two — Digital Jar</title>
<meta name="description" content="A self-contained bilingual digital date-night jar with 50 cards for couples.">
<style>
  :root{
    --cream:#fbf3ea; --cream2:#f5e9db; --ink:#3a2a28;
    --wine:#7a2c3b; --wine-light:#9c4256;
    --terracotta:#c1683f; --mustard:#b8873a; --sage:#6f8a5e; --dusty:#6c7ea3;
    --gold:#c9a15c; --muted:#8a7568;
    --shadow:0 18px 40px rgba(58,42,40,.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:linear-gradient(180deg,#fdf6ef 0%, #f6e9de 100%);
    color:var(--ink); font-family:Georgia,'Times New Roman',serif; min-height:100vh;
  }
  #app{max-width:760px; margin:0 auto; padding:0 16px 60px;}
  .topbar{
    display:flex; align-items:center; justify-content:space-between; padding:20px 4px 10px;
  }
  .brand{ font-family:Georgia,'Times New Roman',serif; font-weight:700; font-size:19px; color:var(--wine); }
  .lang-toggle{ display:flex; border:1px solid var(--wine); border-radius:20px; overflow:hidden; }
  .lang-toggle button{ background:transparent; border:none; color:var(--muted); padding:6px 14px; font-family:Arial,'Helvetica Neue',sans-serif; font-weight:600; font-size:12px; cursor:pointer; }
  .lang-toggle button.active{ background:var(--wine); color:#fff; }

  .card{
    background:var(--cream); border-radius:16px; padding:34px 30px 28px; box-shadow:var(--shadow);
    border:1px solid #e8d6c2; position:relative; animation:fadeUp .4s ease;
  }
  @keyframes fadeUp{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }
  .eyebrow{ font-family:Arial,'Helvetica Neue',sans-serif; font-weight:600; font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--wine); margin:0 0 10px; }
  h1.t{ font-family:Georgia,'Times New Roman',serif; font-weight:700; font-size:clamp(22px,4.2vw,30px); color:var(--ink); margin:0 0 14px; line-height:1.2; }
  h2.t{ font-family:Georgia,'Times New Roman',serif; font-weight:700; font-size:21px; color:var(--ink); margin:0 0 6px; }
  .tagline{ font-family:'Segoe Print','Comic Sans MS',cursive; font-size:20px; color:var(--wine-light); margin:0 0 18px; }
  .body p{ font-size:15px; line-height:1.75; color:var(--ink); margin:0 0 14px; }
  .btn{ background:var(--wine); color:#fff; border:none; border-radius:30px; padding:13px 22px; font-family:Arial,'Helvetica Neue',sans-serif; font-weight:600; font-size:14.5px; cursor:pointer; transition:.15s; }
  .btn:hover{ background:var(--wine-light); }
  .btn.wide{ width:100%; }
  .btn.ghost{ background:transparent; color:var(--wine); border:1.5px solid var(--wine); }
  .choices{ display:flex; flex-direction:column; gap:10px; margin-top:22px; }

  .catgrid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px; margin:18px 0 8px; }
  .catcard{
    border-radius:14px; padding:20px 18px; text-align:center; cursor:pointer; color:#fff; transition:.15s;
    position:relative; overflow:hidden; box-shadow:0 8px 18px rgba(0,0,0,.12);
  }
  .catcard:hover{ transform:translateY(-2px); }
  .catcard .heart{ font-size:22px; margin-bottom:8px; display:block; }
  .catcard .name{ font-family:Georgia,'Times New Roman',serif; font-weight:700; font-size:15px; }
  .catcard .count{ font-family:Arial,'Helvetica Neue',sans-serif; font-size:11px; opacity:.85; margin-top:4px; }
  .cat-romantic{ background:linear-gradient(145deg,var(--wine),var(--wine-light)); }
  .cat-adventurous{ background:linear-gradient(145deg,#c1683f,#d68256); }
  .cat-cozy{ background:linear-gradient(145deg,#a9782f,var(--mustard)); }
  .cat-budget{ background:linear-gradient(145deg,#5c7a4c,var(--sage)); }
  .cat-conversation{ background:linear-gradient(145deg,#576a94,var(--dusty)); }
  .cat-blank{ background:linear-gradient(145deg,#8a7568,#a89484); }

  .draw-any{ margin:18px 0 4px; text-align:center; }

  .flip-stage{ perspective:1400px; margin:10px 0 6px; }
  .flip-card{ position:relative; width:100%; min-height:230px; }
  .flip-inner{ position:relative; width:100%; height:100%; transition:transform .5s; transform-style:preserve-3d; }
  .flip-card.flipping .flip-inner{ transform:rotateY(180deg); }
  .flip-face{ position:absolute; inset:0; backface-visibility:hidden; border-radius:14px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:26px; }
  .flip-front{ background:repeating-linear-gradient(135deg,var(--cream2),var(--cream2) 10px,#efe0cd 10px,#efe0cd 20px); border:2px dashed var(--gold); color:var(--wine); }
  .flip-front .bigheart{ font-size:40px; margin-bottom:10px; }
  .flip-back{ background:var(--cream); border:1.5px solid var(--gold); transform:rotateY(180deg); box-shadow:0 10px 24px rgba(0,0,0,.1); }
  .flip-back .cattag{ font-family:Arial,'Helvetica Neue',sans-serif; font-weight:700; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:#fff; padding:4px 14px; border-radius:12px; margin-bottom:14px; }
  .flip-back p{ font-family:Georgia,'Times New Roman',serif; font-size:18px; font-style:italic; color:var(--ink); line-height:1.5; margin:0; }
  .flip-back .fortwo{ font-family:'Segoe Print','Comic Sans MS',cursive; font-size:17px; color:var(--muted); margin-top:14px; }

  .blankstrip{ border:2px dashed var(--gold); border-radius:10px; padding:20px; margin-bottom:12px; background:var(--cream2); text-align:center; color:var(--muted); font-family:'Segoe Print','Comic Sans MS',cursive; font-size:18px; }

  table.logtable{ width:100%; border-collapse:collapse; margin-top:16px; }
  table.logtable th{ background:var(--wine); color:#fff; font-family:Arial,'Helvetica Neue',sans-serif; font-weight:600; font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; padding:9px 10px; text-align:left; border-radius:0; }
  table.logtable td{ padding:10px; font-size:13.5px; border-bottom:1px solid #e8d6c2; }
  table.logtable tr:nth-child(even) td{ background:var(--cream2); }
  .logform{ display:grid; grid-template-columns:1fr 2fr 1fr auto; gap:8px; margin-top:14px; }
  .logform input,.logform select{ font-family:Georgia,'Times New Roman',serif; padding:9px 10px; border:1px solid #d9c3a8; border-radius:8px; background:#fff; font-size:13px; }
  @media (max-width:560px){ .logform{ grid-template-columns:1fr; } }
  .heartbtn{ background:none; border:none; cursor:pointer; font-size:15px; color:var(--muted); }
  .delbtn{ background:none; border:none; cursor:pointer; color:var(--wine); font-size:13px; }

  footer.pagefoot{ text-align:center; padding:30px 10px 10px; color:var(--muted); font-family:Georgia,'Times New Roman',serif; font-size:11.5px; }
  .privacy-note{ text-align:center; color:var(--muted); font:11px Arial,'Helvetica Neue',sans-serif; margin-top:16px; }
  .table-scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
  button:focus-visible,input:focus-visible,select:focus-visible{ outline:3px solid var(--gold); outline-offset:2px; }
  @media (max-width:560px){
    .topbar{padding-top:14px; gap:10px;}
    .brand{font-size:16px; line-height:1.1;}
    .card{padding:25px 18px 22px;}
    .catgrid{grid-template-columns:1fr 1fr; gap:10px;}
    .catcard{padding:16px 10px;}
    table.logtable{min-width:560px;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>

const T = {
  brand:{en:"An Evening For Two", tr:"İkimiz İçin Bir Akşam"},
  tagline:{en:"50 ways to put the phones down and look at each other again.", tr:"Telefonları bırakıp birbirinize yeniden bakmanın 50 yolu."},
  openJar:{en:"Open the Jar", tr:"Kavanozu Aç"},
  howTitle:{en:"How To Use This Jar", tr:"Bu Kavanoz Nasıl Kullanılır"},
  howBody:{en:"Pick a category below, or draw completely at random. Once a week — or whenever the routine feels a little too routine — pull one out and do exactly what it says, no substitutions.", tr:"Aşağıdan bir kategori seçin, ya da tamamen rastgele çekin. Haftada bir — ya da rutin biraz fazla rutinleşmiş hissettirdiğinde — bir tane çekin ve tam olarak yazdığını yapın, değiştirmeden."},
  begin:{en:"Continue to the Jar", tr:"Kavanoza Devam Et"},
  jarTitle:{en:"Pick a Category", tr:"Bir Kategori Seçin"},
  drawAny:{en:"🎲 Draw Any Card", tr:"🎲 Rastgele Bir Kart Çek"},
  cards:{en:"cards", tr:"kart"},
  back:{en:"◂ Back to the Jar", tr:"◂ Kavanoza Dön"},
  drawAnother:{en:"Draw Another", tr:"Bir Tane Daha Çek"},
  fortwo:{en:"— for two", tr:"— ikiniz için"},
  logTitle:{en:"Date Night Log", tr:"Date Night Günlüğü"},
  logSub:{en:"A small record of the nights you didn't let slip by.", tr:"Kaçırmadığınız gecelerin küçük bir kaydı."},
  colDate:{en:"Date", tr:"Tarih"},
  colWhat:{en:"What you did", tr:"Ne yaptınız"},
  colRate:{en:"Rating", tr:"Puan"},
  addEntry:{en:"Add", tr:"Ekle"},
  viewLog:{en:"📖 Date Night Log", tr:"📖 Date Night Günlüğü"},
  blankInfo:{en:"Cut out blank strips and add your own ideas, inside jokes, or memories. These become the most-picked cards in the jar.", tr:"Boş şeritleri kesip kendi fikirlerinizi, içeriden şakalarınızı ya da anılarınızı ekleyin. Kavanozda en çok çekilen kartlar genelde bunlar olur."},
  yourTurn:{en:"Your turn to write one...", tr:"Sıra sizde, bir tane yazın..."},
  closing:{en:"Enjoy the evening. Small moments make the big relationship.", tr:"İyi eğlenceler. Küçük anlar, büyük ilişkiyi oluşturur."},
};

const PREF_KEY = "eveningfortwo_preferences_v1";
const DECKS = {};
let STATE = { lang:loadLanguage(), screen:"cover", currentCat:null, currentCard:null, flipped:false };

function L(obj){ return obj[STATE.lang]; }
function loadLanguage(){
  try{
    const saved = JSON.parse(localStorage.getItem(PREF_KEY)||"{}");
    return ["en","tr"].includes(saved.lang) ? saved.lang : "en";
  }catch(_){ return "en"; }
}
function savePreferences(){ try{ localStorage.setItem(PREF_KEY,JSON.stringify({lang:STATE.lang})); }catch(_){} }
function setLang(l){ STATE.lang = l; document.documentElement.lang = l; savePreferences(); render(); }
function go(screen){ STATE.screen = screen; STATE.flipped=false; window.scrollTo({top:0,behavior:'smooth'}); render(); }

function shuffledIndices(length){
  const values = Array.from({length},(_,i)=>i);
  for(let i=values.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [values[i],values[j]]=[values[j],values[i]];
  }
  return values;
}
function nextCard(cat){
  if(!DECKS[cat] || DECKS[cat].length===0) DECKS[cat]=shuffledIndices(CARDS[cat].length);
  return CARDS[cat][DECKS[cat].pop()];
}

function drawCard(catKey){
  let pool, cat;
  if(catKey === 'any'){
    const keys = Object.keys(CARDS);
    cat = keys[Math.floor(Math.random()*keys.length)];
  } else {
    cat = catKey;
  }
  const card = nextCard(cat);
  STATE.currentCat = cat;
  STATE.currentCard = card;
  STATE.flipped = false;
  STATE.screen = 'draw';
  render();
  setTimeout(()=>{ STATE.flipped = true; document.querySelector('.flip-card')?.classList.add('flipping'); }, 120);
}
function drawAgain(){
  const card = nextCard(STATE.currentCat);
  STATE.currentCard = card;
  STATE.flipped = false;
  render();
  setTimeout(()=>{ document.querySelector('.flip-card')?.classList.add('flipping'); }, 120);
}

/* ---------- Date Night Log (localStorage) ---------- */
function getLog(){ try{ return JSON.parse(localStorage.getItem('eveningfortwo_log')||'[]'); }catch(e){ return []; } }
function saveLog(entries){ try{ localStorage.setItem('eveningfortwo_log', JSON.stringify(entries)); }catch(_){} }
function escapeHTML(value){
  return String(value).replace(/[&<>'"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[ch]));
}
function addLogEntry(){
  const d = document.getElementById('logDate').value;
  const w = document.getElementById('logWhat').value.trim();
  const r = document.getElementById('logRate').value;
  if(!w) return;
  const entries = getLog();
  entries.unshift({date:d||'', what:w, rate:r});
  saveLog(entries);
  render();
}
function delLogEntry(idx){
  const entries = getLog();
  entries.splice(idx,1);
  saveLog(entries);
  render();
}

function renderCover(){
  return `<div class="card">
    <p class="eyebrow">${STATE.lang==='en'?'A KEEPSAKE ACTIVITY COLLECTION':'SAKLANACAK BİR AKTİVİTE KOLEKSİYONU'}</p>
    <h1 class="t">${L(T.brand)}</h1>
    <p class="tagline">${L(T.tagline)}</p>
    <div class="choices"><button class="btn wide" onclick="go('howto')">${L(T.openJar)}</button></div>
    <div class="privacy-note">${STATE.lang==='en'?'Works offline · 50 cards · No account · No data is collected':'Çevrimdışı çalışır · 50 kart · Hesap gerekmez · Veri toplanmaz'}</div>
  </div>`;
}
function renderHowTo(){
  return `<div class="card">
    <p class="eyebrow">${STATE.lang==='en'?'BEFORE YOU BEGIN':'BAŞLAMADAN ÖNCE'}</p>
    <h1 class="t">${L(T.howTitle)}</h1>
    <div class="body"><p>${L(T.howBody)}</p></div>
    <div class="choices"><button class="btn wide" onclick="go('jar')">${L(T.begin)}</button></div>
  </div>`;
}
function renderJar(){
  const keys = Object.keys(CATS).filter(k=>k!=='blank');
  return `<div class="card">
    <p class="eyebrow">${STATE.lang==='en'?'THE JAR':'KAVANOZ'}</p>
    <h1 class="t">${L(T.jarTitle)}</h1>
    <div class="catgrid">
      ${keys.map(k=>`<div class="catcard ${CATS[k].cls}" onclick="drawCard('${k}')">
        <span class="heart">${CATS[k].icon}</span>
        <div class="name">${CATS[k][STATE.lang]}</div>
        <div class="count">${CARDS[k].length} ${L(T.cards)}</div>
      </div>`).join("")}
      <div class="catcard ${CATS.blank.cls}" onclick="go('blank')">
        <span class="heart">${CATS.blank.icon}</span>
        <div class="name">${CATS.blank[STATE.lang]}</div>
        <div class="count">${STATE.lang==='en'?'bonus':'bonus'}</div>
      </div>
    </div>
    <div class="draw-any"><button class="btn wide" onclick="drawCard('any')">${L(T.drawAny)}</button></div>
    <div class="choices">
      <button class="btn ghost wide" onclick="go('log')">${L(T.viewLog)}</button>
    </div>
  </div>`;
}
function renderDraw(){
  const cat = CATS[STATE.currentCat];
  const card = STATE.currentCard;
  return `<div class="card">
    <p class="eyebrow">${cat[STATE.lang]}</p>
    <div class="flip-stage">
      <div class="flip-card ${STATE.flipped?'flipping':''}"><div class="flip-inner">
        <div class="flip-face flip-front"><span class="bigheart">${cat.icon}</span>${STATE.lang==='en'?'Drawing...':'Çekiliyor...'}</div>
        <div class="flip-face flip-back">
          <span class="cattag" style="background:${catColor(STATE.currentCat)};">${cat[STATE.lang]}</span>
          <p>${card[STATE.lang]}</p>
          <div class="fortwo">${L(T.fortwo)}</div>
        </div>
      </div></div>
    </div>
    <div class="choices">
      <button class="btn wide" onclick="drawAgain()">${L(T.drawAnother)}</button>
      <button class="btn ghost wide" onclick="go('jar')">${L(T.back)}</button>
    </div>
  </div>`;
}
function catColor(k){
  const map = { romantic:'var(--wine)', adventurous:'var(--terracotta)', cozy:'var(--mustard)', budget:'var(--sage)', conversation:'var(--dusty)' };
  return map[k] || 'var(--wine)';
}
function renderBlank(){
  return `<div class="card">
    <p class="eyebrow">${STATE.lang==='en'?'BONUS':'BONUS'}</p>
    <h1 class="t">${CATS.blank[STATE.lang]}</h1>
    <div class="body"><p>${L(T.blankInfo)}</p></div>
    <div class="blankstrip">${L(T.yourTurn)}</div>
    <div class="blankstrip">${L(T.yourTurn)}</div>
    <div class="blankstrip">${L(T.yourTurn)}</div>
    <div class="choices"><button class="btn ghost wide" onclick="go('jar')">${L(T.back)}</button></div>
  </div>`;
}
function renderLog(){
  const entries = getLog();
  const rows = entries.map((e,i)=>`<tr>
      <td>${escapeHTML(e.date||'—')}</td><td>${escapeHTML(e.what)}</td><td>${'♡'.repeat(parseInt(e.rate)||0)}</td>
      <td><button class="delbtn" aria-label="${STATE.lang==='en'?'Delete entry':'Kaydı sil'}" onclick="delLogEntry(${i})">✕</button></td>
    </tr>`).join("");
  return `<div class="card">
    <p class="eyebrow">${STATE.lang==='en'?'KEEPSAKE':'HATIRA'}</p>
    <h1 class="t">${L(T.logTitle)}</h1>
    <p class="tagline">${L(T.logSub)}</p>
    <div class="logform">
      <input type="date" id="logDate">
      <input type="text" id="logWhat" placeholder="${STATE.lang==='en'?'What did you do?':'Ne yaptınız?'}">
      <select id="logRate"><option value="5">♡♡♡♡♡</option><option value="4">♡♡♡♡</option><option value="3">♡♡♡</option><option value="2">♡♡</option><option value="1">♡</option></select>
      <button class="btn" onclick="addLogEntry()">${L(T.addEntry)}</button>
    </div>
    <div class="table-scroll"><table class="logtable"><thead><tr><th>${L(T.colDate)}</th><th>${L(T.colWhat)}</th><th>${L(T.colRate)}</th><th></th></tr></thead>
    <tbody>${rows || `<tr><td colspan="4" style="text-align:center; color:var(--muted); font-style:italic;">${STATE.lang==='en'?'No nights logged yet.':'Henüz kayıtlı bir gece yok.'}</td></tr>`}</tbody></table></div>
    <div class="choices"><button class="btn ghost wide" onclick="go('jar')">${L(T.back)}</button></div>
  </div>`;
}

function render(){
  const app = document.getElementById('app');
  let inner = "";
  if(STATE.screen==='cover') inner = renderCover();
  else if(STATE.screen==='howto') inner = renderHowTo();
  else if(STATE.screen==='jar') inner = renderJar();
  else if(STATE.screen==='draw') inner = renderDraw();
  else if(STATE.screen==='blank') inner = renderBlank();
  else if(STATE.screen==='log') inner = renderLog();

  app.innerHTML = `
    <div class="topbar">
      <div class="brand" onclick="go('jar')" style="cursor:pointer;">${L(T.brand)}</div>
      <div class="lang-toggle">
        <button class="${STATE.lang==='en'?'active':''}" onclick="setLang('en')">EN</button>
        <button class="${STATE.lang==='tr'?'active':''}" onclick="setLang('tr')">TR</button>
      </div>
    </div>
    ${inner}
    <footer class="pagefoot">${L(T.closing)}</footer>
  `;
  document.documentElement.lang = STATE.lang;
}
render();
</script>
</body>
</html>
