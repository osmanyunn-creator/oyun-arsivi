<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#11152e"><title>Forbidden Magic School - Interactive Adventure</title><style>:root{--night:#11152e;--indigo:#242153;--purple:#5b2d7d;--amethyst:#9a66c7;--gold:#e2b84b;--emerald:#2c846f;--cyan:#55c9d6;--rose:#c44b75;--paper:#f5eacc;--ink:#211d2a}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#55316f 0,var(--indigo) 34%,var(--night) 78%);color:white;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;background-image:radial-gradient(circle,#e2b84b 0 1px,transparent 2px);background-size:43px 43px}.top{position:sticky;top:0;z-index:5;background:#11152ef2;border-bottom:1px solid #e2b84b88;backdrop-filter:blur(12px)}.topin{max-width:1050px;margin:auto;padding:10px 15px;display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{color:var(--gold);font:900 13px ui-monospace,monospace;letter-spacing:.12em}.actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:flex-end}button{font:800 12px system-ui;border:1px solid var(--gold);border-radius:999px;background:transparent;color:white;padding:8px 12px;cursor:pointer}button.active{background:var(--gold);color:var(--night)}button.primary{border:0;border-radius:13px;padding:13px 18px;background:linear-gradient(90deg,var(--purple),var(--rose));color:white;font-size:15px}.timer{font:900 13px ui-monospace,monospace;color:var(--gold)}.saved{font-size:10px;color:#d9d4df}.wrap{max-width:1050px;margin:auto;padding:25px 15px 70px}.progress{height:9px;background:#ffffff22;border-radius:99px;margin-bottom:18px;overflow:hidden}.progress span{height:100%;display:block;background:linear-gradient(90deg,var(--purple),var(--amethyst),var(--cyan),var(--gold));transition:width .3s}.card{position:relative;overflow:hidden;background:var(--paper);color:var(--ink);border:1px solid var(--gold);border-radius:22px;padding:clamp(22px,5vw,46px);box-shadow:0 28px 80px #0009}.card:after{content:"";position:absolute;width:190px;height:190px;right:-95px;bottom:-95px;border-radius:50%;border:22px double #9a66c722}.content{position:relative;z-index:1}.eyebrow{font:900 11px ui-monospace,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--purple)}h1,h2{font-family:Georgia,serif;color:var(--night);margin:.25em 0}h1{font-size:clamp(39px,8vw,68px);line-height:.96}h2{font-size:clamp(28px,5vw,43px)}.lead{font-size:18px;line-height:1.6}.book{width:230px;height:150px;margin:28px auto;position:relative;background:linear-gradient(135deg,var(--purple),var(--indigo));border:7px solid var(--gold);border-radius:13px 13px 28px 28px;box-shadow:0 0 55px #55c9d688}.book:before{content:"✦";position:absolute;inset:0;display:grid;place-items:center;color:var(--gold);font-size:55px}.meta,.nav,.map{display:flex;gap:9px;flex-wrap:wrap}.meta span,.step{background:#e4d5af;color:var(--ink);padding:8px 11px;border-radius:999px;font:900 12px ui-monospace,monospace}.nav{margin-top:25px}.nav .primary{flex:1;min-width:180px}.step.now{background:var(--purple);color:white}.step.done{background:var(--emerald);color:white}.mission{background:white;border:1px solid #d7c79d;border-radius:17px;padding:18px;margin:16px 0}.visual{min-height:170px;display:grid;place-items:center;background:var(--indigo);color:white;border:1px solid var(--gold);border-radius:16px;padding:18px;text-align:center;font:800 clamp(17px,5vw,34px) ui-monospace,monospace;line-height:1.7}.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:18px 0}.answers button{color:var(--ink);background:white;border:2px solid #d7c79d;border-radius:12px;padding:13px}.answers button:hover{border-color:var(--purple)}.answers button.correct{background:#d9f2e9;border-color:var(--emerald)}.feedback{font-weight:900;min-height:24px}.ok{color:var(--emerald)}.bad{color:var(--rose)}.hint{background:#fff1bd;border-left:5px solid var(--gold);padding:13px 15px;border-radius:9px;margin-top:12px}.seal{text-align:center;background:var(--indigo);color:white;border-radius:17px;padding:25px}.seal h2{color:white}.cert{text-align:center;background:var(--night);color:white;border:8px double var(--gold);border-radius:18px;padding:30px}.cert h2{color:white}.cert input{width:min(100%,450px);padding:11px;border:0;border-bottom:2px solid var(--cyan);background:transparent;color:white;text-align:center;font-size:20px}@media(max-width:700px){.answers{grid-template-columns:1fr}.brand{font-size:11px}.timer{order:3;width:100%;text-align:right}}@media print{.top,.progress,.nav{display:none!important}body{background:white}.wrap{padding:0}.card{box-shadow:none;border:0}}</style></head><body><header class="top"><div class="topin"><div class="brand">MOONVEIL // SEALED FILE</div><div class="actions"><span id="saved" class="saved">Saved locally</span><span id="timer" class="timer">60:00</span><button id="startBtn" onclick="timerStart()">Start</button><button id="pauseBtn" onclick="timerPause()">Pause</button><button id="enBtn" onclick="setLang('en')">EN</button><button id="trBtn" onclick="setLang('tr')">TR</button><button id="resetBtn" onclick="resetAll()">Reset</button></div></div></header><main class="wrap"><div class="progress"><span id="bar"></span></div><section class="card" id="app"></section></main><script>const DATA=[{"n": 1, "title": ["Potion Lab", "İksir Laboratuvarı"], "skill": ["EVEN NUMBERS", "ÇİFT SAYILAR"], "story": ["Professor Elowen left five labeled ingredients on the moonstone bench.", "Profesör Elowen aytaşı tezgâhında beş numaralı malzeme bıraktı."], "task": ["Choose ingredients with EVEN numbers. Read their first letters from left to right.", "Numarası ÇİFT olan malzemeleri seçin. İlk harflerini soldan sağa okuyun."], "result": ["MOR", "ABK"], "hint": ["Select 2, 4 and 6.", "2, 4 ve 6’yı seçin."], "answers": [["MOR", "DOR", "MOS", "ROW"], ["ABK", "AEK", "BYK", "ABY"]]}, {"n": 2, "title": ["Wand Decoder", "Asa Şifre Çözücü"], "skill": ["NUMBER TO LETTER", "SAYIDAN HARFE"], "story": ["A training wand has stored four numbers in its crystal core.", "Bir eğitim asası kristal çekirdeğinde dört sayı saklıyor."], "task": ["Use A=1, B=2 ... Z=26 to decode 15 - 16 - 5 - 14.", "A=1, B=2 ... Z=26 kuralıyla 15 - 16 - 5 - 14 dizisini çözün."], "result": ["OPEN", "OPEN"], "hint": ["15=O. Continue with the same alphabet rule.", "15=O. Aynı alfabe kuralıyla devam edin."], "answers": [["OPEN", "MOON", "WAND", "MAGE"], ["OPEN", "MOON", "WAND", "MAGE"]]}, {"n": 3, "title": ["Owl Mail", "Baykuş Postası"], "skill": ["LOGIC MATCH", "MANTIK EŞLEŞTİRME"], "story": ["Three academy owls wait with letters for the Greenhouse, Tower and Library.", "Üç akademi baykuşu Sera, Kule ve Kütüphane mektuplarıyla bekliyor."], "task": ["Small is not Library. Medium goes to Tower. Large is not Tower. Record destinations Small - Medium - Large.", "Küçük Kütüphaneye gitmez. Orta Kuleye gider. Büyük Kuleye gitmez. Küçük - Orta - Büyük hedeflerini yazın."], "result": ["GREENHOUSE - TOWER - LIBRARY", "SERA - KULE - KÜTÜPHANE"], "hint": ["After Medium takes Tower, Small cannot take Library.", "Orta Kuleyi alınca Küçük Kütüphaneyi alamaz."], "answers": [["GREENHOUSE - TOWER - LIBRARY", "LIBRARY - TOWER - GREENHOUSE", "TOWER - GREENHOUSE - LIBRARY", "GREENHOUSE - LIBRARY - TOWER"], ["SERA - KULE - KÜTÜPHANE", "KÜTÜPHANE - KULE - SERA", "KULE - SERA - KÜTÜPHANE", "SERA - KÜTÜPHANE - KULE"]]}, {"n": 4, "title": ["Forbidden Library", "Yasak Kütüphane"], "skill": ["ODD SHELVES", "TEK RAFLAR"], "story": ["The librarian hid a page marker among seven enchanted books.", "Kütüphaneci yedi büyülü kitap arasına bir sayfa işareti sakladı."], "task": ["Take the FIRST letter from books on ODD shelves 1, 3, 5 and 7.", "1, 3, 5 ve 7 numaralı TEK raflardaki kitapların İLK harfini alın."], "result": ["PAGE", "PAGE"], "hint": ["Ignore shelves 2, 4 and 6.", "2, 4 ve 6 numaralı rafları kullanmayın."], "answers": [["PAGE", "RUNE", "MAPS", "GLOW"], ["PAGE", "RUNE", "MAPS", "GLOW"]]}, {"n": 5, "title": ["Celestial Chamber", "Göksel Oda"], "skill": ["REPEATING PATTERN", "TEKRAR EDEN DESEN"], "story": ["The enchanted ceiling repeats a moon-and-star sequence.", "Büyülü tavan ay ve yıldız dizisini tekrar ediyor."], "task": ["Complete: FULL MOON - CRESCENT - STAR - FULL MOON - CRESCENT - ?", "Tamamlayın: DOLUNAY - HİLAL - YILDIZ - DOLUNAY - HİLAL - ?"], "result": ["STAR", "YILDIZ"], "hint": ["The pattern has three symbols and then repeats.", "Desen üç sembolden oluşur ve tekrar eder."], "answers": [["STAR", "FULL MOON", "CRESCENT", "COMET"], ["YILDIZ", "DOLUNAY", "HİLAL", "KUYRUKLU YILDIZ"]]}, {"n": 6, "title": ["Magical Creatures", "Büyülü Yaratıklar"], "skill": ["TRACK COMPARISON", "İZ KARŞILAŞTIRMA"], "story": ["Four magical creatures crossed the courtyard after curfew.", "Dört büyülü yaratık yasak saatten sonra avludan geçti."], "task": ["Find the only creature whose track has four toes.", "İzinde dört parmak bulunan tek yaratığı bulun."], "result": ["EMBER GRIFFIN", "EMBER GRİFONU"], "hint": ["Three tracks have 3 toes. One has 4.", "Üç izde 3 parmak, bir izde 4 parmak var."], "answers": [["EMBER GRIFFIN", "MOSS GOBLIN", "CAVE SPRITE", "RAVEN BEAST"], ["EMBER GRİFONU", "YOSUN CİNİ", "MAĞARA PERİSİ", "KUZGUN CANAVARI"]]}, {"n": 7, "title": ["Crystal Ball", "Kristal Küre"], "skill": ["NUMBER SEQUENCE", "SAYI DİZİSİ"], "story": ["The crystal ball flashes a sequence that grows at a steady rate.", "Kristal küre düzenli artan bir sayı dizisi gösteriyor."], "task": ["Find the next number in 3 - 6 - 9 - 12 - ?. Convert it to a letter using 1=A.", "3 - 6 - 9 - 12 - ? dizisindeki sıradaki sayıyı bulun. 1=A kuralıyla harfe çevirin."], "result": ["15 / O", "15 / O"], "hint": ["Add 3 each time.", "Her adımda 3 ekleyin."], "answers": [["15 / O", "14 / N", "16 / P", "18 / R"], ["15 / O", "14 / N", "16 / P", "18 / R"]]}, {"n": 8, "title": ["Secret Door Runes", "Gizli Kapı Rünleri"], "skill": ["ORDER VALUES", "DEĞERLERİ SIRALA"], "story": ["Five glowing runes float above the sealed archive door.", "Mühürlü arşiv kapısının üzerinde beş rün parlıyor."], "task": ["Order runes from value 1 to 5 and read their letters.", "Rünleri 1’den 5’e sıralayın ve harfleri okuyun."], "result": ["NIGHT", "NIGHT"], "hint": ["Begin with the rune marked value 1.", "1 değerli rünle başlayın."], "answers": [["NIGHT", "THING", "LIGHT", "NORTH"], ["NIGHT", "THING", "LIGHT", "NORTH"]]}, {"n": 9, "title": ["Spellbook Fragments", "Büyü Kitabı Parçaları"], "skill": ["SENTENCE BUILDING", "CÜMLE OLUŞTURMA"], "story": ["Loose parchment fragments drift through the hidden archive.", "Gizli arşivde parşömen parçaları havada süzülüyor."], "task": ["Choose and order the fragments that form the warning.", "Uyarıyı oluşturan parçaları seçin ve sıralayın."], "result": ["THE SPELLBOOK IS HIDDEN BELOW", "BÜYÜ KİTABI AŞAĞIDA GİZLİ"], "hint": ["Start with the subject: THE SPELLBOOK / BÜYÜ KİTABI.", "Özneyle başlayın: THE SPELLBOOK / BÜYÜ KİTABI."], "answers": [["THE SPELLBOOK IS HIDDEN BELOW", "THE PURPLE SPELLBOOK SINGS", "THE SPELLBOOK IS PURPLE", "HIDDEN SPELLBOOK SINGS BELOW"], ["BÜYÜ KİTABI AŞAĞIDA GİZLİ", "MOR BÜYÜ KİTABI ŞARKI SÖYLÜYOR", "BÜYÜ KİTABI MOR", "AŞAĞIDA GİZLİ BÜYÜ ŞARKISI"]]}, {"n": 10, "title": ["The Final Seal", "Final Mührü"], "skill": ["EVIDENCE SYNTHESIS", "KANIT BİRLEŞTİRME"], "story": ["The spellbook is found, but four locks still bind its cover.", "Büyü kitabı bulundu ama kapağını dört kilit hâlâ bağlıyor."], "task": ["Take the FIRST letter of Mission 2, 4, 6 and 8 results. Speak the four-letter command.", "2, 4, 6 ve 8. görev sonuçlarının İLK harfini alın. Dört harfli komutu söyleyin."], "result": ["OPEN", "OPEN"], "hint": ["M2 begins O, M4 begins P, M6 begins E, M8 begins N.", "G2 O, G4 P, G6 E, G8 N harfiyle başlar."], "answers": [["OPEN", "PAGE", "NIGHT", "MEND"], ["OPEN", "PAGE", "NIGHT", "MEND"]]}];const COPY={en:{saved:'Saved locally',start:'Start',pause:'Pause',reset:'Reset',eye:'INTERACTIVE MAGIC SCHOOL ESCAPE',title:'The Forbidden Magic School',lead:'The academy’s oldest spellbook has vanished. Complete ten enchanted missions before its magic disappears at dawn.',begin:'Enter Moonveil Academy',brief:'Apprentice Briefing',briefBody:'Ages 7-12 · 1-6 players · 45-75 minutes. Solve missions in order, record every result and use one gentle hint only when needed.',go:'Begin Mission 1',back:'Back',next:'Next Mission',hint:'Open gentle hint',wrong:'The spell fizzled. Check the evidence and try again.',correct:'Mission complete. Evidence recorded.',result:'Recorded result',final:'The Final Seal',finalBody:'Take the FIRST letter of results from Missions 2, 4, 6 and 8.',unseal:'Speak the Command',success:'THE SEAL IS OPEN! The spellbook has been recovered.',fail:'The runes remain locked. Check the four selected results.',cert:'Certified Spellkeeper',name:'Type apprentice or team name',again:'Begin a New Term'},tr:{saved:'Yerel olarak kaydedildi',start:'Başlat',pause:'Duraklat',reset:'Sıfırla',eye:'İNTERAKTİF BÜYÜ OKULU KAÇIŞI',title:'Yasak Büyü Okulu',lead:'Akademinin en eski büyü kitabı kayboldu. Şafakta büyüsü yok olmadan on büyülü görevi tamamlayın.',begin:'Ayperdesi Akademisine Gir',brief:'Çırak Brifingi',briefBody:'7-12 yaş · 1-6 oyuncu · 45-75 dakika. Görevleri sırayla çözün, her sonucu yazın ve yalnızca gerektiğinde küçük ipucu kullanın.',go:'1. Göreve Başla',back:'Geri',next:'Sonraki Görev',hint:'Küçük ipucunu aç',wrong:'Büyü söndü. Kanıtı kontrol edip tekrar deneyin.',correct:'Görev tamamlandı. Kanıt kaydedildi.',result:'Kaydedilen sonuç',final:'Final Mührü',finalBody:'2, 4, 6 ve 8. görev sonuçlarının İLK harfini alın.',unseal:'Komutu Söyle',success:'MÜHÜR AÇILDI! Büyü kitabı kurtarıldı.',fail:'Rünler kilitli kaldı. Seçilen dört sonucu kontrol edin.',cert:'Onaylı Büyü Koruyucusu',name:'Çırak veya ekip adını yaz',again:'Yeni Dönem Başlat'}};const KEY='forbidden-magic-school-v4';let S={lang:'en',screen:'cover',mission:0,solved:Array(10).fill(false),results:Array(10).fill(''),seconds:3600,running:false,stable:false,name:''};try{const q=JSON.parse(localStorage.getItem(KEY)||'{}');S={...S,...q,running:false};if(!Array.isArray(S.solved)||S.solved.length!==10)S.solved=Array(10).fill(false);if(!Array.isArray(S.results)||S.results.length!==10)S.results=Array(10).fill('')}catch(e){}let tick=null;const C=()=>COPY[S.lang],L=a=>a[S.lang==='en'?0:1],esc=v=>String(v??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));function save(){localStorage.setItem(KEY,JSON.stringify(S));document.getElementById('saved').textContent=C().saved}function setLang(l){S.lang=l;save();render()}function go(screen){S.screen=screen;save();scrollTo({top:0,behavior:'smooth'});render()}function clock(){let m=Math.floor(S.seconds/60),s=S.seconds%60;document.getElementById('timer').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}function timerStart(){if(tick)return;S.running=true;tick=setInterval(()=>{if(S.seconds>0){S.seconds--;clock();if(S.seconds%5===0)save()}else timerPause()},1000)}function timerPause(){clearInterval(tick);tick=null;S.running=false;save()}function shell(eye,title,body,nav=''){return `<div class="content"><div class="eyebrow">${eye}</div><h2>${title}</h2>${body}<div class="nav">${nav}</div></div>`}function cover(){return `<div class="content"><div class="eyebrow">${C().eye}</div><h1>${C().title}</h1><p class="lead">${C().lead}</p><div class="book"></div><div class="meta"><span>AGES 7-12</span><span>1-6 PLAYERS</span><span>45-75 MIN</span><span>OFFLINE</span><span>NO CUTTING</span></div><div class="nav"><button class="primary" onclick="go('brief')">${C().begin}</button></div></div>`}function brief(){return shell(C().brief,C().brief,`<p class="lead">${C().briefBody}</p><div class="mission"><b>PDF + HTML</b><p>${S.lang==='en'?'Printer and pencils. No cutting, envelopes, app, account, QR code or internet required.':'Yazıcı ve kalemler. Kesme, zarf, uygulama, hesap, QR kod veya internet gerekmez.'}</p></div>`,`<button onclick="go('cover')">${C().back}</button><button class="primary" onclick="S.mission=0;go('mission')">${C().go}</button>`)}function visual(n){let en=S.lang==='en';return ['','2 · 7 · 4 · 9 · 6<br>EVEN / ÇİFT → FIRST LETTERS','15 · 16 · 5 · 14<br>A=1 ... Z=26',(en?'🦉 SMALL · 🦉 MEDIUM · 🦉 LARGE<br>GREENHOUSE · TOWER · LIBRARY':'🦉 KÜÇÜK · 🦉 ORTA · 🦉 BÜYÜK<br>SERA · KULE · KÜTÜPHANE'),'1 PHOENIX · 2 SPELL · 3 ANCIENT · 4 DRAGON<br>5 GHOST · 6 POTION · 7 ENCHANTED','● · ◐ · ★ · ● · ◐ · ?','3 TOES · 3 TOES · 4 TOES · 3 TOES','🔮 3 · 6 · 9 · 12 · ?','H=4 · N=1 · T=5 · I=2 · G=3',(en?'THE · SPELLBOOK · IS · HIDDEN BELOW · SINGS · PURPLE':'BÜYÜ · KİTABI · AŞAĞIDA GİZLİ · ŞARKI · MOR · UYUR'),'M2 OPEN · M4 PAGE · M6 EMBER GRIFFIN · M8 NIGHT<br>FIRST LETTERS → ?'][n]}function mission(){let d=DATA[S.mission],i=S.mission,done=S.solved[i];let buttons=L(d.answers).map(a=>`<button data-answer="${esc(a)}" ${done?'disabled':''} class="${done&&a===L(d.result)?'correct':''}">${esc(a)}</button>`).join('');let map=DATA.map((x,k)=>`<span class="step ${k===i?'now':S.solved[k]?'done':''}">${k+1}</span>`).join('');return shell(`${S.lang==='en'?'MISSION':'GÖREV'} ${d.n} / 10`,L(d.title),`<div class="map">${map}</div><p><b>${L(d.skill)}</b></p><p>${L(d.story)}</p><p class="lead">${L(d.task)}</p><div class="visual">${visual(d.n)}</div><div class="answers">${buttons}</div><button onclick="toggleHint()">${C().hint}</button><div id="hint" class="hint" hidden>${L(d.hint)}</div><div class="feedback ${done?'ok':''}">${done?C().correct:''}</div>${done?`<div class="hint"><b>${C().result}:</b> ${esc(S.results[i])}</div>`:''}`,`<button onclick="prev()">${C().back}</button>${done?`<button class="primary" onclick="next()">${d.n===10?C().final:C().next}</button>`:''}`)}function answer(a){let d=DATA[S.mission];if(a===L(d.result)){S.solved[S.mission]=true;S.results[S.mission]=a;save();render()}else{let f=document.querySelector('.feedback');f.className='feedback bad';f.textContent=C().wrong}}function toggleHint(){let h=document.getElementById('hint');h.hidden=!h.hidden}function prev(){S.mission>0?(S.mission--,save(),render()):go('brief')}function next(){if(!S.solved[S.mission])return;if(S.mission<9){S.mission++;save();render()}else go('seal')}function seal(){return shell(C().final,C().final,`<div class="seal"><div class="book"></div><p>${C().finalBody}</p><div class="answers">${['OPEN','PAGE','NIGHT','MEND'].map(x=>`<button data-command="${x}">${x}</button>`).join('')}</div><div id="sf" class="feedback"></div></div>`,`<button onclick="S.mission=9;go('mission')">${C().back}</button>`)}function command(x){let f=document.getElementById('sf');let ok=x==='OPEN';f.className='feedback '+(ok?'ok':'bad');f.textContent=ok?C().success:C().fail;if(ok){S.stable=true;timerPause();save();setTimeout(()=>go('cert'),650)}}function cert(){return shell('MOONVEIL ACADEMY',C().cert,`<div class="cert"><div class="book"></div><h2>${C().cert}</h2><input id="name" value="${esc(S.name)}" placeholder="${C().name}"><p>${S.lang==='en'?'for recovering the stolen spellbook and restoring the academy’s magic.':'çalınan büyü kitabını kurtardığı ve akademinin büyüsünü yenilediği için.'}</p></div>`,`<button onclick="go('seal')">${C().back}</button><button class="primary" onclick="resetAll()">${C().again}</button>`)}function resetAll(){if(confirm(S.lang==='en'?'Erase saved progress and begin a new term?':'Kayıtlı ilerleme silinsin ve yeni dönem başlatılsın mı?')){timerPause();let lang=S.lang;S={lang,screen:'cover',mission:0,solved:Array(10).fill(false),results:Array(10).fill(''),seconds:3600,running:false,stable:false,name:''};save();render()}}function bind(){document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answer(b.dataset.answer));document.querySelectorAll('[data-command]').forEach(b=>b.onclick=()=>command(b.dataset.command));let n=document.getElementById('name');if(n)n.oninput=()=>{S.name=n.value;save()}}function render(){document.documentElement.lang=S.lang;document.getElementById('enBtn').classList.toggle('active',S.lang==='en');document.getElementById('trBtn').classList.toggle('active',S.lang==='tr');document.getElementById('saved').textContent=C().saved;document.getElementById('startBtn').textContent=C().start;document.getElementById('pauseBtn').textContent=C().pause;document.getElementById('resetBtn').textContent=C().reset;document.getElementById('bar').style.width=((S.solved.filter(Boolean).length+(S.stable?1:0))/11*100)+'%';let f={cover,brief,mission,seal,cert}[S.screen]||cover;document.getElementById('app').innerHTML=f();bind();clock()}render();</script></body></html>
