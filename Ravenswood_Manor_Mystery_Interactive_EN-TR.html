const CLUES={en:[['THE SIGNATURE','“V.B.” identifies more than one family member in old records. Which living suspect had access and specialist knowledge?'],['THE FALSE ALIBI','Rain began before 9:00 PM. Anyone reaching the gazebo afterward would leave prints. Thomas found none.'],['THE DELAY','The victim was alive at 10:20 PM. A toxin added much earlier must allow delayed neurological symptoms.'],['THE STOPPER','Residue sits under the stopper collar, not in the glass. The decanter was deliberately opened and resealed.'],['THE RED HERRING','Charles lied about leaving the billiard room, but his departure is later than the likely poisoning window.'],['THE UNSIGNED WILL','The draft creates motives for Margaret and Eleanor, but neither benefits until Edmund signs it.'],['THE LOST NAME','The caller said “what you took from us.” The Fairview clipping reveals whose family was taken apart.'],['THE ARTIST’S TRACE','Aconite flowers and some hand-ground pigments leave similar blue-violet particulate on fabric.']],tr:[['İMZA','Eski kayıtlarda “V.B.” birden fazla aile üyesini gösterebilir. Hem erişimi hem uzmanlığı olan yaşayan şüpheli kim?'],['SAHTE ALİBİ','Yağmur 21:00’den önce başladı. Sonrasında köşke giden iz bırakırdı. Thomas hiç iz bulmadı.'],['GECİKME','Kurban 22:20’de hayattaydı. Çok önce eklenen zehir gecikmeli nörolojik belirti oluşturabilmeli.'],['TIPA','Tortu bardağın içinde değil, tıpa halkasının altında. Sürahi açılıp yeniden kapatılmış.'],['YANILTICI İZ','Charles çıkışı konusunda yalan söyledi; fakat çıkış saati olası zehirleme aralığından sonra.'],['İMZASIZ VASİYET','Taslak Margaret ve Eleanor’a saik veriyor; Edmund imzalamadan ikisi de yararlanamaz.'],['KAYIP İSİM','Arayan “bizden aldığın şey” dedi. Fairview kupürü kimin ailesinin parçalandığını açıklıyor.'],['RESSAMIN İZİ','Kurtboğan çiçekleri ile bazı elde öğütülmüş pigmentler kumaşta benzer mavi-mor parçacık bırakır.']]};
const SOL={en:['Victoria opened the brandy decanter at 9:15 PM and added aconitine prepared from monkshood. Its delayed neurological effects explain why Edmund was still alive — but trembling — at 10:20 PM.','Agnes placed her at the drinks cabinet. Residue beneath the stopper proves the decanter was opened, while matching particulate on her cuff connects her to the preparation.','Her gazebo alibi fails: the lamp was dark and the rain-softened path held no footprints. Edmund had confined Victoria’s mother Lydia to Fairview and destroyed their family. The library slip, burned extraction pages and clipping complete method, access, deception and motive.'],tr:['Victoria 21:15’te konyak sürahisini açtı ve kurtboğandan hazırladığı akonitini ekledi. Gecikmeli nörolojik etki, Edmund’ın 22:20’de hâlâ hayatta fakat titriyor olmasını açıklar.','Agnes onu içki dolabında gördü. Tıpanın altındaki tortu sürahinin açıldığını; manşetindeki eşleşen parçacık ise hazırlıkla bağlantısını kanıtlar.','Köşk alibisi çöker: lamba karanlıktı, yağmurla yumuşayan yolda ayak izi yoktu. Edmund, Victoria’nın annesi Lydia’yı Fairview’e kapattırmış ve ailelerini parçalamıştı. Fiş, yanmış sayfalar ve kupür; yöntem, erişim, aldatma ve saiki tamamlar.']};
const sections=['suspects','witnesses','evidence','timeline','map','clues'];
const defaults=()=>({lang:'en',screen:'cover',visited:[],clueOrder:[0,1,2,3,4,5,6,7],revealed:0,sealed:false,acc:{name:'',who:'',method:'',motive:'',ev1:'',ev2:''}});
function load(){try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&['en','tr'].includes(v.lang)&&Array.isArray(v.visited)&&Array.isArray(v.clueOrder))return Object.assign(defaults(),v)}catch(e){}return defaults()}
let state=load();
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function t(){return DATA[state.lang]}
function setLang(lang){state.lang=lang;save();render()}
function visit(screen){if(sections.includes(screen)&&!state.visited.includes(screen))state.visited.push(screen);state.screen=screen;save();scrollTo({top:0,behavior:'smooth'});render()}
function ready(){return sections.every(x=>state.visited.includes(x))&&state.revealed===8}
function revealClue(){if(state.revealed<8){state.revealed++;save();render()}}
function resetAll(){if(confirm(t().resetAsk)){localStorage.removeItem(KEY);state=defaults();render()}}
function shell(eyebrow,title,body){return `<section class="file"><p class="eyebrow">${eyebrow}</p><h2>${title}</h2>${body}</section>`}
function back(){return `<div class="actions"><button class="btn secondary wide" onclick="visit('hub')">‹ ${t().back}</button></div>`}
function cover(){return `<section class="file"><p class="eyebrow">${t().case}</p><div class="cover-mark"></div><h1 style="text-align:center">${t().title}</h1><p class="lead" style="text-align:center">${t().tag}</p><div class="stats"><div class="stat"><b>4-6</b><span>${t().players}</span></div><div class="stat"><b>14+</b><span>${t().ages}</span></div><div class="stat"><b>45-75</b><span>${t().minutes}</span></div><div class="stat"><b>0</b><span>${t().cutting}</span></div></div><button class="btn wine wide" onclick="visit('how')">${t().open}</button></section>`}
function how(){return shell(state.lang==='en'?'BEFORE THE STORM':'FIRTINA ÖNCESİ',t().howTitle,`<p class="lead">${t().howText}</p><div class="record"><span class="tag">${state.lang==='en'?'NO CUTTING · NO APP · WORKS OFFLINE':'KESME YOK · UYGULAMA YOK · ÇEVRİMDIŞI'}</span><p>${state.lang==='en'?'Keep the final truth closed until every player has sealed a vote.':'Her oyuncu oyunu mühürleyene kadar gerçeği kapalı tutun.'}</p></div><div class="actions"><button class="btn wine wide" onclick="visit('summary')">${t().begin}</button></div>`)}
function summary(){const body=state.lang==='en'?`<p class="lead"><b>Victim:</b> Lord Edmund Blackwood, 67. Found dead inside his locked study at 11:20 PM during a storm. A half-finished brandy stood beside an unsigned will.</p><div class="record"><span class="tag">ANSWERING MACHINE · 8:45 PM</span><p class="quote">“...you have no idea what you took from us. Tonight, everyone will finally know the truth.”</p></div><p class="lead">The coroner places death between 10:30 and 11:00 PM. A witness saw trembling hands at 10:20. The decanter — not the glass — was contaminated.</p>`:`<p class="lead"><b>Kurban:</b> Lord Edmund Blackwood, 67. Fırtına sırasında 23:20’de kilitli çalışma odasında ölü bulundu. İmzasız vasiyetin yanında yarım kalmış konyak vardı.</p><div class="record"><span class="tag">TELESEKRETER · 20:45</span><p class="quote">“...bizden ne aldığın hakkında hiçbir fikrin yok. Bu gece herkes gerçeği öğrenecek.”</p></div><p class="lead">Adli tabip ölüm saatini 22:30-23:00 arasına koyuyor. Bir tanık 22:20’de titreyen eller gördü. Zehir bardakta değil, sürahideydi.</p>`;return shell(state.lang==='en'?'CASE SUMMARY':'VAKA ÖZETİ',state.lang==='en'?'The Death of Lord Blackwood':'Lord Blackwood’un Ölümü',body+`<div class="actions"><button class="btn wine wide" onclick="visit('hub')">${t().begin}</button></div>`)}
function hub(){const labels={suspects:t().suspects,witnesses:t().witnesses,evidence:t().evidence,timeline:t().timeline,map:t().map,clues:t().clues};return shell(state.lang==='en'?'CASE BOARD':'DOSYA PANOSU',t().hub,`<p class="lead">${t().hubText}</p><div class="hub">${sections.map((s,i)=>`<button class="hub-card ${state.visited.includes(s)?'done':''}" onclick="visit('${s}')"><span>${String(i+1).padStart(2,'0')}</span><b>${labels[s]}</b><span>${s==='clues'?state.revealed+'/8':(state.visited.includes(s)?'✓':'—')}</span></button>`).join('')}</div><p class="small">${state.visited.length}/6 ${t().reviewed}</p><button class="btn wine wide" ${ready()?`onclick="visit('accuse')"`:'disabled style="opacity:.38;cursor:not-allowed"'}>${ready()?t().accuse:t().locked}</button>`)}
function suspects(){return shell(state.lang==='en'?'SIX PEOPLE · SIX STORIES':'ALTI KİŞİ · ALTI HİKÂYE',t().suspects,`<div class="list">${SUS[state.lang].map((s,i)=>`<article class="record"><span class="tag">SUSPECT ${String(i+1).padStart(2,'0')} · ${s[1]}</span><h3>${s[0]}</h3><p><strong>${t().motive}:</strong> ${s[2]}</p><p><strong>${t().alibi}:</strong> ${s[3]}</p></article>`).join('')}</div>${back()}`)}
function witnesses(){return shell(state.lang==='en'?'INTERVIEW TRANSCRIPTS':'İFADE TUTANAKLARI',t().witnesses,`<div class="list">${WIT[state.lang].map((w,i)=>`<article class="record"><span class="tag">${String(i+1).padStart(2,'0')} · ${w[0]}</span><p class="quote">${w[1]}</p></article>`).join('')}</div>${back()}`)}
function evidence(){return shell(state.lang==='en'?'PHYSICAL EVIDENCE':'FİZİKSEL KANIT',t().evidence,`<div class="evidence">${EVI[state.lang].map(e=>`<article class="exhibit"><small>${e[0]}</small><h3>${e[1]}</h3><p>${e[2]}</p></article>`).join('')}</div>${back()}`)}
function timeline(){return shell(state.lang==='en'?'CHRONOLOGY':'KRONOLOJİ',t().timeline,`<div class="timeline">${TIMES[state.lang].map(e=>`<div class="event"><time>${e[0]}</time><span>${e[1]}</span></div>`).join('')}</div>${back()}`)}
function map(){return shell(state.lang==='en'?'GROUND FLOOR':'ZEMİN KAT',t().map,`<div class="map">${ROOMS[state.lang].map(r=>`<div class="room ${r[2]}"><b>${r[0]}</b><span>${r[1]}</span></div>`).join('')}</div><div class="rule"></div><p class="lead">${state.lang==='en'?'Use movement, weather and sight lines to test each alibi.':'Her alibiyi test etmek için hareketi, havayı ve görüş hatlarını kullanın.'}</p>${back()}`)}
function clues(){const list=state.clueOrder.slice(0,state.revealed).map((idx,i)=>`<div class="clue"><b>${t().clue} ${i+1} · ${CLUES[state.lang][idx][0]}</b>${CLUES[state.lang][idx][1]}</div>`).join('');return shell(state.lang==='en'?'NO CUTTING · FULL-PAGE CLUES':'KESME YOK · TAM SAYFA İPUÇLARI',t().clues,`<div class="clue-stage"><div class="dossier">${state.revealed<8?'?':'✓'}</div><b>${state.revealed}/8</b><div class="meter"><i style="width:${state.revealed*12.5}%"></i></div><button class="btn" onclick="revealClue()" ${state.revealed===8?'disabled style="opacity:.45"':''}>${state.revealed===8?t().all:t().reveal}</button><div class="clue-list">${list}</div></div>${back()}`)}
function saveAcc(){for(const k of Object.keys(state.acc)){const el=document.getElementById(k);if(el)state.acc[k]=el.value.trim()}state.sealed=true;save();render()}
function accuse(){if(state.sealed)return shell(state.lang==='en'?'VERDICT SEALED':'KARAR MÜHÜRLENDİ',t().sealed,`<div class="seal">${t().sealed}</div><p class="lead">${t().sealedText}</p><div class="record"><p><b>${t().who}:</b> ${state.acc.who||'—'}</p><p><b>${t().ev1}:</b> ${state.acc.ev1||'—'}</p><p><b>${t().ev2}:</b> ${state.acc.ev2||'—'}</p></div><div class="actions"><button class="btn wine wide" onclick="visit('solution')">${t().truth}</button></div>`);const a=state.acc,opts=SUS[state.lang].map(s=>`<option ${a.who===s[0]?'selected':''}>${s[0]}</option>`).join('');return shell(state.lang==='en'?'FINAL VERDICT':'SON KARAR',t().form,`<p class="lead">${t().formText}</p><div class="form"><label>${t().name}<input id="name" value="${esc(a.name)}"></label><label>${t().who}<select id="who"><option value=""></option>${opts}</select></label><label>${t().method}<textarea id="method" rows="2">${esc(a.method)}</textarea></label><label>${t().motiveField}<textarea id="motive" rows="2">${esc(a.motive)}</textarea></label><label>${t().ev1}<input id="ev1" value="${esc(a.ev1)}"></label><label>${t().ev2}<input id="ev2" value="${esc(a.ev2)}"></label></div><div class="actions"><button class="btn wine wide" onclick="saveAcc()">${t().seal}</button></div>`)}
function solution(){const correct=state.acc.who.toLowerCase()==='victoria blackwood';return shell(state.lang==='en'?'CASE CLOSED':'DOSYA KAPANDI',t().solutionTitle,`<div class="seal">${correct?t().correct:t().wrong}</div><div class="answer">${SOL[state.lang].map((x,i)=>`<h3>${state.lang==='en'?['METHOD + TIMING','ACCESS + TRACE','FALSE ALIBI + MOTIVE'][i]:['YÖNTEM + ZAMAN','ERİŞİM + İZ','SAHTE ALİBİ + SAİK'][i]}</h3><p>${x}</p>`).join('')}</div><div class="certificate"><p class="eyebrow">${t().certificate}</p><h3>${state.acc.name||'________________________'}</h3><p>${t().certText}</p></div><div class="actions"><button class="btn wide" onclick="resetAll()">↺ ${t().playAgain}</button></div>`)}
function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){document.documentElement.lang=state.lang;document.getElementById('brand').textContent=t().brand;document.getElementById('progress').textContent=state.visited.length+'/6';document.getElementById('enBtn').classList.toggle('active',state.lang==='en');document.getElementById('trBtn').classList.toggle('active',state.lang==='tr');const views={cover,how,summary,hub,suspects,witnesses,evidence,timeline,map,clues,accuse,solution};document.getElementById('app').innerHTML=(views[state.screen]||cover)()}
document.getElementById('enBtn').onclick=()=>setLang('en');document.getElementById('trBtn').onclick=()=>setLang('tr');document.getElementById('resetBtn').onclick=resetAll;
const storm=document.getElementById('storm');for(let i=0;i<42;i++){const d=document.createElement('i');d.className='drop';d.style.left=(i*37%105)+'%';d.style.animationDuration=(.8+(i%7)*.12)+'s';d.style.animationDelay=(-i*.11)+'s';storm.appendChild(d)}
render();
</script>
</body>
</html>
