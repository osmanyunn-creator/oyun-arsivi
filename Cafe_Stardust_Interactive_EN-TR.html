<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111327"><title>Café Stardust — Date Night EN + TR</title>
<style>
:root{--night:#111327;--night2:#1d2038;--wine:#6d2338;--rose:#b85b70;--gold:#cdae65;--pale:#eee0ad;--cream:#fbf5ea;--paper:#f4e9d8;--ink:#272132;--muted:#756978;}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#2a2e50 0,#111327 42%,#090a18 100%);color:var(--cream);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.32;background-image:radial-gradient(#eee0ad 1px,transparent 1px),radial-gradient(#cdae65 1px,transparent 1px);background-size:47px 47px,83px 83px;background-position:11px 9px,31px 27px}
.top{position:sticky;top:0;z-index:5;background:rgba(17,19,39,.94);backdrop-filter:blur(12px);border-bottom:1px solid rgba(205,174,101,.45)}.topin{max-width:930px;margin:auto;padding:13px 18px;display:flex;gap:12px;align-items:center;justify-content:space-between}.brand{font-family:Georgia,serif;font-size:22px;color:var(--pale)}.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}button{font:700 12px system-ui;border:1px solid var(--gold);border-radius:999px;padding:8px 13px;cursor:pointer;background:transparent;color:var(--pale)}button.primary{background:var(--wine);color:white;border-color:var(--rose)}button.active{background:var(--gold);color:var(--night)}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
.wrap{max-width:930px;margin:auto;padding:28px 16px 70px}.progress{height:4px;background:rgba(255,255,255,.12);border-radius:9px;margin:0 0 20px;overflow:hidden}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--wine),var(--gold));transition:width .3s}
.card{position:relative;overflow:hidden;background:var(--cream);color:var(--ink);border:1px solid var(--gold);border-radius:18px;padding:clamp(24px,5vw,54px);box-shadow:0 28px 70px rgba(0,0,0,.4)}.card:before,.card:after{content:"";position:absolute;border:1px solid rgba(109,35,56,.16);transform:rotate(45deg)}.card:before{width:170px;height:170px;right:-105px;top:-105px}.card:after{width:90px;height:90px;left:-60px;bottom:-60px}.content{position:relative;z-index:1}.eyebrow{color:var(--wine);font-weight:800;letter-spacing:.16em;text-transform:uppercase;font-size:11px}h1,h2{font-family:Georgia,serif;color:var(--night);margin:.2em 0}h1{font-size:clamp(38px,8vw,68px)}h2{font-size:clamp(30px,6vw,46px)}.lead{font-family:Georgia,serif;font-size:clamp(18px,3vw,23px);line-height:1.65;color:#413646}.stars{color:var(--gold);letter-spacing:.7em;margin:20px 0}.nav{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}.nav button{border-radius:10px;padding:12px 18px}.nav .primary{flex:1;min-width:180px}.courses{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:22px}.pill{font-size:10px;font-weight:800;border:1px solid var(--gold);padding:6px 10px;border-radius:99px;color:var(--muted)}.pill.now{background:var(--wine);color:#fff;border-color:var(--wine)}.pill.done{background:var(--gold);color:var(--night)}ul.qs{padding:0;list-style:none}.qs li{font-family:Georgia,serif;font-size:19px;line-height:1.55;padding:13px 0 13px 38px;border-bottom:1px solid rgba(117,105,120,.23);position:relative}.qs li:before{content:"✦";position:absolute;left:8px;color:var(--gold)}.challenge{background:var(--night);color:var(--cream);border:1px solid var(--gold);border-radius:14px;padding:22px;margin-top:25px}.challenge b{display:block;color:var(--pale);font-size:10px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px}label{display:block;font-size:11px;font-weight:800;color:var(--wine);letter-spacing:.08em;text-transform:uppercase;margin:16px 0 7px}input,textarea{width:100%;border:1px solid #b9a98c;background:#fffdf8;color:var(--ink);border-radius:9px;padding:12px 14px;font:18px Georgia,serif}textarea{min-height:120px;resize:vertical}.save{font-size:11px;color:var(--muted);margin-top:12px}.toast{padding:18px 0;border-bottom:1px solid rgba(117,105,120,.25)}.certificate{text-align:center;background:var(--night);border:1px solid var(--gold);border-radius:15px;padding:30px;color:var(--cream)}.certificate h2{color:white}.certificate .names{font:700 26px Georgia,serif;color:var(--pale)}.notice{background:var(--paper);border-left:4px solid var(--wine);padding:14px 16px;margin:16px 0}@media(max-width:560px){.brand{font-size:17px}.topin{align-items:flex-start}.card{border-radius:12px}}
@media print{.top,.nav,.progress{display:none!important}body{background:white}body:before{display:none}.wrap{padding:0}.card{box-shadow:none;border:0}}
</style></head><body>
<header class="top"><div class="topin"><div class="brand">Café Stardust</div><div class="actions"><span id="saved" class="save">Saved locally</span><button id="enBtn" onclick="setLang('en')">EN</button><button id="trBtn" onclick="setLang('tr')">TR</button><button onclick="resetAll()" data-i18n="reset">Reset</button></div></div></header>
<main class="wrap"><div class="progress"><span id="bar"></span></div><section id="app" class="card"></section></main>
<script>
const COURSES={"en": [{"tag": "COURSE 1 OF 4", "course": "Aperitif", "title": "Warming Up", "qs": ["What is a small thing that made you smile this week?", "If our evening were a cocktail, what would it be called — and what is in it?", "What song instantly puts you in a good mood?", "What is one thing you are secretly proud of this month?", "If we could teleport for dessert anywhere right now, where would we go?"], "challenge": "Without speaking, act out how you felt the very first time you saw your partner. They have to guess what you are portraying. Then switch."}, {"tag": "COURSE 2 OF 4", "course": "First Course", "title": "Getting Reacquainted", "qs": ["What is a memory of us you find yourself replaying?", "What is something about you that has changed in the last year?", "What do you think I am better at than I give myself credit for?", "What is a small habit of mine you secretly love?", "What is something you want more of in your life right now?"], "challenge": "Slow dance for one full song — even in the kitchen, even with no music but the one in your head."}, {"tag": "COURSE 3 OF 4", "course": "Main Course", "title": "How Well Do You Know Me?", "qs": ["My go-to order at a coffee shop is...", "If I had a warning label, it would say...", "The last thing that made me laugh really hard was...", "My love language is...", "My most-used emoji is...", "My comfort food is..."], "challenge": "Give your partner a two-minute uninterrupted compliment. No jokes allowed. (Well — one joke allowed.)"}, {"tag": "COURSE 4 OF 4", "course": "Dessert", "title": "Sweet & Vulnerable", "qs": ["What does feeling loved look like to you, specifically?", "What is a dream you have not said out loud in a while?", "Where do you hope we are, the two of us, in five years?", "What is something I do that makes you feel safe?", "What is one thing you never want us to stop doing?"], "challenge": "Write the first line of a love letter to each other, right now. Read them aloud."}], "tr": [{"tag": "MENÜ 1 / 4", "course": "Aperatif", "title": "Isınma", "qs": ["Bu hafta seni gülümseten küçük bir şey neydi?", "Bu akşamımız bir kokteyl olsaydı adı ne olurdu — içinde ne olurdu?", "Hangi şarkı seni anında iyi hissettirir?", "Bu ay gizlice gurur duyduğun bir şey nedir?", "Şu an tatlı için istediğimiz her yere ışınlanabilseydik nereye giderdik?"], "challenge": "Hiç konuşmadan, partnerini ilk gördüğünde ne hissettiğini canlandır. O da ne anlattığını tahmin etsin. Sonra sıra değişsin."}, {"tag": "MENÜ 2 / 4", "course": "İlk Tabak", "title": "Yeniden Tanışma", "qs": ["İkimize dair, kendini tekrar tekrar hatırlarken bulduğun bir anı nedir?", "Son bir yılda kendinde değişen bir şey nedir?", "Benim, kendime verdiğimden daha fazla değer vermem gereken hangi konuda iyi olduğumu düşünüyorsun?", "Gizlice sevdiğin küçük bir alışkanlığım nedir?", "Şu an hayatında daha fazlasını istediğin bir şey nedir?"], "challenge": "Bir şarkı boyunca yavaş dans edin — mutfakta bile olsa, kafanızdaki müzikten başka müzik olmasa bile."}, {"tag": "MENÜ 3 / 4", "course": "Ana Yemek", "title": "Beni Ne Kadar İyi Tanıyorsun?", "qs": ["Kafede her zaman sipariş ettiğim şey...", "Bir uyarı etiketim olsaydı üzerinde şu yazardı...", "Beni son gerçekten güldüren şey...", "Aşk dilim...", "En çok kullandığım emoji...", "Beni rahatlatan yemek..."], "challenge": "Partnerine iki dakika boyunca kesintisiz iltifat et. Şaka yok. (Peki, bir şakaya izin var.)"}, {"tag": "MENÜ 4 / 4", "course": "Tatlı", "title": "Tatlı ve Kırılgan", "qs": ["Sevilmek, senin için tam olarak neye benziyor?", "Uzun zamandır sesli söylemediğin bir hayalin nedir?", "Beş yıl sonra ikimizin nerede olmasını umuyorsun?", "Yaptığım, seni güvende hissettiren bir şey nedir?", "Asla bırakmamızı istemediğin bir şey nedir?"], "challenge": "Şimdi, birbirinize bir aşk mektubunun ilk cümlesini yazın. Sesli okuyun."}]};
const COPY={en:{saved:'Saved locally',reset:'Reset',back:'Back',next:'Continue',begin:'Set the Table',coverEye:'A DATE NIGHT EXPERIENCE',coverLead:'A menu for two. Four courses, four challenges, one toast — whenever the two of you are ready.',howTitle:'Setting the Table',howEye:'BEFORE YOU BEGIN',howBody:'This is not a game to win. Light something, pour something, and put the other phones away. Move course by course, take turns reading aloud, and answer before you overthink it.',reserve:'Reservation Card',names:'Your names',first:'First name',second:'Second name',date:'Tonight’s date',hope:'Tonight, we are hoping for...',start:'Begin the First Course',chef:'CHEF’S CHALLENGE — DO THIS BEFORE CONTINUING',nightcap:'Write Your Toast',nightEye:'NIGHTCAP',toast1:'Here’s to...',toast2:'Here’s to the way you...',toast3:'Here’s to us, and to...',sealed:'Open in One Year',sealedBody:'Write one wish, one prediction, or one thing you never want to forget about tonight.',seal:'Seal the Note',cert:'Your Café Stardust Certificate',again:'Reserve Another Night',finish:'See Certificate',sealedMsg:'Sealed on this device. No peeking for one year.',certBody:'shared an evening at Café Stardust — four courses, four challenges, and one toast.',local:'Your entries stay in this browser on this device.'},tr:{saved:'Yerel olarak kaydedildi',reset:'Sıfırla',back:'Geri',next:'Devam Et',begin:'Masayı Kur',coverEye:'BİR BULUŞMA GECESİ DENEYİMİ',coverLead:'İki kişilik bir menü. Dört menü, dört meydan okuma ve bir kadeh — ikiniz hazır olduğunda.',howTitle:'Masayı Kurmak',howEye:'BAŞLAMADAN ÖNCE',howBody:'Bu kazanılacak bir oyun değil. Bir şey yakın, bir şey doldurun ve diğer telefonları kaldırın. Menü menü ilerleyin, sırayla sesli okuyun ve çok düşünmeden cevaplayın.',reserve:'Rezervasyon Kartı',names:'İsimleriniz',first:'İlk isim',second:'İkinci isim',date:'Bu akşamın tarihi',hope:'Bu gece umduğumuz şey...',start:'İlk Menüye Başla',chef:'ŞEFİN MEYDAN OKUMASI — DEVAM ETMEDEN ÖNCE YAPIN',nightcap:'Kadeh Sözünü Yaz',nightEye:'GECE KADEHİ',toast1:'İşte...',toast2:'İşte senin şu haline...',toast3:'İşte bize, ve...',sealed:'Bir Yıl Sonra Açın',sealedBody:'Bir dilek, bir tahmin ya da bu gece hakkında asla unutmak istemediğiniz bir şey yazın.',seal:'Notu Mühürle',cert:'Café Stardust Sertifikanız',again:'Başka Bir Gece Ayırt',finish:'Sertifikayı Gör',sealedMsg:'Bu cihazda mühürlendi. Bir yıl boyunca bakmak yok.',certBody:'Café Stardust’ta bir akşam paylaştı — dört menü, dört meydan okuma ve bir kadeh.',local:'Girdileriniz yalnızca bu cihazdaki tarayıcıda saklanır.'}};
const KEY='cafe-stardust-v2';let S={lang:'en',screen:'cover',course:0,names:{a:'',b:'',date:'',hope:''},toast:['','',''],note:'',sealed:false};
try{S={...S,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){};
const C=()=>COPY[S.lang],esc=v=>String(v??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function save(){localStorage.setItem(KEY,JSON.stringify(S));document.getElementById('saved').textContent=C().saved}
function setLang(l){S.lang=l;save();render()}function go(x){S.screen=x;save();scrollTo({top:0,behavior:'smooth'});render()}function setCourse(i){S.course=i;go('course')}
function nextCourse(){S.course<3?(S.course++,go('course')):go('nightcap')}
function bind(){document.querySelectorAll('[data-bind]').forEach(el=>el.addEventListener('input',()=>{let [group,key]=el.dataset.bind.split('.');if(group==='names')S.names[key]=el.value;else if(group==='toast')S.toast[+key]=el.value;else S[group]=el.value;save()}))}
function shell(eye,title,body,nav=''){return `<div class="content"><div class="eyebrow">${eye}</div><h2>${title}</h2>${body}<div class="nav">${nav}</div></div>`}
function cover(){return shell(C().coverEye,'Café Stardust',`<p class="lead">${C().coverLead}</p><div class="stars">✦ ✧ ✦</div><p class="save">${C().local}</p>`,`<button class="primary" onclick="go('how')">${C().begin}</button>`)}
function how(){return shell(C().howEye,C().howTitle,`<p class="lead">${C().howBody}</p><div class="notice">PDF and HTML contain the same complete experience · PDF ve HTML aynı tam deneyimi içerir.</div>`,`<button onclick="go('cover')">${C().back}</button><button class="primary" onclick="go('reserve')">${C().next}</button>`)}
function reserve(){let n=S.names;return shell(C().reserve,S.lang==='en'?'Table for Two':'İki Kişilik Masa',`<label>${C().names}</label><input data-bind="names.a" placeholder="${C().first}" value="${esc(n.a)}"><input data-bind="names.b" placeholder="${C().second}" value="${esc(n.b)}"><label>${C().date}</label><input data-bind="names.date" value="${esc(n.date)}"><label>${C().hope}</label><textarea data-bind="names.hope">${esc(n.hope)}</textarea>`,`<button onclick="go('how')">${C().back}</button><button class="primary" onclick="setCourse(0)">${C().start}</button>`)}
function course(){let all=COURSES[S.lang],c=all[S.course];let pills=all.map((x,i)=>`<span class="pill ${i===S.course?'now':i<S.course?'done':''}">${x.course}</span>`).join('');return shell(c.tag,c.title,`<div class="courses">${pills}</div><ul class="qs">${c.qs.map(q=>`<li>${q}</li>`).join('')}</ul><div class="challenge"><b>${C().chef}</b>${c.challenge}</div>`,`<button onclick="${S.course?'setCourse('+(S.course-1)+')':"go('reserve')"}">${C().back}</button><button class="primary" onclick="nextCourse()">${C().next}</button>`)}
function nightcap(){return shell(C().nightEye,C().nightcap,[0,1,2].map(i=>`<div class="toast"><label>${[C().toast1,C().toast2,C().toast3][i]}</label><input data-bind="toast.${i}" value="${esc(S.toast[i])}"></div>`).join(''),`<button onclick="setCourse(3)">${C().back}</button><button class="primary" onclick="go('note')">${C().next}</button>`)}
function note(){return shell(S.lang==='en'?'SEALED FOR LATER':'SONRASI İÇİN MÜHÜRLÜ',C().sealed,`<p class="lead">${C().sealedBody}</p>${S.sealed?`<div class="challenge">${esc(S.note)||'✦'}</div><p class="save">${C().sealedMsg}</p>`:`<textarea data-bind="note">${esc(S.note)}</textarea>`}`,S.sealed?`<button class="primary" onclick="go('cert')">${C().finish}</button>`:`<button onclick="go('nightcap')">${C().back}</button><button class="primary" onclick="S.sealed=true;save();render()">${C().seal}</button>`)}
function cert(){let a=esc(S.names.a||(S.lang==='en'?'Name One':'İlk İsim')),b=esc(S.names.b||(S.lang==='en'?'Name Two':'İkinci İsim'));return shell('CAFÉ STARDUST',C().cert,`<div class="certificate"><div class="stars">✦ ✧ ✦</div><div class="names">${a} &amp; ${b}</div><p>${C().certBody}</p><p class="save">${esc(S.names.date)}</p></div>`,`<button onclick="go('note')">${C().back}</button><button class="primary" onclick="resetAll()">${C().again}</button>`)}
function resetAll(){if(confirm(S.lang==='en'?'Erase all saved entries and start again?':'Kaydedilen tüm girişler silinsin ve baştan başlansın mı?')){let lang=S.lang;S={lang,screen:'cover',course:0,names:{a:'',b:'',date:'',hope:''},toast:['','',''],note:'',sealed:false};save();render()}}
function render(){document.documentElement.lang=S.lang;document.getElementById('enBtn').classList.toggle('active',S.lang==='en');document.getElementById('trBtn').classList.toggle('active',S.lang==='tr');document.querySelector('[data-i18n=reset]').textContent=C().reset;document.getElementById('saved').textContent=C().saved;let screens=['cover','how','reserve','course','nightcap','note','cert'];document.getElementById('bar').style.width=((screens.indexOf(S.screen)+1)/screens.length*100)+'%';let f={cover,how,reserve,course,nightcap,note,cert}[S.screen]||cover;document.getElementById('app').innerHTML=f();bind()}render();
</script></body></html>
