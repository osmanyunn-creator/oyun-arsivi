<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a1a2e"><title>Moonlight Detective Agency - Interactive Game</title><style>:root{--night:#0a1a2e;--navy:#143650;--blue:#21658b;--cyan:#54c7cb;--violet:#7356a6;--gold:#f1b84b;--coral:#d85c68;--paper:#f7eacd;--ink:#182432}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -15%,#21658b 0,#143650 34%,#0a1a2e 78%);color:white;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.28;background-image:radial-gradient(circle,#f1b84b 0 1px,transparent 2px);background-size:47px 47px}.top{position:sticky;top:0;z-index:5;background:#0a1a2ef2;border-bottom:1px solid #f1b84b99;backdrop-filter:blur(12px)}.topin{max-width:1060px;margin:auto;padding:10px 15px;display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font:900 12px ui-monospace,monospace;letter-spacing:.12em;color:var(--gold)}.actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:flex-end}button{font:800 12px system-ui;border:1px solid var(--gold);border-radius:999px;background:transparent;color:white;padding:8px 12px;cursor:pointer}button.active{background:var(--gold);color:var(--night)}button.primary{border:0;border-radius:13px;padding:13px 18px;background:linear-gradient(90deg,var(--violet),var(--coral));font-size:15px}.timer{font:900 13px ui-monospace;color:var(--gold)}.saved{font-size:10px;color:#d9e3e8}.wrap{max-width:1060px;margin:auto;padding:24px 15px 70px}.progress{height:9px;background:#ffffff22;border-radius:99px;margin-bottom:18px;overflow:hidden}.progress span{height:100%;display:block;background:linear-gradient(90deg,var(--violet),var(--cyan),var(--gold),var(--coral));transition:width .3s}.card{position:relative;overflow:hidden;background:var(--paper);color:var(--ink);border:1px solid var(--gold);border-radius:22px;padding:clamp(22px,5vw,46px);box-shadow:0 28px 80px #0009}.card:after{content:"";position:absolute;width:190px;height:190px;right:-95px;bottom:-95px;border-radius:50%;border:22px double #21658b33}.content{position:relative;z-index:1}.eyebrow{font:900 11px ui-monospace;letter-spacing:.15em;color:var(--violet)}h1,h2{font-family:Georgia,serif;color:var(--night);margin:.25em 0}h1{font-size:clamp(38px,8vw,66px);line-height:.98}h2{font-size:clamp(28px,5vw,43px)}.lead{font-size:18px;line-height:1.6}.stone{width:160px;height:190px;margin:20px auto;clip-path:polygon(50% 0,92% 27%,78% 80%,50% 100%,22% 80%,8% 27%);background:linear-gradient(145deg,var(--cyan),#d8ffff 42%,var(--blue));border:8px solid var(--gold);filter:drop-shadow(0 0 24px #54c7cb)}.meta,.nav,.cluemap{display:flex;gap:9px;flex-wrap:wrap}.meta span,.step{background:#e1d3b1;padding:8px 11px;border-radius:999px;font:900 12px ui-monospace}.nav{margin-top:25px}.nav .primary{flex:1;min-width:180px}.step.now{background:var(--violet);color:white}.step.done{background:#24846f;color:white}.mission{background:white;border:1px solid #d8c89d;border-radius:17px;padding:18px;margin:16px 0}.visual{min-height:160px;display:grid;place-items:center;background:var(--navy);color:white;border:1px solid var(--gold);border-radius:16px;padding:18px;text-align:center;font:800 clamp(17px,5vw,31px) ui-monospace;line-height:1.6}.object{font-size:64px}.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:18px 0}.answers button{color:var(--ink);background:white;border:2px solid #d8c89d;border-radius:12px;padding:13px}.feedback{font-weight:900;min-height:24px}.ok{color:#24846f}.bad{color:var(--coral)}.hint{background:#fff0bd;border-left:5px solid var(--gold);padding:13px 15px;border-radius:9px;margin-top:12px}.setup{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.setup div{background:white;border-left:5px solid var(--cyan);border-radius:10px;padding:10px}.setup b{color:var(--violet)}input{width:100%;padding:13px;border:2px solid #d8c89d;border-radius:12px;font-size:16px}.fps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.fp{height:120px;display:grid;place-items:center;border:3px double var(--blue);border-radius:48% 48% 38% 38%;font:900 20px ui-monospace;color:var(--coral)}.fp.vA{background:repeating-radial-gradient(ellipse at 42% 73%,transparent 0 6px,#21658b 7px 9px,transparent 10px 15px)}.fp.vB{background:repeating-radial-gradient(ellipse at 58% 62%,transparent 0 8px,#21658b 9px 11px,transparent 12px 17px)}.fp.vC{background:repeating-radial-gradient(ellipse at 47% 54%,transparent 0 5px,#21658b 6px 8px,transparent 9px 14px)}.fp.vD{background:repeating-radial-gradient(ellipse at 62% 72%,transparent 0 7px,#21658b 8px 10px,transparent 11px 16px)}.fp.vE{background:repeating-radial-gradient(ellipse at 50% 70%,transparent 0 7px,#21658b 8px 10px,transparent 11px 15px)}.fp.vF{background:repeating-radial-gradient(ellipse at 35% 60%,transparent 0 9px,#21658b 10px 12px,transparent 13px 18px)}.maze{display:grid;grid-template-columns:repeat(6,42px);gap:4px;justify-content:center;margin:18px auto}.cell{height:42px;border-radius:6px;background:#e3d5b3;display:grid;place-items:center}.cell.block{background:var(--navy)}.cell.player{background:var(--coral);color:white}.cell.goal{background:var(--cyan);font-size:22px}.arrows{display:grid;grid-template-columns:repeat(3,56px);gap:7px;justify-content:center}.arrows button{color:var(--ink);background:white}.cert{text-align:center;background:var(--night);color:white;border:8px double var(--gold);border-radius:18px;padding:30px}.cert h2{color:white}.cert input{background:transparent;color:white;text-align:center;border:0;border-bottom:2px solid var(--cyan)}@media(max-width:700px){.answers,.setup{grid-template-columns:1fr}.fps{grid-template-columns:repeat(2,1fr)}.brand{font-size:10px}.timer{order:3;width:100%;text-align:right}}@media print{.top,.progress,.nav{display:none!important}body{background:white}.wrap{padding:0}.card{box-shadow:none;border:0}}</style></head><body><header class="top"><div class="topin"><div class="brand">AGENCY // CASE 016</div><div class="actions"><span id="saved" class="saved">Saved locally</span><span id="timer" class="timer">75:00</span><button id="startBtn" onclick="timerStart()">Start</button><button id="pauseBtn" onclick="timerPause()">Pause</button><button id="enBtn" onclick="setLang('en')">EN</button><button id="trBtn" onclick="setLang('tr')">TR</button><button id="resetBtn" onclick="resetAll()">Reset</button></div></div></header><main class="wrap"><div class="progress"><span id="bar"></span></div><section class="card" id="app"></section></main><script>const DATA=[{"n": 1, "en": "I keep food cold and fresh. Open my door and look nearby for your next clue.", "tr": "Yiyecekleri soğuk ve taze tutarım. Sıradaki ipucu için kapımın yakınını kontrol et.", "aen": "FRIDGE", "atr": "BUZDOLABI", "key": "cold"}, {"n": 2, "en": "I show your face every day but never speak. Find the next clue where your reflection appears.", "tr": "Her gün yüzünü gösteririm ama hiç konuşmam. Yansımanı gördüğün yerde sıradaki ipucunu bul.", "aen": "MIRROR", "atr": "AYNA", "key": "reflect"}, {"n": 3, "en": "I am where you sit and relax. Look around the cushions for something tucked away.", "tr": "Oturup dinlendiğin yerim. Minderlerin çevresinde saklanmış bir şey ara.", "aen": "SOFA", "atr": "KOLTUK", "key": "sit"}, {"n": 4, "en": "Stories and books live on my shelves. Search where your favorite tales stand in rows.", "tr": "Hikâyeler ve kitaplar raflarımda yaşar. En sevdiğin kitapların durduğu yerde ara.", "aen": "BOOKSHELF", "atr": "KİTAPLIK", "key": "books"}, {"n": 5, "en": "I bring stories and shows to life. Look around the screen for the next clue.", "tr": "Hikâyeleri ve programları ekrana getiririm. Sıradaki ipucu için televizyonun çevresine bak.", "aen": "TV", "atr": "TELEVİZYON", "key": "screen"}, {"n": 6, "en": "Soft and cozy is where you sleep. Look around your pillows for the next clue.", "tr": "Yumuşak ve rahatımdır; burada uyursun. Yastıklarının çevresinde sıradaki ipucunu ara.", "aen": "BED", "atr": "YATAK", "key": "sleep"}, {"n": 7, "en": "I open and close when people come and go. Search near the door, but stay indoors.", "tr": "İnsanlar gelip giderken açılıp kapanırım. Kapının yakınını ara ama evin içinde kal.", "aen": "FRONT DOOR", "atr": "DIŞ KAPI", "key": "door"}, {"n": 8, "en": "Toys and games rest inside me. Look in the toy box for the next piece of evidence.", "tr": "Oyuncaklar ve oyunlar içimde dinlenir. Sıradaki kanıt için oyuncak kutusuna bak.", "aen": "TOY BOX", "atr": "OYUNCAK KUTUSU", "key": "toys"}, {"n": 9, "en": "I am green and love the light. Look near a houseplant for the next clue.", "tr": "Yeşilim ve ışığı severim. Sıradaki ipucu için bir ev bitkisinin yakınına bak.", "aen": "HOUSEPLANT", "atr": "EV BİTKİSİ", "key": "plant"}, {"n": 10, "en": "You wash your hands and face here. Search around the bathroom sink.", "tr": "Ellerini ve yüzünü burada yıkarsın. Banyo lavabosunun çevresini kontrol et.", "aen": "BATHROOM SINK", "atr": "BANYO LAVABOSU", "key": "sink"}, {"n": 11, "en": "I hold clothes that are waiting to be washed. Look in or beside the laundry basket.", "tr": "Yıkanmayı bekleyen kıyafetleri tutarım. Çamaşır sepetinin içine veya yanına bak.", "aen": "LAUNDRY BASKET", "atr": "ÇAMAŞIR SEPETİ", "key": "laundry"}, {"n": 12, "en": "I help cook yummy food. Search near the oven, but only with a grown-up beside you.", "tr": "Lezzetli yemeklerin pişmesine yardım ederim. Yalnızca bir yetişkin yanındayken fırının yakınına bak.", "aen": "OVEN", "atr": "FIRIN", "key": "oven"}, {"n": 13, "en": "I tell the time day and night. Look near the wall clock for the next clue.", "tr": "Gece gündüz zamanı söylerim. Sıradaki ipucu için duvar saatinin yakınına bak.", "aen": "WALL CLOCK", "atr": "DUVAR SAATİ", "key": "clock"}, {"n": 14, "en": "Shoes wait together here. Search the shoe rack for the next piece of evidence.", "tr": "Ayakkabılar burada birlikte bekler. Sıradaki kanıt için ayakkabılığı kontrol et.", "aen": "SHOE RACK", "atr": "AYAKKABILIK", "key": "shoes"}, {"n": 15, "en": "I give you light when it is dark. Look near a lamp for the final clue.", "tr": "Karanlıkta ışık veririm. Son ipucu için bir lambanın yakınına bak.", "aen": "LAMP", "atr": "LAMBA", "key": "lamp"}, {"n": 16, "en": "CASE SOLVED! The Moonstone is safe. Your final treasure is waiting for you.", "tr": "VAKA ÇÖZÜLDÜ! Ay Taşı güvende. Final hazinen seni bekliyor.", "aen": "FINAL TREASURE", "atr": "FİNAL HAZİNESİ", "key": "chest"}];const COPY={en:{saved:'Saved locally',start:'Start',pause:'Pause',reset:'Reset',eye:'INTERACTIVE INDOOR TREASURE HUNT',title:'Moonlight Detective Agency',lead:'The Moonstone vanished. Follow sixteen hidden clues, complete three sealed puzzles and recover the final treasure.',begin:'Open Case File',brief:'Detective Briefing',briefBody:'Ages 6-10 · 1-6 players · 45-75 minutes. Choose the digital hunt or open the grown-up setup map.',hunt:'Start Digital Hunt',setup:'Grown-up Setup',back:'Back',next:'Next Clue',check:'Check Answer',hint:'Gentle Hint',wrong:'That lead went cold. Look at the describing words and try again.',correct:'Correct. Evidence secured.',bonus:'Open Bonus Puzzle',cert:'Master Detective',name:'Detective or team name',again:'Start a New Case'},tr:{saved:'Yerel olarak kaydedildi',start:'Başlat',pause:'Duraklat',reset:'Sıfırla',eye:'İNTERAKTİF EV İÇİ HAZİNE AVI',title:'Ay Işığı Dedektif Bürosu',lead:'Ay Taşı kayboldu. On altı gizli ipucunu takip et, üç mühürlü bulmacayı tamamla ve final hazinesini kurtar.',begin:'Vaka Dosyasını Aç',brief:'Dedektif Brifingi',briefBody:'6-10 yaş · 1-6 oyuncu · 45-75 dakika. Dijital avı seçin veya yetişkin kurulum haritasını açın.',hunt:'Dijital Avı Başlat',setup:'Ebeveyn Kurulumu',back:'Geri',next:'Sonraki İpucu',check:'Cevabı Kontrol Et',hint:'Küçük İpucu',wrong:'Bu iz soğudu. Tanımlayan kelimelere bakıp tekrar dene.',correct:'Doğru. Kanıt güvenceye alındı.',bonus:'Bonus Bulmacayı Aç',cert:'Usta Dedektif',name:'Dedektif veya ekip adı',again:'Yeni Vaka Başlat'}};const ICON={cold:'❄️',reflect:'◉',sit:'▰',books:'▥',screen:'▣',sleep:'☾',door:'▯',toys:'◇',plant:'♧',sink:'◡',laundry:'▦',oven:'▤',clock:'◷',shoes:'◒',lamp:'♢',chest:'◆'};const KEY='moonlight-detective-v6';const BLOCKS=[2,8,14,20,21,22,28,29,30];let S={lang:'en',screen:'cover',clue:0,solved:Array(16).fill(false),bonus:[false,false,false],seconds:4500,running:false,pos:0,name:''};try{let q=JSON.parse(localStorage.getItem(KEY)||'{}');S={...S,...q,running:false};if(!Array.isArray(S.solved)||S.solved.length!==16)S.solved=Array(16).fill(false);if(!Array.isArray(S.bonus)||S.bonus.length!==3)S.bonus=[false,false,false]}catch(e){}let tick=null;const C=()=>COPY[S.lang],tr=()=>S.lang==='tr',esc=v=>String(v??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));function save(){localStorage.setItem(KEY,JSON.stringify(S));saved.textContent=C().saved}function setLang(l){S.lang=l;save();render()}function go(x){S.screen=x;save();scrollTo({top:0,behavior:'smooth'});render()}function timerStart(){if(tick)return;S.running=true;tick=setInterval(()=>{if(S.seconds>0){S.seconds--;clock();if(S.seconds%5===0)save()}else timerPause()},1000)}function timerPause(){clearInterval(tick);tick=null;S.running=false;save()}function clock(){let m=Math.floor(S.seconds/60),s=S.seconds%60;timer.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}function shell(eye,title,body,nav=''){return `<div class="content"><div class="eyebrow">${eye}</div><h2>${title}</h2>${body}<div class="nav">${nav}</div></div>`}function cover(){return `<div class="content"><div class="eyebrow">${C().eye}</div><h1>${C().title}</h1><p class="lead">${C().lead}</p><div class="stone"></div><div class="meta"><span>AGES 6-10</span><span>1-6 PLAYERS</span><span>45-75 MIN</span><span>16 CLUES</span><span>OFFLINE</span></div><div class="nav"><button class="primary" onclick="go('brief')">${C().begin}</button></div></div>`}function brief(){return shell(C().brief,C().brief,`<p class="lead">${C().briefBody}</p><div class="mission"><b>${tr()?'İki tam oynama biçimi':'Two complete ways to play'}</b><p>${tr()?'PDF kartlarını yazdırıp evde saklayın veya ipuçlarını bu cihazda sırayla çözün. İnternet, uygulama veya hesap gerekmez.':'Print and hide the PDF cards around the home, or solve the clues in order on this device. No internet, app or account is required.'}</p></div>`,`<button onclick="go('cover')">${C().back}</button><button onclick="go('setup')">${C().setup}</button><button class="primary" onclick="S.clue=0;go('hunt')">${C().hunt}</button>`)}function setup(){let items=DATA.map((d,i)=>`<div><b>${String(i+1).padStart(2,'0')}</b> · ${tr()?d.atr:d.aen}<br><small>${tr()?'Sonraki kartı bu cevaba saklayın.':'Hide the next card at this answer.'}</small></div>`).join('');return shell(tr()?'YALNIZCA YETİŞKİNLER':'GROWN-UPS ONLY',C().setup,`<div class="hint">${tr()?'Kart 2’yi Kart 1’in cevabına yerleştirin ve sırayla devam edin. Kart 12 fırının yalnızca yakınına, yetişkin gözetiminde konmalıdır.':'Place Card 2 at Card 1’s answer and continue in order. Card 12 goes near—not in—the oven with adult supervision.'}</div><div class="setup">${items}</div>`,`<button onclick="go('brief')">${C().back}</button><button class="primary" onclick="S.clue=0;go('hunt')">${C().hunt}</button>`)}function hintFor(d){return tr()?`Cevap ${d.atr.length} karakterlik bir ev eşyası veya yerdir.`:`The answer is a household object or place with ${d.aen.replace(/ /g,'').length} letters.`}function hunt(){let d=DATA[S.clue],done=S.solved[S.clue],steps=DATA.map((x,i)=>`<span class="step ${i===S.clue?'now':S.solved[i]?'done':''}">${i+1}</span>`).join('');return shell(`${tr()?'İPUCU':'CLUE'} ${d.n} / 16`,tr()?'Ay Taşının İzini Takip Et':'Follow the Moonstone Trail',`<div class="cluemap">${steps}</div><div class="mission"><div class="visual"><span class="object">${ICON[d.key]}</span><span>${tr()?d.tr:d.en}</span></div><div style="margin-top:15px"><input id="ans" autocomplete="off" placeholder="${tr()?'Cevabını yaz':'Type your answer'}" ${done?'disabled':''}></div><div class="nav"><button onclick="checkAnswer()">${C().check}</button><button onclick="toggleHint()">${C().hint}</button></div><div id="hint" class="hint" hidden>${hintFor(d)}</div><div class="feedback ${done?'ok':''}">${done?C().correct:''}</div></div>`,`<button onclick="prevClue()">${C().back}</button>${done?`<button class="primary" onclick="nextClue()">${d.n===16?C().bonus:C().next}</button>`:''}`)}function norm(s){return String(s).toLocaleUpperCase('tr-TR').replace(/[Ç]/g,'C').replace(/[Ğ]/g,'G').replace(/[İI]/g,'I').replace(/[Ö]/g,'O').replace(/[Ş]/g,'S').replace(/[Ü]/g,'U').replace(/[^A-Z0-9]/g,'')}function checkAnswer(){let d=DATA[S.clue],a=tr()?d.atr:d.aen;let aliases={FRIDGE:['REFRIGERATOR'],SOFA:['COUCH'],TV:['TELEVISION'],TOYBOX:['TOYCHEST'],SHOERACK:['SHOECABINET'],TELEVIZYON:['TV'],KOLTUK:['KANEPE'],OYUNCAKKUTUSU:['OYUNCAKSANDIGI']}[norm(a)]||[];if(norm(ans.value)===norm(a)||aliases.includes(norm(ans.value))){S.solved[S.clue]=true;save();render()}else{let f=document.querySelector('.feedback');f.className='feedback bad';f.textContent=C().wrong}}function toggleHint(){let h=document.getElementById('hint');h.hidden=!h.hidden}function prevClue(){if(S.clue>0){S.clue--;save();render()}else go('brief')}function nextClue(){if(!S.solved[S.clue])return;if(S.clue<15){S.clue++;save();render()}else go('bonus1')}function bonus1(){let done=S.bonus[0];return shell('BONUS 1 / 3',tr()?'Şifre Çözücü':'Code Breaker',`<div class="mission"><p>${tr()?'A=1, B=2, C=3 ... kullanarak çalınan kanıtı yaz.':'Use A=1, B=2, C=3 ... to name the stolen evidence.'}</p><div class="visual">${tr()?'1 · 25 · 20 · 1 · 19 · 9':'13 · 15 · 15 · 14 · 19 · 20 · 15 · 14 · 5'}</div><input id="b1"><div class="nav"><button onclick="checkB1()">${C().check}</button></div><div class="feedback ${done?'ok':''}">${done?C().correct:''}</div></div>`,`<button onclick="S.clue=15;go('hunt')">${C().back}</button>${done?`<button class="primary" onclick="go('bonus2')">${C().bonus}</button>`:''}`)}function checkB1(){let ok=tr()?['AYTASI','AYTASI'].includes(norm(b1.value)):norm(b1.value)==='MOONSTONE';if(ok){S.bonus[0]=true;save();render()}else document.querySelector('.feedback').textContent=C().wrong}function bonus2(){let done=S.bonus[1],fps='ABCDEF'.split('').map(x=>`<button data-fp="${x}"><div class="fp v${x}">${x}</div></button>`).join('');return shell('BONUS 2 / 3',tr()?'Parmak İzi Eşleştirme':'Fingerprint Match',`<div class="mission"><p>${tr()?'Hedef izdeki tüm çizgi kırılmaları ve kanıt noktası hangi seçenekte aynıdır?':'Which option matches every ridge break and evidence dot in the target print?'}</p><div class="visual"><div class="fp vE" style="width:170px">TARGET</div></div><div class="fps">${fps}</div><div class="feedback ${done?'ok':''}">${done?C().correct:''}</div></div>`,`<button onclick="go('bonus1')">${C().back}</button>${done?`<button class="primary" onclick="go('bonus3')">${C().bonus}</button>`:''}`)}function chooseFP(x){if(x==='E'){S.bonus[1]=true;save();render()}else{let f=document.querySelector('.feedback');f.className='feedback bad';f.textContent=C().wrong}}function mazeHTML(){return Array.from({length:36},(_,i)=>`<div class="cell ${BLOCKS.includes(i)?'block':''} ${S.pos===i?'player':''} ${i===35?'goal':''}">${S.pos===i?'●':i===35?'◆':''}</div>`).join('')}function bonus3(){let done=S.bonus[2];return shell('BONUS 3 / 3',tr()?'Ay Taşı Labirenti':'Moonstone Maze',`<div class="mission"><p>${tr()?'Kırmızı kanıt işaretini koyu engellere dokunmadan Ay Taşına ulaştır.':'Guide the red evidence marker to the Moonstone without touching the dark blocks.'}</p><div class="maze">${mazeHTML()}</div><div class="arrows"><span></span><button onclick="move(-6)">↑</button><span></span><button onclick="move(-1)">←</button><button onclick="move(6)">↓</button><button onclick="move(1)">→</button></div><div class="feedback ${done?'ok':''}">${done?C().correct:''}</div></div>`,`<button onclick="go('bonus2')">${C().back}</button>${done?`<button class="primary" onclick="go('cert')">${C().cert}</button>`:''}`)}function move(delta){let n=S.pos+delta,row=Math.floor(S.pos/6);if(n<0||n>35||BLOCKS.includes(n)||(delta===1&&Math.floor(n/6)!==row)||(delta===-1&&Math.floor(n/6)!==row))return;S.pos=n;if(n===35)S.bonus[2]=true;save();render()}function cert(){return shell('CASE 016 // CLOSED',C().cert,`<div class="cert"><div class="stone"></div><h2>${C().cert}</h2><input id="name" value="${esc(S.name)}" placeholder="${C().name}"><p>${tr()?'Ay Taşını kurtardığı ve on dokuz görevi tamamladığı için.':'for recovering the Moonstone and completing all nineteen challenges.'}</p></div>`,`<button onclick="go('bonus3')">${C().back}</button><button class="primary" onclick="resetAll()">${C().again}</button>`)}function resetAll(){if(confirm(tr()?'Kayıtlı ilerleme silinsin ve yeni vaka başlatılsın mı?':'Erase saved progress and start a new case?')){timerPause();let lang=S.lang;S={lang,screen:'cover',clue:0,solved:Array(16).fill(false),bonus:[false,false,false],seconds:4500,running:false,pos:0,name:''};save();render()}}function bind(){document.querySelectorAll('[data-fp]').forEach(b=>b.onclick=()=>chooseFP(b.dataset.fp));let n=document.getElementById('name');if(n)n.oninput=()=>{S.name=n.value;save()}}function render(){document.documentElement.lang=S.lang;enBtn.classList.toggle('active',!tr());trBtn.classList.toggle('active',tr());saved.textContent=C().saved;startBtn.textContent=C().start;pauseBtn.textContent=C().pause;resetBtn.textContent=C().reset;let count=S.solved.filter(Boolean).length+S.bonus.filter(Boolean).length;bar.style.width=(count/19*100)+'%';let f={cover,brief,setup,hunt,bonus1,bonus2,bonus3,cert}[S.screen]||cover;app.innerHTML=f();bind();clock()}render();</script></body></html>
