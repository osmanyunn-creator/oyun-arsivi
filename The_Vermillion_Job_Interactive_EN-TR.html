<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07131f"><title>The Vermillion Job - Interactive Heist Night</title><style>
:root{--night:#07131f;--navy:#102535;--burg:#741d2a;--emerald:#145746;--brass:#d2a84d;--sapphire:#2386c4;--paper:#f4ebd8;--white:#fff;--ink:#172129;--muted:#68747b}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#173b50 0,var(--night) 48%,#03090e 100%);color:white;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;background-image:linear-gradient(135deg,transparent 48%,#d2a84d 49% 51%,transparent 52%);background-size:52px 52px}.top{position:sticky;top:0;z-index:5;background:#07131ff2;border-bottom:1px solid #d2a84d88;backdrop-filter:blur(12px)}.topin{max-width:1050px;margin:auto;padding:10px 15px;display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{color:var(--brass);font:900 13px ui-monospace,monospace;letter-spacing:.12em}.actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:flex-end}button{font:800 12px system-ui;border:1px solid var(--brass);border-radius:7px;background:transparent;color:white;padding:8px 12px;cursor:pointer}button.active{background:var(--brass);color:var(--night)}button.primary{border:0;padding:13px 18px;background:linear-gradient(90deg,var(--burg),#a62c3c);color:white;font-size:15px}.timer{font:900 13px ui-monospace,monospace;color:var(--brass)}.saved{font-size:10px;color:#c8d3d8}.wrap{max-width:1050px;margin:auto;padding:25px 15px 70px}.progress{height:8px;background:#ffffff22;border-radius:99px;margin-bottom:18px;overflow:hidden}.progress span{height:100%;display:block;background:linear-gradient(90deg,var(--burg),var(--brass),var(--sapphire));transition:width .3s}.card{position:relative;overflow:hidden;background:var(--paper);color:var(--ink);border:1px solid var(--brass);border-radius:11px;padding:clamp(22px,5vw,45px);box-shadow:0 30px 80px #000a}.card:after{content:"";position:absolute;width:190px;height:190px;right:-95px;bottom:-95px;transform:rotate(45deg);border:22px double #d2a84d22}.content{position:relative;z-index:1}.eyebrow{font:900 11px ui-monospace,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--burg)}h1,h2{font-family:Georgia,serif;color:var(--night);margin:.25em 0}h1{font-size:clamp(40px,8vw,72px);line-height:.95}h2{font-size:clamp(29px,5vw,45px)}.lead{font-size:18px;line-height:1.6}.gem{width:140px;height:170px;margin:25px auto;background:linear-gradient(145deg,#b8ecff,var(--sapphire) 55%,#06496f);clip-path:polygon(50% 0,90% 25%,78% 78%,50% 100%,22% 78%,10% 25%);box-shadow:0 0 50px #2386c477}.meta,.nav,.steps{display:flex;gap:9px;flex-wrap:wrap}.meta span,.step{background:#e1d4b8;color:var(--ink);padding:8px 11px;border-radius:6px;font:900 12px ui-monospace,monospace}.nav{margin-top:25px}.nav .primary{flex:1;min-width:180px}.step.now{background:var(--burg);color:white}.step.done{background:var(--emerald);color:white}.panel{background:white;border:1px solid #d1c29d;border-radius:9px;padding:18px;margin:16px 0}.visual{min-height:170px;display:grid;place-items:center;background:var(--navy);color:white;border:1px solid var(--brass);border-radius:8px;padding:18px;text-align:center;font:800 clamp(18px,5vw,35px) ui-monospace,monospace;line-height:1.7}.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:18px 0}.answers button{color:var(--ink);background:white;border:2px solid #d1c29d;border-radius:7px;padding:13px}.answers button:hover{border-color:var(--burg)}.answers button.correct{background:#d7f0e4;border-color:var(--emerald)}.feedback{font-weight:900;min-height:24px}.ok{color:var(--emerald)}.bad{color:var(--burg)}.hint{background:#fff1c8;border-left:5px solid var(--brass);padding:13px 15px;border-radius:7px;margin-top:12px}.vault{text-align:center;background:var(--navy);color:white;border-radius:9px;padding:25px}.vault h2{color:white}.digits{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.digits input{width:58px;height:63px;text-align:center;font-size:26px;font-weight:900;border:2px solid var(--brass);border-radius:8px}.choicegrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.choice{background:white;border:2px solid var(--brass);border-radius:9px;padding:20px;text-align:center}.choice button{color:var(--ink)}.cert{text-align:center;background:var(--night);color:white;border:8px double var(--brass);padding:30px}.cert h2{color:white}.cert input{width:min(100%,430px);padding:11px;background:transparent;color:white;border:0;border-bottom:2px solid var(--sapphire);text-align:center;font-size:20px}@media(max-width:700px){.answers,.choicegrid{grid-template-columns:1fr}.brand{font-size:11px}.timer{order:3;width:100%;text-align:right}}@media print{.top,.progress,.nav{display:none!important}body{background:white}.wrap{padding:0}.card{box-shadow:none;border:0}}</style></head><body><header class="top"><div class="topin"><div class="brand">VERMILLION // JOB 12</div><div class="actions"><span id="saved" class="saved">Saved locally</span><span id="timer" class="timer">90:00</span><button id="startBtn" onclick="timerStart()">Start</button><button id="pauseBtn" onclick="timerPause()">Pause</button><button id="enBtn" onclick="setLang('en')">EN</button><button id="trBtn" onclick="setLang('tr')">TR</button><button id="resetBtn" onclick="resetAll()">Reset</button></div></div></header><main class="wrap"><div class="progress"><span id="bar"></span></div><section class="card" id="app"></section></main><script>const DATA=[{"key": "hacker", "title": ["The Keypad", "Tuş Takımı"], "role": ["Hacker", "Hacker"], "q": ["Place values are 8, 4, 2, 1. Decode 1 0 0 1.", "Basamak değerleri 8, 4, 2, 1. 1 0 0 1 kodunu çözün."], "visual": "8  4  2  1<br><b>1  0  0  1</b>", "answers": [["7", "8", "9", "10"], ["7", "8", "9", "10"]], "correct": "9", "hint": ["Only the first and last place values are active.", "Yalnızca ilk ve son basamak değeri aktif."]}, {"key": "cracksman", "title": ["The Blueprint Dial", "Plan Kadranı"], "role": ["Cracksman", "Kasa Ustası"], "q": ["Ten columns minus three gala nights plus one vault lock.", "On sütundan üç gala gecesini çıkarın ve bir kasa kilidi ekleyin."], "visual": "10  −  3  +  1  =  ?", "answers": [["6", "7", "8", "9"], ["6", "7", "8", "9"]], "correct": "8", "hint": ["Work from left to right.", "Soldan sağa ilerleyin."]}, {"key": "face", "title": ["The Guest List", "Konuk Listesi"], "role": ["The Face", "Yüz"], "q": ["Eight guards patrol. Half work nights; one of those is inside. How many night guards are outside?", "Sekiz muhafızın yarısı gece çalışıyor; bunların biri içeride. Dışarıda kaç gece muhafızı var?"], "visual": "8  →  HALF  →  − 1 INSIDE<br>OUTSIDE = ?", "answers": [["2", "3", "4", "5"], ["2", "3", "4", "5"]], "correct": "3", "hint": ["Find half of eight, then remove one.", "Sekizin yarısını bulun, sonra biri çıkarın."]}, {"key": "lookout", "title": ["The Monitor Wall", "Monitör Duvarı"], "role": ["Lookout", "Gözcü"], "q": ["Nine cameras watch the gallery. Three are offline. How many are still live?", "Dokuz kamera galeriyi izliyor. Üçü çevrimdışı. Kaçı hâlâ aktif?"], "visual": "▣ ▧ ▣<br>▣ ▣ ▧<br>▣ ▧ ▣", "answers": [["5", "6", "7", "8"], ["5", "6", "7", "8"]], "correct": "6", "hint": ["Subtract the three offline screens from all nine.", "Dokuzdan çevrimdışı üç ekranı çıkarın."]}];const COPY={en:{saved:'Saved locally',start:'Start',pause:'Pause',reset:'Reset',eye:'INTERACTIVE HEIST NIGHT',title:'The Vermillion Job',lead:'Five specialists. Four prep dossiers. One sapphire waiting behind a four-digit vault code.',begin:'Open Crew File',brief:'Crew Briefing',briefBody:'Ages 14+ · 4-6 players · 60-90 minutes. Assign roles, solve the four prep dossiers and make the final choice together.',continue:'Begin the Job',back:'Back',next:'Continue',hub:'Prep Dossiers',hubBody:'Choose any unsolved specialist file. The Wheelman coordinates and records every digit.',solve:'Open Dossier',hint:'Open gentle hint',correct:'Digit secured.',wrong:'Access denied. Recheck the evidence.',digit:'Vault digit',plan:'Assemble the Plan',night:'Heist Night',vault:'The Vault',enter:'Verify Code',mismatch:'Code mismatch. Return to the dossiers or try again.',choice:'One More Gem?',quiet:'Quiet Exit',extra:'Take the Twin',heads:'HEADS - THE BIG SCORE',tails:'TAILS - ALARM BELLS',flip:'Flip the Coin',clean:'CLEAN GETAWAY. The crew leaves with the Sapphire and no witnesses.',big:'THE BIG SCORE. Both stones leave with the crew.',alarm:'ALARM BELLS. The crew escapes with the Sapphire, but the legend has begun.',cert:'Certified Vermillion Crew',name:'Type crew name',again:'Plan Another Job'},tr:{saved:'Yerel olarak kaydedildi',start:'Başlat',pause:'Duraklat',reset:'Sıfırla',eye:'İNTERAKTİF SOYGUN GECESİ',title:'Vermillion Vurgunu',lead:'Beş uzman. Dört hazırlık dosyası. Dört rakamlı kasanın ardında bekleyen tek safir.',begin:'Ekip Dosyasını Aç',brief:'Ekip Brifingi',briefBody:'14+ yaş · 4-6 oyuncu · 60-90 dakika. Rolleri paylaşın, dört hazırlık dosyasını çözün ve son kararı birlikte verin.',continue:'Vurgunu Başlat',back:'Geri',next:'Devam Et',hub:'Hazırlık Dosyaları',hubBody:'Çözülmemiş bir uzman dosyası seçin. Şoför süreci yönetir ve her rakamı kaydeder.',solve:'Dosyayı Aç',hint:'Küçük ipucunu aç',correct:'Rakam alındı.',wrong:'Erişim reddedildi. Kanıtı tekrar kontrol edin.',digit:'Kasa rakamı',plan:'Planı Birleştir',night:'Soygun Gecesi',vault:'Kasa',enter:'Şifreyi Doğrula',mismatch:'Şifre eşleşmedi. Dosyalara dönün veya tekrar deneyin.',choice:'Bir Taş Daha mı?',quiet:'Sessiz Çıkış',extra:'İkizi de Al',heads:'YAZI - BÜYÜK VURGUN',tails:'TURA - TEHLİKE ÇANLARI',flip:'Parayı At',clean:'TEMİZ KAÇIŞ. Ekip Safirle ve tanık bırakmadan çıkıyor.',big:'BÜYÜK VURGUN. İki taş da ekiple birlikte çıkıyor.',alarm:'TEHLİKE ÇANLARI. Ekip Safirle kaçıyor ama efsane başladı.',cert:'Onaylı Vermillion Ekibi',name:'Ekip adını yaz',again:'Başka Bir Vurgun Planla'}};const KEY='vermillion-job-v4';let S={lang:'en',screen:'cover',current:0,solved:{},seconds:5400,running:false,outcome:'',crewName:''};try{const q=JSON.parse(localStorage.getItem(KEY)||'{}');S={...S,...q,running:false};if(!S.solved||typeof S.solved!=='object')S.solved={}}catch(e){}let tick=null;const C=()=>COPY[S.lang],L=a=>a[S.lang==='en'?0:1],esc=v=>String(v??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));function save(){localStorage.setItem(KEY,JSON.stringify(S));document.getElementById('saved').textContent=C().saved}function go(s){S.screen=s;save();scrollTo({top:0,behavior:'smooth'});render()}function setLang(l){S.lang=l;save();render()}function clock(){let m=Math.floor(S.seconds/60),s=S.seconds%60;document.getElementById('timer').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}function timerStart(){if(tick)return;S.running=true;tick=setInterval(()=>{if(S.seconds>0){S.seconds--;clock();if(S.seconds%5===0)save()}else timerPause()},1000)}function timerPause(){clearInterval(tick);tick=null;S.running=false;save()}function shell(eye,title,body,nav=''){return `<div class="content"><div class="eyebrow">${eye}</div><h2>${title}</h2>${body}<div class="nav">${nav}</div></div>`}function cover(){return `<div class="content"><div class="eyebrow">${C().eye}</div><h1>${C().title}</h1><p class="lead">${C().lead}</p><div class="gem"></div><div class="meta"><span>AGES 14+</span><span>4-6 PLAYERS</span><span>60-90 MIN</span><span>OFFLINE</span><span>NO CUTTING</span></div><div class="nav"><button class="primary" onclick="go('brief')">${C().begin}</button></div></div>`}function brief(){return shell(C().brief,C().brief,`<p class="lead">${C().briefBody}</p><div class="panel"><b>PDF + HTML</b><p>${S.lang==='en'?'Printer, pencils, optional coin and timer. No envelopes, app, account or internet required.':'Yazıcı, kalemler, isteğe bağlı para ve kronometre. Kesme, zarf, uygulama, hesap veya internet gerekmez.'}</p></div>`,`<button onclick="go('cover')">${C().back}</button><button class="primary" onclick="go('job')">${C().continue}</button>`)}function job(){let text=S.lang==='en'?`The Empress Sapphire is displayed at the Founders’ Masquerade Gala for one night only. At dawn it vanishes into a private vault for fifty years. Your fictional crew has one narrow window: solve four prep dossiers, assemble the code, reach the display and decide how the night ends.`:`İmparatoriçe Safiri Kurucular Maskeli Galasında yalnızca bir gece sergileniyor. Şafakta elli yıllığına özel kasaya girecek. Kurgusal ekibinizin tek fırsatı var: dört hazırlık dosyasını çözün, şifreyi birleştirin, vitrine ulaşın ve gecenin nasıl biteceğine karar verin.`;return shell(S.lang==='en'?'THE JOB':'İŞ',S.lang==='en'?'One Night Only':'Sadece Bir Gece',`<p class="lead">${text}</p><div class="visual">SERVICE → EAST WING → GALLERY → VAULT</div>`,`<button onclick="go('brief')">${C().back}</button><button class="primary" onclick="go('hub')">${C().next}</button>`)}function hub(){let cards=DATA.map((d,i)=>`<button class="choice" onclick="S.current=${i};go('puzzle')"><b>${L(d.role)}</b><br>${L(d.title)}<br>${S.solved[d.key]?'✓ '+C().digit+': '+S.solved[d.key]:C().solve}</button>`).join('');let all=DATA.every(d=>S.solved[d.key]);return shell(C().hub,C().hub,`<p>${C().hubBody}</p><div class="choicegrid">${cards}</div>`,`<button onclick="go('job')">${C().back}</button>${all?`<button class="primary" onclick="go('plan')">${C().plan}</button>`:''}`)}function puzzle(){let d=DATA[S.current],done=S.solved[d.key];let answers=L(d.answers).map(a=>`<button data-answer="${a}" ${done?'disabled':''} class="${done&&a===d.correct?'correct':''}">${a}</button>`).join('');return shell(L(d.role),L(d.title),`<div class="steps">${DATA.map((x,i)=>`<span class="step ${i===S.current?'now':S.solved[x.key]?'done':''}">${i+1}</span>`).join('')}</div><p class="lead">${L(d.q)}</p><div class="visual">${d.visual}</div><div class="answers">${answers}</div><button onclick="toggleHint()">${C().hint}</button><div id="hint" class="hint" hidden>${L(d.hint)}</div><div class="feedback ${done?'ok':''}">${done?C().correct+' '+C().digit+': '+done:''}</div>`,`<button onclick="go('hub')">${C().back}</button>${done?`<button class="primary" onclick="go('hub')">${C().next}</button>`:''}`)}function answer(a){let d=DATA[S.current];if(a===d.correct){S.solved[d.key]=a;save();render()}else{let f=document.querySelector('.feedback');f.className='feedback bad';f.textContent=C().wrong}}function toggleHint(){let h=document.getElementById('hint');h.hidden=!h.hidden}function plan(){let code=DATA.map(d=>S.solved[d.key]).join('');return shell(C().plan,C().plan,`<p class="lead">${S.lang==='en'?'Role order: Hacker - Cracksman - Face - Lookout. Your secured digits are ready for the Vault.':'Rol sırası: Hacker - Kasa Ustası - Yüz - Gözcü. Rakamlarınız Kasa için hazır.'}</p><div class="visual">${code.split('').join('  ·  ')}</div>`,`<button onclick="go('hub')">${C().back}</button><button class="primary" onclick="go('night')">${C().night}</button>`)}function night(){return shell(C().night,C().night,`<p class="lead">${S.lang==='en'?'A guard headcount reaches the Grand Hall in three minutes. The regular route is closing. The Wheelman calls service stairs, east corridor, gallery, vault. Place the Crew Plan in the center and move together.':'Muhafız sayımı üç dakika içinde Büyük Salona ulaşacak. Normal rota kapanıyor. Şoför servis merdiveni, doğu koridoru, galeri, kasa rotasını veriyor. Ekip Planını ortaya koyun ve birlikte ilerleyin.'}</p><div class="visual">11:47 PM<br>03:00 REMAINING</div>`,`<button onclick="go('plan')">${C().back}</button><button class="primary" onclick="go('vault')">${C().vault}</button>`)}function vault(){return shell(C().vault,C().vault,`<div class="vault"><div class="gem"></div><div class="digits">${[0,1,2,3].map(i=>`<input maxlength="1" inputmode="numeric" data-v="${i}">`).join('')}</div><p><button class="primary" onclick="checkVault()">${C().enter}</button></p><div id="vf" class="feedback"></div></div>`,`<button onclick="go('night')">${C().back}</button>`)}function checkVault(){let entered=[...document.querySelectorAll('[data-v]')].map(x=>x.value).join('');if(entered==='9836')go('choice');else{let f=document.getElementById('vf');f.className='feedback bad';f.textContent=C().mismatch}}function choice(){return shell(C().choice,C().choice,`<p class="lead">${S.lang==='en'?'The Sapphire is the job. An unlisted twin waits beside it. Choose together.':'Safir hedefiniz. Yanında listede olmayan bir ikiz bekliyor. Birlikte seçin.'}</p><div class="choicegrid"><div class="choice"><h3>${C().quiet}</h3><p>${S.lang==='en'?'Take only the Sapphire and close the case.':'Yalnızca Safiri alın ve vitrini kapatın.'}</p><button onclick="finish('clean')">${C().quiet}</button></div><div class="choice"><h3>${C().extra}</h3><p>${S.lang==='en'?'Take the Twin too and let the coin decide.':'İkizi de alın ve sonucu paraya bırakın.'}</p><button onclick="flipCoin()">${C().flip}</button></div></div><div id="coinResult" class="hint" ${S.outcome?'':'hidden'}>${S.outcome==='big'?C().heads:S.outcome==='alarm'?C().tails:''}</div>`,`<button onclick="go('vault')">${C().back}</button>`)}function flipCoin(){finish(Math.random()<.5?'big':'alarm')}function finish(x){S.outcome=x;timerPause();save();go('outcome')}function outcome(){let txt=S.outcome==='clean'?C().clean:S.outcome==='big'?C().big:C().alarm;return shell(S.lang==='en'?'OUTCOME':'SONUÇ',S.outcome==='clean'?C().quiet:S.outcome==='big'?C().heads:C().tails,`<p class="lead">${txt}</p><div class="gem"></div>`,`<button class="primary" onclick="go('cert')">${C().cert}</button>`)}function cert(){return shell('JOB NO. 12',C().cert,`<div class="cert"><div class="gem"></div><h2>${C().cert}</h2><input id="crewName" value="${esc(S.crewName)}" placeholder="${C().name}"><p>${S.lang==='en'?'One gala. One vault. One unforgettable score.':'Bir gala. Bir kasa. Unutulmaz bir vurgun.'}</p></div>`,`<button onclick="go('outcome')">${C().back}</button><button class="primary" onclick="resetAll()">${C().again}</button>`)}function resetAll(){if(confirm(S.lang==='en'?'Erase saved progress and plan a new job?':'Kayıtlı ilerleme silinsin ve yeni bir vurgun başlatılsın mı?')){timerPause();let lang=S.lang;S={lang,screen:'cover',current:0,solved:{},seconds:5400,running:false,outcome:'',crewName:''};save();render()}}function bind(){document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answer(b.dataset.answer));let n=document.getElementById('crewName');if(n)n.oninput=()=>{S.crewName=n.value;save()}}function render(){document.documentElement.lang=S.lang;document.getElementById('enBtn').classList.toggle('active',S.lang==='en');document.getElementById('trBtn').classList.toggle('active',S.lang==='tr');document.getElementById('saved').textContent=C().saved;document.getElementById('startBtn').textContent=C().start;document.getElementById('pauseBtn').textContent=C().pause;document.getElementById('resetBtn').textContent=C().reset;let count=Object.keys(S.solved).length;document.getElementById('bar').style.width=((count+(S.outcome?2:0))/6*100)+'%';let f={cover,brief,job,hub,puzzle,plan,night,vault,choice,outcome,cert}[S.screen]||cover;document.getElementById('app').innerHTML=f();bind();clock()}render();</script></body></html>
