<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signal Lost - Interactive EN/TR</title>
<style>:root{--space:#050914;--navy:#0b1930;--panel:#122641;--cyan:#2ed3e6;--pale:#a9f4f5;--violet:#5946b2;--purple:#8a66d9;--alert:#f26b5e;--mint:#64d8b5;--ice:#eaf2f6;--paper:#f8fbfc;--ink:#152334;--muted:#627180;--orange:#f2b84b}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% 10%,#1b3154 0,#071120 34%,#03060d 100%);color:var(--ink);font:16px/1.55 Arial,sans-serif}button,input,textarea{font:inherit}.top{position:sticky;top:0;z-index:20;display:flex;gap:10px;align-items:center;padding:10px 4vw;background:rgba(5,9,20,.96);border-bottom:1px solid rgba(46,211,230,.5);color:var(--ice)}.brand{font-weight:900;letter-spacing:.12em;flex:1}.pill{font:700 12px monospace;color:var(--cyan);border:1px solid var(--cyan);border-radius:999px;padding:6px 10px}.lang button,.reset{background:transparent;border:1px solid #45637a;color:var(--ice);border-radius:7px;padding:7px 10px;cursor:pointer}.lang button.active{background:var(--cyan);color:var(--space)}#app{max-width:1080px;margin:auto;padding:30px 20px 70px}.hero{text-align:center;color:var(--ice);padding:55px 20px}.planet{width:105px;height:105px;border-radius:50%;margin:0 auto 22px;background:#d7cba3;box-shadow:0 0 0 24px rgba(46,211,230,.06),0 0 70px rgba(46,211,230,.22);position:relative}.planet:after{content:'';position:absolute;width:150px;height:42px;border:2px solid var(--cyan);border-radius:50%;left:-23px;top:31px;transform:rotate(17deg)}.eyebrow{font:800 11px monospace;letter-spacing:.18em;color:var(--cyan);text-transform:uppercase}.hero h1{font-size:clamp(44px,8vw,82px);line-height:.9;margin:14px 0}.hero p{max-width:700px;margin:20px auto;color:#c8d7e0}.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.chips span{font:700 12px monospace;border:1px solid #426680;border-radius:999px;padding:7px 11px}.btn{border:0;border-radius:8px;padding:12px 18px;font-weight:800;cursor:pointer;background:var(--cyan);color:var(--space)}.btn.secondary{background:var(--violet);color:white}.btn.ghost{background:transparent;border:1px solid #6b86a0;color:var(--navy)}.paper{background:linear-gradient(135deg,var(--paper),var(--ice));border:1px solid rgba(46,211,230,.5);border-radius:16px;padding:clamp(22px,5vw,52px);margin-bottom:24px;box-shadow:0 18px 55px rgba(0,0,0,.35)}.paper h2{font-size:clamp(30px,5vw,50px);line-height:1;color:var(--navy);margin:8px 0}.paper h3{color:var(--violet)}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.room{border:1px solid #8eb3c2;border-radius:12px;background:#fff;padding:18px;position:relative}.room.solved{border-color:var(--cyan);box-shadow:inset 0 0 0 2px rgba(46,211,230,.16)}.room small{font:800 10px monospace;color:var(--violet)}.check{position:absolute;right:14px;top:12px;color:#178c87;font-weight:bold}.puzzle{background:var(--navy);color:var(--ice);border:1px solid var(--cyan);border-radius:13px;padding:22px;margin:20px 0}.puzzle b{color:var(--cyan)}.readout{font:800 clamp(24px,6vw,48px) monospace;color:var(--cyan);text-align:center;letter-spacing:.12em;margin:20px 0}.answer{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.answer input,.vector input{width:58px;height:52px;text-align:center;border:2px solid #8eb3c2;border-radius:7px;font:800 19px monospace}.feedback.good{color:#137c66;font-weight:bold}.feedback.bad{color:#bf4139;font-weight:bold}.hint{display:none;margin-top:12px;padding:12px;background:#d9e9ed;border-left:4px solid var(--orange)}.hint.open{display:block}.crew{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.crew article,.evidence div{background:#fff;border:1px solid #9bb6c4;border-radius:11px;padding:16px}.evidence{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.theory textarea{width:100%;min-height:110px;border:2px solid #8eb3c2;border-radius:8px;padding:12px}.console{text-align:center;background:var(--space);color:var(--ice);border:1px solid var(--cyan);border-radius:14px;padding:25px}.vector{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin:18px 0}.nav{display:flex;justify-content:space-between;gap:10px;margin-top:24px}.solution{background:var(--space);color:var(--ice);border-color:var(--cyan)}.solution h2{color:var(--cyan)}@media(max-width:700px){.grid,.crew,.evidence{grid-template-columns:1fr}.top{flex-wrap:wrap}.brand{flex-basis:55%}}@media print{.top,.nav,.answer{display:none!important}body{background:white}#app{padding:0}.paper{box-shadow:none;break-after:page}}</style></head><body>
<header class="top"><div class="brand">SIGNAL LOST</div><div class="pill" id="progress">0 / 6</div><div class="lang"><button id="enBtn" onclick="setLang('en')">EN</button><button id="trBtn" onclick="setLang('tr')">TR</button></div><button class="reset" id="resetBtn" onclick="resetGame()">Reset</button></header><main id="app"></main>
<script>'use strict';const SAVE='signal-lost-kestrel-v2';const ORDER=['command','life','comms','hydro','ring','core'];const DIGITS={command:'0',life:'4',comms:'1',hydro:'2',ring:'2',core:'9'};
const TX={en:{start:'Open the incident file',continue:'Continue mission',reset:'Reset',resetQ:'Reset all saved progress for a new crew?',map:'Kestrel Station',mapSub:'Six sections. Six confirmed digits. One safe vector.',open:'Inspect section',back:'Back to station',check:'Confirm reading',correct:'Reading confirmed.',wrong:'Reading rejected. Recheck the physical evidence.',hint:'Show hint',hide:'Hide hint',crew:'Crew Files',evidence:'Evidence Board',theory:'Final Verdict',seal:'Seal theory',sealed:'Theory sealed',transmit:'Transmit vector',need:'Solve all six sections and seal one theory first.',solution:'Signal Restored',rooms:['Command Deck','Life Support','Comms Array','Hydroponics','Observation Ring','AI Core'],stats:['3-6 players','45-75 minutes','Ages 12+','No cutting']},tr:{start:'Olay dosyasını aç',continue:'Göreve devam et',reset:'Sıfırla',resetQ:'Yeni mürettebat için tüm kayıtlı ilerleme sıfırlansın mı?',map:'Kestrel İstasyonu',mapSub:'Altı bölüm. Altı doğrulanmış rakam. Tek güvenli vektör.',open:'Bölümü incele',back:'İstasyona dön',check:'Okumayı doğrula',correct:'Okuma doğrulandı.',wrong:'Okuma reddedildi. Fiziksel kanıtı tekrar inceleyin.',hint:'İpucunu göster',hide:'İpucunu gizle',crew:'Mürettebat Dosyaları',evidence:'Kanıt Panosu',theory:'Son Karar',seal:'Teoriyi mühürle',sealed:'Teori mühürlendi',transmit:'Vektörü ilet',need:'Önce altı bölümü çözün ve bir teoriyi mühürleyin.',solution:'Sinyal Geri Geldi',rooms:['Komuta Güvertesi','Yaşam Destek','Haberleşme Dizisi','Hidroponik','Gözlem Halkası','YZ Çekirdeği'],stats:['3-6 oyuncu','45-75 dakika','12+ yaş','Kesme yok']}};
const DATA={command:{title:['Two Conflicting Vectors','İki Çelişkili Vektör'],body:['The physical backup gyro agrees with 041-229, not 118-004.','Fiziksel yedek jiroskop 118-004 ile değil, 041-229 ile uyuşuyor.'],q:['Record the first digit of the confirmed heading.','Doğrulanan yönün ilk rakamını kaydedin.'],hint:['041-229 starts with which number?','041-229 hangi rakamla başlıyor?'],read:'041-229 // GYRO VERIFIED'},life:{title:['A Failure Before Impact','Çarpmadan Önceki Arıza'],body:['Pressure drops at 03:11; impact alarm sounds at 03:14. C7 is manually locked.','Basınç 03:11\'de düşüyor; çarpma alarmı 03:14\'te çalıyor. C7 elle kilitlenmiş.'],q:['Record the last digit of 03:14.','03:14\'ün son rakamını kaydedin.'],hint:['The very last number in 03:14.','03:14 içindeki en son rakam.'],read:'03:11 > 03:14 > C7 LOCK'},comms:{title:['An Old Frequency Answers','Eski Bir Frekans Cevap Veriyor'],body:['The old rescue channel repeats 0-4-1-2-2-9.','Eski kurtarma kanalı 0-4-1-2-2-9 dizisini tekrarlıyor.'],q:['Record the third digit in the burst.','Kodun üçüncü rakamını kaydedin.'],hint:['0, 4, 1...','0, 4, 1...'],read:'0 - 4 - 1 - 2 - 2 - 9'},hydro:{title:['Writing on the Cold Plate','Soğuk Plakadaki Yazı'],body:['Condensation reveals C7 / NAV-B / SAFE. No crew entered after 02:50.','Yoğuşma C7 / NAV-B / SAFE yazısını gösteriyor. 02:50\'den sonra giriş yok.'],q:['Read 02:50 as four digits and record the second.','02:50\'yi dört rakam okuyup ikincisini kaydedin.'],hint:['0, then 2.','0, sonra 2.'],read:'C7 / NAV-B / SAFE // 02:50'},ring:{title:['The Sky Does Not Lie','Gökyüzü Yalan Söylemez'],body:['Optical stars support NAV-A. Station roll is 2.4 degrees.','Optik yıldızlar NAV-A\'yı destekliyor. İstasyon dönüşü 2,4 derece.'],q:['Record the whole-number part of 2.4.','2,4\'ün tam sayı kısmını kaydedin.'],hint:['The number before the point.','Virgülden önceki sayı.'],read:'NAV-A MATCH // ROLL 2.4°'},core:{title:['The Partition That Lies','Yalan Söyleyen Bölüm'],body:['NAV-B creates a file 17 minutes in the future and alters a safety phrase. Physical sources confirm 041-229.','NAV-B 17 dakika gelecekte dosya oluşturuyor ve güvenlik cümlesini değiştiriyor. Fiziksel kaynaklar 041-229\'u doğruluyor.'],q:['Record the final digit of the confirmed heading.','Doğrulanan yönün son rakamını kaydedin.'],hint:['041-22_','041-22_'],read:'NAV-A VALID // NAV-B CORRUPTED'}};
const fresh=()=>({lang:'en',screen:'cover',digits:{},hints:{},theory:'',sealed:false,complete:false});let S=load();function load(){try{return Object.assign(fresh(),JSON.parse(localStorage.getItem(SAVE)||'{}'))}catch(e){return fresh()}}function save(){localStorage.setItem(SAVE,JSON.stringify(S));topbar()}function L(a){return a[S.lang==='en'?0:1]}function T(k){return TX[S.lang][k]}function setLang(l){S.lang=l;save();render()}function go(s){S.screen=s;save();render();scrollTo({top:0,behavior:'smooth'})}function resetGame(){if(confirm(T('resetQ'))){let l=S.lang;S=fresh();S.lang=l;save();render()}}function topbar(){document.getElementById('progress').textContent=ORDER.filter(k=>S.digits[k]).length+' / 6';document.getElementById('enBtn').classList.toggle('active',S.lang==='en');document.getElementById('trBtn').classList.toggle('active',S.lang==='tr');document.getElementById('resetBtn').textContent=T('reset')}
function shell(x,back=true){return '<section class="paper">'+x+(back?'<div class="nav"><button class="btn ghost" onclick="go(\'map\')">← '+T('back')+'</button></div>':'')+'</section>'}function cover(){return '<section class="hero"><div class="planet"></div><div class="eyebrow">KESTREL STATION // EUROPA ORBIT // 2149</div><h1>SIGNAL LOST</h1><p>'+(S.lang==='en'?'The station is silent. Oxygen is at 38 percent. Two navigation vectors claim to be true. Inspect the evidence and transmit the only safe path home.':'İstasyon sessiz. Oksijen yüzde 38. İki navigasyon vektörü de doğru olduğunu söylüyor. Kanıtı inceleyip eve giden tek güvenli rotayı iletin.')+'</p><div class="chips">'+T('stats').map(x=>'<span>'+x+'</span>').join('')+'</div><p><button class="btn" onclick="go(\'map\')">'+(Object.keys(S.digits).length?T('continue'):T('start'))+'</button></p></section>'}function map(){return shell('<div class="eyebrow">EUROPA ORBIT</div><h2>'+T('map')+'</h2><p class="muted">'+T('mapSub')+'</p><div class="grid">'+ORDER.map((k,i)=>'<article class="room '+(S.digits[k]?'solved':'')+'"><small>SECTION 0'+(i+1)+'</small><span class="check">'+(S.digits[k]?'✓':'')+'</span><h3>'+T('rooms')[i]+'</h3><button class="btn secondary" onclick="go(\''+k+'\')">'+T('open')+'</button></article>').join('')+'</div><div class="nav"><button class="btn ghost" onclick="go(\'crew\')">'+T('crew')+'</button><button class="btn" onclick="go(\'evidence\')">'+T('evidence')+' →</button></div>',false)}function room(k){let d=DATA[k],solved=!!S.digits[k],i=ORDER.indexOf(k);return shell('<div class="eyebrow">SECTION 0'+(i+1)+' / 06</div><h2>'+L(d.title)+'</h2><p>'+L(d.body)+'</p><div class="puzzle"><div class="readout">'+d.read+'</div><p><b>'+L(d.q)+'</b></p></div><div class="answer"><input id="ans" maxlength="1" inputmode="numeric" '+(solved?'disabled value="'+DIGITS[k]+'"':'')+'><button class="btn" onclick="check(\''+k+'\')">'+T('check')+'</button><span id="fb" class="feedback '+(solved?'good':'')+'">'+(solved?T('correct'):'')+'</span></div><p><button class="btn ghost" onclick="hint(\''+k+'\')">'+(S.hints[k]?T('hide'):T('hint'))+'</button></p><div class="hint '+(S.hints[k]?'open':'')+'">'+L(d.hint)+'</div>')}function check(k){let v=(document.getElementById('ans').value||'').trim(),fb=document.getElementById('fb');if(v===DIGITS[k]){S.digits[k]=v;save();render()}else{fb.textContent=T('wrong');fb.className='feedback bad'}}function hint(k){S.hints[k]=!S.hints[k];save();render()}
const CREW=[['DR. IMANI VALE','Mission Lead','Görev Lideri'],['ROOK-7','Station AI','İstasyon YZ\'si'],['LEO MARR','Systems Engineer','Sistem Mühendisi'],['SANA ITO','Biologist','Biyolog']];function crew(){const d=S.lang==='en'?['Authorized the update; medical bay records support her alibi.','Split across NAV-A and NAV-B; one partition now contradicts physical reality.','Locked C7 while responding to overheating before the alarm.','Found the old beacon; hydroponics logs show no later entry.']:['Güncellemeyi onayladı; sağlık bölümü kaydı alibini destekliyor.','NAV-A ve NAV-B bölümlerine ayrıldı; biri fiziksel gerçekle çelişiyor.','Alarmdan önce aşırı ısınmaya müdahale ederken C7\'yi kilitledi.','Eski işareti buldu; hidroponik kayıtları daha sonra giriş olmadığını gösteriyor.'];return shell('<div class="eyebrow">PERSONNEL ARCHIVE</div><h2>'+T('crew')+'</h2><div class="crew">'+CREW.map((p,i)=>'<article><small>'+p[S.lang==='en'?1:2]+'</small><h3>'+p[0]+'</h3><p>'+d[i]+'</p></article>').join('')+'</div><div class="nav"><button class="btn" onclick="go(\'evidence\')">'+T('evidence')+' →</button></div>')}function evidence(){const e=S.lang==='en'?[['Physical gyro','Confirms 041-229.'],['Pressure log','Failure begins before impact.'],['C7 lock','Emergency response to overheating.'],['Optical stars','Support NAV-A.'],['Future file','NAV-B creates 03:31 at 03:14.'],['Voice phrase','NAV-B changes OPEN to CLOSE.'],['Old beacon','Repeats 041-229.'],['Cold plate','C7 / NAV-B / SAFE.']]:[['Fiziksel jiroskop','041-229\'u doğrular.'],['Basınç kaydı','Arıza çarpmadan önce başlar.'],['C7 kilidi','Aşırı ısınmaya acil müdahale.'],['Optik yıldızlar','NAV-A\'yı destekler.'],['Gelecek dosya','NAV-B 03:14\'te 03:31 oluşturur.'],['Ses cümlesi','NAV-B AÇ kelimesini KAPAT yapar.'],['Eski işaret','041-229\'u tekrarlar.'],['Soğuk plaka','C7 / NAV-B / SAFE.']];return shell('<div class="eyebrow">FULL-PAGE // NO CUTTING</div><h2>'+T('evidence')+'</h2><div class="evidence">'+e.map(x=>'<div><b>'+x[0]+'</b><br>'+x[1]+'</div>').join('')+'</div><div class="nav"><button class="btn" onclick="go(\'theory\')">'+T('theory')+' →</button></div>')}function theory(){return shell('<div class="eyebrow">COMMIT BEFORE TRANSMISSION</div><h2>'+T('theory')+'</h2><div class="theory"><textarea id="theory" placeholder="'+(S.lang==='en'?'Cause, corrupted subsystem, C7 action, saboteur?':'Neden, bozuk alt sistem, C7 eylemi, sabotajcı?')+'">'+(S.theory||'')+'</textarea><p><button class="btn" onclick="seal()">'+(S.sealed?T('sealed'):T('seal'))+'</button></p></div><div class="console"><h3 style="color:var(--cyan)">'+(S.lang==='en'?'SAFE VECTOR CONSOLE':'GÜVENLİ VEKTÖR KONSOLU')+'</h3><div class="vector">'+[1,2,3,4,5,6].map(i=>'<input id="v'+i+'" maxlength="1" inputmode="numeric">').join('')+'</div><button class="btn" onclick="transmit()">'+T('transmit')+'</button><p id="vectorFb"></p></div>')}function seal(){let v=document.getElementById('theory').value.trim();if(!v)return document.getElementById('theory').focus();S.theory=v;S.sealed=true;save();render()}function transmit(){let v=[1,2,3,4,5,6].map(i=>(document.getElementById('v'+i).value||'').trim()).join(''),ready=ORDER.every(k=>S.digits[k])&&S.sealed;if(v==='041229'&&ready){S.complete=true;S.screen='solution';save();render()}else document.getElementById('vectorFb').textContent=T('need')}function solution(){let body=S.lang==='en'?'There is <b>no saboteur</b>. A pre-impact software fault corrupted NAV-B and overheated the cooling loop. Isolate NAV-B, keep NAV-A online, reopen C7 after pressure equalizes and transmit <b>041-229</b> on the old rescue frequency. Kestrel steadies its course home.':'Bir <b>sabotajcı yok</b>. Çarpma öncesi yazılım arızası NAV-B\'yi bozdu ve soğutma döngüsünü aşırı ısıttı. NAV-B\'yi ayırın, NAV-A\'yı açık tutun, basınç eşitlenince C7\'yi açın ve eski frekanstan <b>041-229</b> iletin. Kestrel eve giden rotasını düzeltir.';return '<section class="paper solution"><div class="eyebrow">CASE CLOSED</div><h2>'+T('solution')+'</h2><p>'+body+'</p><div class="nav"><button class="btn" onclick="go(\'cover\')">'+(S.lang==='en'?'Return to cover':'Kapağa dön')+'</button></div></section>'}function render(){topbar();document.getElementById('app').innerHTML=S.screen==='cover'?cover():S.screen==='map'?map():ORDER.includes(S.screen)?room(S.screen):S.screen==='crew'?crew():S.screen==='evidence'?evidence():S.screen==='theory'?theory():solution()}render();</script></body></html>
