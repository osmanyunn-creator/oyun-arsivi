<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071426"><title>Alien Academy - First Contact Training</title>
<style>:root{--void:#071426;--navy:#102b46;--panel:#173b59;--cyan:#20d9e8;--lime:#a9f45b;--mag:#f05ca8;--violet:#8068f5;--sun:#ffc857;--ice:#eafbff;--paper:#f3faf8;--ink:#112b3b;--muted:#587080}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -15%,#245c7a 0,#102b46 31%,#071426 75%);color:var(--ice);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.4;background-image:radial-gradient(#20d9e8 1px,transparent 1px),radial-gradient(#a9f45b 1px,transparent 1px);background-size:53px 53px,97px 97px;background-position:8px 11px,31px 47px}.top{position:sticky;top:0;z-index:5;background:#071426f2;border-bottom:1px solid #20d9e888;backdrop-filter:blur(12px)}.topin{max-width:1050px;margin:auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{color:var(--lime);font:900 15px ui-monospace,monospace;letter-spacing:.12em}.actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:flex-end}button{font:800 12px system-ui;border:1px solid var(--cyan);border-radius:999px;background:transparent;color:var(--ice);padding:8px 12px;cursor:pointer}button.active{background:var(--cyan);color:var(--void)}button.primary{border:0;border-radius:13px;padding:13px 18px;background:linear-gradient(90deg,var(--violet),var(--mag));color:white;font-size:15px}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--lime);outline-offset:2px}.wrap{max-width:1050px;margin:auto;padding:26px 15px 70px}.progress{height:8px;background:#ffffff22;border-radius:99px;margin-bottom:18px;overflow:hidden}.progress span{height:100%;display:block;background:linear-gradient(90deg,var(--cyan),var(--lime),var(--sun),var(--mag));transition:width .3s}.card{position:relative;overflow:hidden;background:var(--paper);color:var(--ink);border:1px solid var(--cyan);border-radius:22px;padding:clamp(22px,5vw,46px);box-shadow:0 28px 70px #0008}.card:after{content:"";position:absolute;width:180px;height:90px;right:-80px;bottom:-35px;border-radius:50%;border:18px solid #20d9e81f;transform:rotate(-12deg)}.content{position:relative;z-index:1}.eyebrow{font:900 11px ui-monospace,monospace;letter-spacing:.15em;text-transform:uppercase;color:var(--violet)}h1,h2{color:var(--navy);margin:.25em 0}h1{font-size:clamp(39px,8vw,70px);line-height:.96}h2{font-size:clamp(28px,5vw,43px)}.lead{font-size:18px;line-height:1.6}.portal{width:220px;height:220px;border:12px solid var(--cyan);outline:7px solid var(--violet);border-radius:50%;margin:26px auto;display:grid;place-items:center;background:radial-gradient(circle,var(--panel) 0,var(--void) 66%);box-shadow:0 0 0 18px #a9f45b25,0 0 45px #20d9e877}.alien{width:120px;height:82px;background:var(--lime);border-radius:55% 55% 48% 48%;position:relative}.alien:before,.alien:after{content:"";position:absolute;width:24px;height:34px;background:var(--void);border-radius:50%;top:21px}.alien:before{left:20px}.alien:after{right:20px}.meta,.nav,.map{display:flex;gap:9px;flex-wrap:wrap}.meta span,.step{background:#dff8f5;color:var(--navy);padding:8px 11px;border-radius:999px;font:900 12px ui-monospace,monospace}.nav{margin-top:25px}.nav .primary{flex:1;min-width:180px}.map{margin-bottom:18px}.step.now{background:var(--violet);color:white}.step.done{background:var(--lime);color:var(--void)}.mission{background:white;border:1px solid #cfe2e2;border-radius:17px;padding:18px;margin:16px 0}.visual{min-height:165px;display:grid;place-items:center;background:var(--panel);color:white;border:1px solid var(--cyan);border-radius:16px;padding:18px;text-align:center;font:800 clamp(17px,5vw,35px) ui-monospace,monospace;line-height:1.65}.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:18px 0}.answers button{color:var(--navy);background:white;border:2px solid #d0dedf;border-radius:12px;padding:13px}.answers button:hover{border-color:var(--violet)}.answers button.correct{background:#d9f7e9;border-color:#2e9d67}.feedback{font-weight:900;min-height:24px}.ok{color:#207a54}.bad{color:#b83b5e}.hint{background:#fff4c9;border-left:5px solid var(--sun);padding:13px 15px;border-radius:9px;margin-top:12px}.sim{background:var(--panel);color:white;border-radius:17px;padding:25px;text-align:center}.sim h2{color:white}select{padding:12px;border-radius:10px;border:2px solid var(--cyan);font-weight:800;margin:5px;background:white}.cert{text-align:center;background:var(--void);color:white;border:7px double var(--cyan);border-radius:18px;padding:30px}.cert h2{color:white}.cert input{width:min(100%,450px);padding:11px;border:0;border-bottom:2px solid var(--lime);background:transparent;color:white;text-align:center;font-size:20px}.saved{font-size:10px;color:#b7d7e2}@media(max-width:600px){.answers{grid-template-columns:1fr}.brand{font-size:13px}}@media print{.top,.nav,.progress{display:none!important}body{background:white}body:before{display:none}.wrap{padding:0}.card{box-shadow:none;border:0}}</style></head>
<body><header class="top"><div class="topin"><div class="brand">ALIEN ACADEMY // EARTH FILE</div><div class="actions"><span id="saved" class="saved">Saved locally</span><button id="enBtn" onclick="setLang('en')">EN</button><button id="trBtn" onclick="setLang('tr')">TR</button><button onclick="resetAll()" id="resetBtn">Reset</button></div></div></header><main class="wrap"><div class="progress"><span id="bar"></span></div><section class="card" id="app"></section></main>
<script>const DATA=[{"title": ["Alien Language", "Uzaylı Dili"], "skill": ["Symbol recognition", "Sembol tanıma"], "q": ["Which glyph means PEACE?", "Hangi sembol BARIŞ anlamına gelir?"], "visual": "glyphs", "answers": [["A", "B", "C", "D", "E", "F"], ["A", "B", "C", "D", "E", "F"]], "correct": ["B", "B"], "hint": ["Find the orbit symbol with a dot at one end.", "Bir ucunda nokta bulunan yörünge sembolünü bul."], "result": ["PEACE SIGN", "BARIŞ İŞARETİ"]}, {"title": ["Star Map", "Yıldız Haritası"], "skill": ["Attribute matching", "Özellik eşleştirme"], "q": ["Which calm planet has exactly one moon?", "Hangi sakin gezegenin tam bir uydusu var?"], "visual": "planets", "answers": [["AQUORA", "VIREX", "LUMA", "NOVA-7"], ["AQUORA", "VIREX", "LUMA", "NOVA-7"]], "correct": ["LUMA", "LUMA"], "hint": ["Count only the small moons above each planet.", "Her gezegenin üzerindeki küçük uyduları say."], "result": ["LUMA", "LUMA"]}, {"title": ["Xeno DNA", "Uzaylı DNA’sı"], "skill": ["Sequence pattern", "Dizi örüntüsü"], "q": ["A-C-G-T-A-C-?-T. Which base is missing?", "A-C-G-T-A-C-?-T. Hangi baz eksik?"], "visual": "dna", "answers": [["A", "C", "G", "T"], ["A", "C", "G", "T"]], "correct": ["G", "G"], "hint": ["The sequence repeats every four bases.", "Dizi her dört bazda bir tekrar eder."], "result": ["G", "G"]}, {"title": ["Gravity Room", "Yerçekimi Odası"], "skill": ["Equivalence", "Eşdeğerlik"], "q": ["MOON 1×6, MARS 2×3, ZETA 3×2. Which gives a load of 6?", "AY 1×6, MARS 2×3, ZETA 3×2. Hangisi 6 yük verir?"], "visual": "gravity", "answers": [["MOON", "MARS", "ZETA", "ALL THREE"], ["AY", "MARS", "ZETA", "ÜÇÜ DE"]], "correct": ["ALL THREE", "ÜÇÜ DE"], "hint": ["Calculate all three products before choosing.", "Seçmeden önce üç çarpımı da hesapla."], "result": ["ALL THREE", "ÜÇÜ DE"]}, {"title": ["UFO Assembly", "UFO Montajı"], "skill": ["Function matching", "İşlev eşleştirme"], "q": ["Which module lets the shuttle communicate?", "Hangi modül mekiğin iletişim kurmasını sağlar?"], "visual": "ufo", "answers": [["ENGINE", "COMMS", "SHIELD"], ["MOTOR", "İLETİŞİM", "KALKAN"]], "correct": ["COMMS", "İLETİŞİM"], "hint": ["First Contact needs messages to travel both ways.", "İlk Temasta mesajların iki yönde iletilmesi gerekir."], "result": ["COMMS", "İLETİŞİM"]}, {"title": ["Meteor Defense", "Meteor Savunması"], "skill": ["Number pattern", "Sayı örüntüsü"], "q": ["Continue the sectors: 1, 3, 5, 7, ?", "Sektörleri devam ettir: 1, 3, 5, 7, ?"], "visual": "meteors", "answers": [["8", "9", "10", "11"], ["8", "9", "10", "11"]], "correct": ["9", "9"], "hint": ["Add two each time.", "Her adımda iki ekle."], "result": ["9", "9"]}, {"title": ["Galactic Trade", "Galaktik Takas"], "skill": ["Exact value", "Tam değer"], "q": ["Which gift is worth exactly 3 units?", "Hangi hediye tam olarak 3 birim değerinde?"], "visual": "trade", "answers": [["CRYSTAL", "SEEDS", "WATER", "STAR MAP"], ["KRİSTAL", "TOHUMLAR", "SU", "YILDIZ HARİTASI"]], "correct": ["WATER", "SU"], "hint": ["Look for the item labelled VALUE 3.", "DEĞER 3 olarak etiketlenen öğeyi bul."], "result": ["WATER", "SU"]}, {"title": ["Alien Logic", "Uzaylı Mantığı"], "skill": ["Logic grid", "Mantık tablosu"], "q": ["Who has 2 eyes, 2 antennae and 1 neck ring?", "Kimin 2 gözü, 2 anteni ve 1 boyun halkası var?"], "visual": "aliens", "answers": [["ZORN", "MEEP", "TALA", "BRIK"], ["ZORN", "MEEP", "TALA", "BRIK"]], "correct": ["TALA", "TALA"], "hint": ["Check all three traits on the same alien.", "Üç özelliği de aynı uzaylı üzerinde kontrol et."], "result": ["TALA", "TALA"]}, {"title": ["Culture Protocol", "Kültür Protokolü"], "skill": ["Evidence recall", "Kanıtları hatırlama"], "q": ["Which protocol matches your evidence?", "Hangi protokol kanıtlarınla eşleşiyor?"], "visual": "protocol", "answers": [["PEACE + LUMA + WATER", "WAVE + AQUORA + CRYSTAL", "BOW + NOVA-7 + SEEDS"], ["BARIŞ + LUMA + SU", "EL SALLAMA + AQUORA + KRİSTAL", "EĞİLME + NOVA-7 + TOHUMLAR"]], "correct": ["PEACE + LUMA + WATER", "BARIŞ + LUMA + SU"], "hint": ["Use results from Training 1, 2 and 7.", "1, 2 ve 7. eğitim sonuçlarını kullan."], "result": ["PEACE + LUMA + WATER", "BARIŞ + LUMA + SU"]}];const COPY={en:{saved:'Saved locally',reset:'Reset',eye:'INTERACTIVE FIRST CONTACT TRAINING',title:'Alien Academy',lead:'Earth needs a junior ambassador. Complete nine evidence modules, then pass the First Contact Simulator.',start:'Begin Transmission',guide:'Ambassador Briefing',guideBody:'Ages 8-12 · 1-6 players · 45-60 minutes. Work through the modules in order. Progress is saved only on this device.',begin:'Begin Training 1',back:'Back',next:'Next Training',hint:'Open gentle hint',wrong:'Evidence mismatch. Review and try again.',correct:'Training complete. Evidence saved.',result:'Recorded result',sim:'First Contact Simulator',simBody:'Choose the alien, planet, greeting and gift supported by your evidence.',approve:'Send Diplomatic Plan',success:'CONTACT APPROVED! The delegation welcomes Earth.',fail:'The Council requests stronger evidence. Check Trainings 1, 2, 7 and 8.',cert:'Earth Ambassador Certificate',awarded:'Awarded to',name:'Type your name',certBody:'for completing First Contact Training with observation, logic, communication and fair diplomacy.',again:'Train Again',toSim:'Open Simulator'},tr:{saved:'Yerel olarak kaydedildi',reset:'Sıfırla',eye:'İNTERAKTİF İLK TEMAS EĞİTİMİ',title:'Uzaylı Akademisi',lead:'Dünya’nın genç bir elçiye ihtiyacı var. Dokuz kanıt modülünü tamamla, ardından İlk Temas Simülatörünü geç.',start:'İletiyi Başlat',guide:'Elçi Brifingi',guideBody:'8-12 yaş · 1-6 oyuncu · 45-60 dakika. Modülleri sırayla tamamlayın. İlerleme yalnızca bu cihazda saklanır.',begin:'1. Eğitime Başla',back:'Geri',next:'Sonraki Eğitim',hint:'Küçük ipucunu aç',wrong:'Kanıt eşleşmedi. İnceleyip tekrar dene.',correct:'Eğitim tamamlandı. Kanıt kaydedildi.',result:'Kaydedilen sonuç',sim:'İlk Temas Simülatörü',simBody:'Kanıtların desteklediği uzaylıyı, gezegeni, selamı ve hediyeyi seç.',approve:'Diplomatik Planı Gönder',success:'TEMAS ONAYLANDI! Heyet Dünya’yı karşılıyor.',fail:'Konsey daha güçlü kanıt istiyor. 1, 2, 7 ve 8. eğitimleri kontrol et.',cert:'Dünya Elçisi Sertifikası',awarded:'Bu sertifika',name:'Adını yaz',certBody:'İlk Temas Eğitimini gözlem, mantık, iletişim ve adil diplomasiyle tamamladığı için verilmiştir.',again:'Yeniden Eğit',toSim:'Simülatörü Aç'}};const KEY='alien-academy-first-contact-v3';let S={lang:'en',screen:'cover',mission:0,solved:Array(9).fill(false),sim:['','','',''],approved:false,certName:''};try{const q=JSON.parse(localStorage.getItem(KEY)||'{}');S={...S,...q};if(!Array.isArray(S.solved)||S.solved.length!==9)S.solved=Array(9).fill(false);if(!Array.isArray(S.sim)||S.sim.length!==4)S.sim=['','','','']}catch(e){}const C=()=>COPY[S.lang],L=a=>a[S.lang==='en'?0:1],esc=v=>String(v??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function save(){localStorage.setItem(KEY,JSON.stringify(S));document.getElementById('saved').textContent=C().saved}function setLang(l){S.lang=l;save();render()}function go(screen){S.screen=screen;save();scrollTo({top:0,behavior:'smooth'});render()}function vis(k){let en=S.lang==='en';return {glyphs:'A △  ·  B ◉—  ·  C ≋<br>D ⌂  ·  E ◎◎  ·  F ✕',planets:'AQUORA ◉◉  ·  VIREX  ·  LUMA ◉  ·  NOVA-7 ◉◉◉',dna:'A — C — G — T — A — C — ? — T',gravity:en?'MOON 1×6  ·  MARS 2×3  ·  ZETA 3×2':'AY 1×6  ·  MARS 2×3  ·  ZETA 3×2',ufo:en?'ENGINE  ◁  COMMS  ◉  SHIELD':'MOTOR  ◁  İLETİŞİM  ◉  KALKAN',meteors:'①  +2  ③  +2  ⑤  +2  ⑦  +2  ?',trade:en?'CRYSTAL 4 · SEEDS 2 · WATER 3 · STAR MAP 5':'KRİSTAL 4 · TOHUMLAR 2 · SU 3 · YILDIZ HARİTASI 5',aliens:'ZORN 2E·1A·0R  |  MEEP 3E·2A·1R<br>TALA 2E·2A·1R  |  BRIK 1E·2A·2R',protocol:en?'GREETING + PLANET + GIFT':'SELAM + GEZEGEN + HEDİYE'}[k]}
function shell(eye,title,body,nav=''){return `<div class="content"><div class="eyebrow">${eye}</div><h2>${title}</h2>${body}<div class="nav">${nav}</div></div>`}function cover(){return shell(C().eye,C().title,`<p class="lead">${C().lead}</p><div class="portal"><div class="alien"></div></div><div class="meta"><span>AGES 8-12</span><span>1-6 PLAYERS</span><span>45-60 MIN</span><span>10 TRAININGS</span><span>OFFLINE</span></div>`,`<button class="primary" onclick="go('guide')">${C().start}</button>`)}function guide(){return shell(C().guide,C().guide,`<p class="lead">${C().guideBody}</p><div class="mission"><b>PDF + HTML</b><p>${S.lang==='en'?'Choose print or digital. No cutting, account, app or special props are required.':'Yazdırma veya dijital oyunu seçin. Kesme, hesap, uygulama veya özel malzeme gerekmez.'}</p></div>`,`<button onclick="go('cover')">${C().back}</button><button class="primary" onclick="S.mission=0;go('mission')">${C().begin}</button>`)}
function mission(){let d=DATA[S.mission],idx=S.mission,answers=L(d.answers),solved=S.solved[idx];let map=DATA.map((x,i)=>`<span class="step ${i===idx?'now':S.solved[i]?'done':''}">${i+1}</span>`).join('')+`<span class="step ${S.approved?'done':''}">10</span>`;let buttons=answers.map(a=>`<button ${solved?'disabled':''} class="${solved&&a===L(d.correct)?'correct':''}" data-answer="${esc(a)}">${esc(a)}</button>`).join('');return shell(`${S.lang==='en'?'TRAINING':'EĞİTİM'} ${idx+1} / 10`,L(d.title),`<div class="map">${map}</div><p><b>${L(d.skill)}</b></p><p class="lead">${L(d.q)}</p><div class="visual">${vis(d.visual)}</div><div class="answers">${buttons}</div><button onclick="toggleHint()">${C().hint}</button><div id="hint" class="hint" hidden>${L(d.hint)}</div><div class="feedback ${solved?'ok':''}">${solved?C().correct:''}</div>${solved?`<div class="hint"><b>${C().result}:</b> ${L(d.result)}</div>`:''}`,`<button onclick="prev()">${C().back}</button>${solved?`<button class="primary" onclick="next()">${idx===8?C().toSim:C().next}</button>`:''}`)}function answer(a){let d=DATA[S.mission];if(a===String(L(d.correct))){S.solved[S.mission]=true;save();render()}else{document.querySelector('.feedback').className='feedback bad';document.querySelector('.feedback').textContent=C().wrong}}function toggleHint(){let h=document.getElementById('hint');h.hidden=!h.hidden}function prev(){S.mission>0?(S.mission--,save(),render()):go('guide')}function next(){if(!S.solved[S.mission])return;if(S.mission<8){S.mission++;save();render()}else go('sim')}
const SIM=[['TALA','ZORN','MEEP','BRIK'],['LUMA','AQUORA','NOVA-7','VIREX'],['PEACE','WAVE','BOW','HELLO'],['WATER','CRYSTAL','SEEDS','STAR MAP']];const TR={PEACE:'BARIŞ',WAVE:'EL SALLAMA',BOW:'EĞİLME',HELLO:'MERHABA',WATER:'SU',CRYSTAL:'KRİSTAL',SEEDS:'TOHUMLAR','STAR MAP':'YILDIZ HARİTASI'};function sim(){let opts=i=>`<select data-sim="${i}"><option value="">${S.lang==='en'?['Alien','Planet','Greeting','Gift'][i]:['Uzaylı','Gezegen','Selam','Hediye'][i]}</option>${SIM[i].map(x=>`<option value="${x}" ${S.sim[i]===x?'selected':''}>${S.lang==='tr'?(TR[x]||x):x}</option>`).join('')}</select>`;return shell(S.lang==='en'?'TRAINING 10 / 10':'EĞİTİM 10 / 10',C().sim,`<div class="map">${Array.from({length:10},(_,i)=>`<span class="step ${i===9?'now':'done'}">${i+1}</span>`).join('')}</div><div class="sim"><div class="portal"><div class="alien"></div></div><p>${C().simBody}</p>${[0,1,2,3].map(opts).join('')}<p><button class="primary" onclick="checkSim()">${C().approve}</button></p><div id="sf" class="feedback"></div></div>`,`<button onclick="S.mission=8;go('mission')">${C().back}</button>`)}function checkSim(){let ok=S.sim.join('|')==='TALA|LUMA|PEACE|WATER';let el=document.getElementById('sf');el.className='feedback '+(ok?'ok':'bad');el.textContent=ok?C().success:C().fail;if(ok){S.approved=true;save();setTimeout(()=>go('cert'),650)}}function cert(){return shell('GALACTIC COUNCIL',C().cert,`<div class="cert"><div class="portal"><div class="alien"></div></div><p>${C().awarded}</p><input id="certName" value="${esc(S.certName)}" placeholder="${C().name}"><p>${C().certBody}</p><p>◉  ⟲  ◉</p></div>`,`<button onclick="go('sim')">${C().back}</button><button class="primary" onclick="resetAll()">${C().again}</button>`)}function resetAll(){if(confirm(S.lang==='en'?'Erase saved progress and begin again?':'Kayıtlı ilerleme silinsin ve baştan başlansın mı?')){let lang=S.lang;S={lang,screen:'cover',mission:0,solved:Array(9).fill(false),sim:['','','',''],approved:false,certName:''};save();render()}}function bind(){document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answer(b.dataset.answer));document.querySelectorAll('[data-sim]').forEach(s=>s.onchange=()=>{S.sim[+s.dataset.sim]=s.value;save()});let n=document.getElementById('certName');if(n)n.oninput=()=>{S.certName=n.value;save()}}function render(){document.documentElement.lang=S.lang;document.getElementById('enBtn').classList.toggle('active',S.lang==='en');document.getElementById('trBtn').classList.toggle('active',S.lang==='tr');document.getElementById('resetBtn').textContent=C().reset;document.getElementById('saved').textContent=C().saved;document.getElementById('bar').style.width=((S.solved.filter(Boolean).length+(S.approved?1:0))/10*100)+'%';let f={cover,guide,mission,sim,cert}[S.screen]||cover;document.getElementById('app').innerHTML=f();bind()}render();</script></body></html>
