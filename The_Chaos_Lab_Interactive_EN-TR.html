<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10171b"><title>The Chaos Lab - Stop the Meltdown</title><style>:root{--black:#10171b;--graph:#1e2b31;--steel:#38505a;--acid:#b9f34b;--green:#5de28b;--cyan:#26d8e5;--mag:#f65ea8;--amber:#ffc857;--orange:#ff7a4c;--cream:#f6f1df;--paper:#f4f7f3;--ink:#16242a;--muted:#60747b}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#3b5158 0,#1e2b31 34%,#10171b 78%);color:white;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.28;background-image:repeating-linear-gradient(135deg,#ffc857 0 3px,transparent 3px 22px);mask-image:linear-gradient(#000 0 6%,transparent 6% 94%,#000 94%)}.top{position:sticky;top:0;z-index:5;background:#10171bf2;border-bottom:1px solid #b9f34b88;backdrop-filter:blur(12px)}.topin{max-width:1050px;margin:auto;padding:11px 15px;display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{color:var(--acid);font:900 14px ui-monospace,monospace;letter-spacing:.1em}.actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:flex-end}button{font:800 12px system-ui;border:1px solid var(--acid);border-radius:999px;background:transparent;color:white;padding:8px 12px;cursor:pointer}button.active{background:var(--acid);color:var(--black)}button.primary{border:0;border-radius:13px;padding:13px 18px;background:linear-gradient(90deg,var(--mag),var(--orange));color:white;font-size:15px}.timer{font:900 13px ui-monospace,monospace;color:var(--amber)}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}.wrap{max-width:1050px;margin:auto;padding:26px 15px 70px}.progress{height:9px;background:#ffffff22;border-radius:99px;margin-bottom:18px;overflow:hidden}.progress span{height:100%;display:block;background:linear-gradient(90deg,var(--green),var(--acid),var(--amber),var(--mag));transition:width .3s}.card{position:relative;overflow:hidden;background:var(--cream);color:var(--ink);border:1px solid var(--acid);border-radius:22px;padding:clamp(22px,5vw,46px);box-shadow:0 28px 70px #0008}.card:after{content:"";position:absolute;width:170px;height:170px;right:-85px;bottom:-85px;border-radius:50%;border:22px solid #b9f34b22}.content{position:relative;z-index:1}.eyebrow{font:900 11px ui-monospace,monospace;letter-spacing:.15em;text-transform:uppercase;color:#a42d6e}h1,h2{color:var(--black);margin:.25em 0}h1{font-size:clamp(39px,8vw,70px);line-height:.96}h2{font-size:clamp(28px,5vw,43px)}.lead{font-size:18px;line-height:1.6}.reactor{width:230px;height:230px;border:12px solid var(--acid);outline:7px solid var(--cyan);border-radius:50%;margin:24px auto;display:grid;place-items:center;background:radial-gradient(circle,#5de28b 0 12%,#1e2b31 13% 45%,#10171b 46%);box-shadow:0 0 0 18px #f65ea825,0 0 48px #b9f34b88}.reactor:after{content:"CL-10";font:900 18px ui-monospace,monospace;color:var(--amber)}.meta,.nav,.map{display:flex;gap:9px;flex-wrap:wrap}.meta span,.step{background:#e9f5d4;color:var(--ink);padding:8px 11px;border-radius:999px;font:900 12px ui-monospace,monospace}.nav{margin-top:25px}.nav .primary{flex:1;min-width:180px}.map{margin-bottom:18px}.step.now{background:var(--mag);color:white}.step.done{background:var(--acid);color:var(--black)}.mission{background:white;border:1px solid #d8ddcf;border-radius:17px;padding:18px;margin:16px 0}.visual{min-height:165px;display:grid;place-items:center;background:var(--graph);color:white;border:1px solid var(--acid);border-radius:16px;padding:18px;text-align:center;font:800 clamp(17px,5vw,35px) ui-monospace,monospace;line-height:1.65}.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:18px 0}.answers button{color:var(--ink);background:white;border:2px solid #d7ddcc;border-radius:12px;padding:13px}.answers button:hover{border-color:var(--mag)}.answers button.correct{background:#dff8e6;border-color:#2e9d67}.feedback{font-weight:900;min-height:24px}.ok{color:#207a54}.bad{color:#b9384b}.hint{background:#fff0be;border-left:5px solid var(--amber);padding:13px 15px;border-radius:9px;margin-top:12px}.control{text-align:center;background:var(--graph);color:white;border-radius:17px;padding:25px}.control h2{color:white}select{padding:12px;border-radius:10px;border:2px solid var(--acid);font-weight:800;margin:5px;background:white}.cert{text-align:center;background:var(--black);color:white;border:7px double var(--acid);border-radius:18px;padding:30px}.cert h2{color:white}.cert input{width:min(100%,450px);padding:11px;border:0;border-bottom:2px solid var(--cyan);background:transparent;color:white;text-align:center;font-size:20px}.saved{font-size:10px;color:#c6d4d7}@media(max-width:700px){.answers{grid-template-columns:1fr}.brand{font-size:12px}.timer{order:3;width:100%;text-align:right}}@media print{.top,.nav,.progress{display:none!important}body{background:white}body:before{display:none}.wrap{padding:0}.card{box-shadow:none;border:0}}</style></head><body><header class="top"><div class="topin"><div class="brand">THE CHAOS LAB // CL-10</div><div class="actions"><span id="saved" class="saved">Saved locally</span><span id="timer" class="timer">60:00</span><button onclick="timerStart()" id="startBtn">Start</button><button onclick="timerPause()" id="pauseBtn">Pause</button><button id="enBtn" onclick="setLang('en')">EN</button><button id="trBtn" onclick="setLang('tr')">TR</button><button onclick="resetAll()" id="resetBtn">Reset</button></div></div></header><main class="wrap"><div class="progress"><span id="bar"></span></div><section class="card" id="app"></section></main><script>const DATA=[{"title": ["Color Mixing", "Renk Karışımı"], "skill": ["Color theory", "Renk teorisi"], "q": ["CRIMSON + BLUE creates which secondary color?", "KIRMIZI + MAVİ hangi ikincil rengi oluşturur?"], "visual": "mix", "answers": [["GREEN", "ORANGE", "PURPLE", "BROWN"], ["YEŞİL", "TURUNCU", "MOR", "KAHVERENGİ"]], "correct": ["PURPLE", "MOR"], "hint": ["Think about the secondary color between red and blue.", "Kırmızı ile mavi arasındaki ikincil rengi düşün."], "result": ["PURPLE", "MOR"]}, {"title": ["Broken Robot", "Bozuk Robot"], "skill": ["Path tracing", "Yol izleme"], "q": ["Which connection completes the working green circuit?", "Çalışan yeşil devreyi hangi bağlantı tamamlar?"], "visual": "robot", "answers": [["A", "B", "C", "D"], ["A", "B", "C", "D"]], "correct": ["C", "C"], "hint": ["Ignore the red and orange wires. Trace green only.", "Kırmızı ve turuncu kabloları kullanma. Yalnızca yeşili izle."], "result": ["JUNCTION C", "C BAĞLANTISI"]}, {"title": ["Periodic Puzzle", "Periyodik Bulmaca"], "skill": ["Atomic numbers", "Atom numaraları"], "q": ["Read element symbols for atomic numbers 1, 6, 8 and 11.", "1, 6, 8 ve 11 atom numaralarının element sembollerini oku."], "visual": "periodic", "answers": [["H-C-O-Na", "He-C-O-Ne", "H-N-O-Na", "H-C-Ne-Mg"], ["H-C-O-Na", "He-C-O-Ne", "H-N-O-Na", "H-C-Ne-Mg"]], "correct": ["H-C-O-Na", "H-C-O-Na"], "hint": ["Find each atomic number first, then keep that order.", "Önce her atom numarasını bul, sonra aynı sırayı koru."], "result": ["H-C-O-Na", "H-C-O-Na"]}, {"title": ["Molecule Match", "Molekül Eşleştirme"], "skill": ["Model reading", "Model okuma"], "q": ["Which formula order matches models A, B and C?", "A, B ve C modelleri hangi formül sırasıyla eşleşir?"], "visual": "molecules", "answers": [["H2O-CH4-NH3", "CH4-H2O-NH3", "NH3-CH4-H2O", "H2O-NH3-CH4"], ["H2O-CH4-NH3", "CH4-H2O-NH3", "NH3-CH4-H2O", "H2O-NH3-CH4"]], "correct": ["H2O-CH4-NH3", "H2O-CH4-NH3"], "hint": ["Count the small atoms around each center.", "Her merkezin çevresindeki küçük atomları say."], "result": ["H2O-CH4-NH3", "H2O-CH4-NH3"]}, {"title": ["Laser Maze", "Lazer Labirenti"], "skill": ["Spatial tracking", "Uzamsal takip"], "q": ["How many MIRROR REFLECTIONS occur before the target?", "Hedefe ulaşmadan önce kaç AYNA YANSIMASI olur?"], "visual": "laser", "answers": [["2", "3", "4", "5"], ["2", "3", "4", "5"]], "correct": ["3", "3"], "hint": ["Count direction changes at mirrors, not line segments.", "Çizgileri değil, aynalardaki yön değişimlerini say."], "result": ["3 REFLECTIONS", "3 YANSIMA"]}, {"title": ["Petri Patterns", "Petri Örüntüsü"], "skill": ["Number pattern", "Sayı örüntüsü"], "q": ["The dishes show 1, 2, 3 colonies. What comes next?", "Kaplarda 1, 2, 3 koloni var. Sırada ne gelir?"], "visual": "petri", "answers": [["3", "4", "5", "6"], ["3", "4", "5", "6"]], "correct": ["4", "4"], "hint": ["The count increases by one each time.", "Sayı her adımda bir artıyor."], "result": ["4 COLONIES", "4 KOLONİ"]}, {"title": ["Electric Circuit", "Elektrik Devresi"], "skill": ["Circuit tracing", "Devre izleme"], "q": ["Which junction powers the safety light?", "Güvenlik ışığını hangi bağlantı çalıştırır?"], "visual": "circuit", "answers": [["2", "3", "4", "5"], ["2", "3", "4", "5"]], "correct": ["4", "4"], "hint": ["Only the closed green path reaches the light.", "Yalnızca kapalı yeşil yol ışığa ulaşır."], "result": ["JUNCTION 4", "4. BAĞLANTI"]}, {"title": ["Temp & Pressure", "Sıcaklık ve Basınç"], "skill": ["Range comparison", "Aralık karşılaştırma"], "q": ["TEMP 72 is safe at 65-75. PRESSURE 180 is safe at 170-190. Status?", "SICAKLIK 72 için güvenli aralık 65-75. BASINÇ 180 için 170-190. Durum?"], "visual": "gauges", "answers": [["SAFE", "UNSAFE"], ["GÜVENLİ", "GÜVENSİZ"]], "correct": ["SAFE", "GÜVENLİ"], "hint": ["Both readings must be inside their ranges.", "İki değer de kendi aralığında olmalı."], "result": ["SAFE", "GÜVENLİ"]}, {"title": ["Data Decoder", "Veri Şifresi"], "skill": ["Symbol decoding", "Sembol çözme"], "q": ["Decode ○ △ △ ✣ ◇ ✳ with the symbol key.", "○ △ △ ✣ ◇ ✳ dizisini sembol anahtarıyla çöz."], "visual": "decoder", "answers": [["COOL IT", "LOCK IT", "FUEL IT", "TURN IT"], ["COOL IT", "KİLİTLE", "YAKIT VER", "ÇEVİR"]], "correct": ["COOL IT", "COOL IT"], "hint": ["Read the six mapped letters from left to right.", "Eşleşen altı harfi soldan sağa oku."], "result": ["COOL IT", "COOL IT"]}];const COPY={en:{saved:'Saved locally',reset:'Reset',start:'Start',pause:'Pause',eye:'INTERACTIVE STEM ESCAPE ADVENTURE',title:'The Chaos Lab',lead:'The reactor is unstable. Solve nine evidence missions, then enter the five-step safety sequence before the countdown reaches zero.',begin:'Begin Incident',guide:'Lead Scientist Briefing',guideBody:'Ages 8-12 · 1-6 players · 45-75 minutes. Work in order, record every result and use one gentle hint only when needed.',go:'Begin Mission 1',back:'Back',next:'Next Mission',hint:'Open gentle hint',wrong:'Data mismatch. Test the evidence again.',correct:'Mission complete. Data recorded.',result:'Recorded data',control:'Reactor Control',controlBody:'Priority: ROBOT → CIRCUIT → COLOR → LASER → PERIODIC. Convert those five results to control numbers.',stabilize:'Stabilize Reactor',success:'REACTOR STABLE! Safety systems restored.',fail:'Sequence rejected. Check the priority list and your recorded data.',cert:'Junior Scientist Certificate',awarded:'Awarded to',name:'Type your name',certBody:'for stabilizing the Chaos Lab reactor through observation, scientific reasoning, teamwork and accurate data.',again:'Run New Test',toControl:'Open Reactor Control'},tr:{saved:'Yerel olarak kaydedildi',reset:'Sıfırla',start:'Başlat',pause:'Duraklat',eye:'İNTERAKTİF STEM KAÇIŞ MACERASI',title:'Kaos Laboratuvarı',lead:'Reaktör kararsız. Dokuz kanıt görevini çöz, ardından süre dolmadan beş adımlı güvenlik dizisini gir.',begin:'Olayı Başlat',guide:'Baş Bilim İnsanı Brifingi',guideBody:'8-12 yaş · 1-6 oyuncu · 45-75 dakika. Sırayla ilerleyin, her sonucu kaydedin ve yalnızca gerektiğinde küçük ipucu kullanın.',go:'1. Göreve Başla',back:'Geri',next:'Sonraki Görev',hint:'Küçük ipucunu aç',wrong:'Veri eşleşmedi. Kanıtı yeniden test et.',correct:'Görev tamamlandı. Veri kaydedildi.',result:'Kaydedilen veri',control:'Reaktör Kontrolü',controlBody:'Öncelik: ROBOT → DEVRE → RENK → LAZER → PERİYODİK. Bu beş sonucu kontrol numaralarına dönüştür.',stabilize:'Reaktörü Dengele',success:'REAKTÖR DENGELENDİ! Güvenlik sistemleri çalışıyor.',fail:'Dizi reddedildi. Öncelik listesini ve verilerini kontrol et.',cert:'Genç Bilim İnsanı Sertifikası',awarded:'Bu sertifika',name:'Adını yaz',certBody:'Kaos Laboratuvarı reaktörünü gözlem, bilimsel düşünme, takım çalışması ve doğru verilerle dengelediği için verilmiştir.',again:'Yeni Test Başlat',toControl:'Reaktör Kontrolünü Aç'}};const KEY='chaos-lab-cl10-v3';let S={lang:'en',screen:'cover',mission:0,solved:Array(9).fill(false),sequence:['','','','',''],stable:false,certName:'',seconds:3600,running:false};try{const q=JSON.parse(localStorage.getItem(KEY)||'{}');S={...S,...q,running:false};if(!Array.isArray(S.solved)||S.solved.length!==9)S.solved=Array(9).fill(false);if(!Array.isArray(S.sequence)||S.sequence.length!==5)S.sequence=['','','','','']}catch(e){}let tick=null;const C=()=>COPY[S.lang],L=a=>a[S.lang==='en'?0:1],esc=v=>String(v??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));function save(){localStorage.setItem(KEY,JSON.stringify(S));document.getElementById('saved').textContent=C().saved}function setLang(l){S.lang=l;save();render()}function go(screen){S.screen=screen;save();scrollTo({top:0,behavior:'smooth'});render()}function clock(){let m=Math.floor(S.seconds/60),s=S.seconds%60;document.getElementById('timer').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}function timerStart(){if(tick)return;S.running=true;tick=setInterval(()=>{if(S.seconds>0){S.seconds--;clock();if(S.seconds%5===0)save()}else timerPause()},1000)}function timerPause(){clearInterval(tick);tick=null;S.running=false;save()}function vis(k){let en=S.lang==='en';return {mix:en?'CRIMSON  +  BLUE  =  ?':'KIRMIZI  +  MAVİ  =  ?',robot:'🤖  A ─ B ─ C ─ D',periodic:'1/H · 6/C · 8/O · 11/Na',molecules:en?'A: 🔴 + 2⚪  ·  B: ⚫ + 4⚪  ·  C: 🔵 + 3⚪<br>FORMULA BANK: NH3 · H2O · CH4':'A: 🔴 + 2⚪  ·  B: ⚫ + 4⚪  ·  C: 🔵 + 3⚪<br>FORMÜL HAVUZU: NH3 · H2O · CH4',laser:'→  ↗  →  ↘  →  ◎',petri:'●  ·  ●●  ·  ●●●  ·  ?',circuit:'① ━ ② ┓<br>④ ━ ③ ┛  →  LIGHT',gauges:en?'TEMP 72 / SAFE 65-75<br>PRESSURE 180 / SAFE 170-190':'SICAKLIK 72 / GÜVENLİ 65-75<br>BASINÇ 180 / GÜVENLİ 170-190',decoder:'○=C  △=O  ✣=L  ◇=I  ✳=T<br>○ △ △ ✣ ◇ ✳'}[k]}function shell(eye,title,body,nav=''){return `<div class="content"><div class="eyebrow">${eye}</div><h2>${title}</h2>${body}<div class="nav">${nav}</div></div>`}function cover(){return shell(C().eye,C().title,`<p class="lead">${C().lead}</p><div class="reactor"></div><div class="meta"><span>AGES 8-12</span><span>1-6 PLAYERS</span><span>45-75 MIN</span><span>10 MISSIONS</span><span>OFFLINE</span></div>`,`<button class="primary" onclick="go('guide')">${C().begin}</button>`)}function guide(){return shell(C().guide,C().guide,`<p class="lead">${C().guideBody}</p><div class="mission"><b>PDF + HTML</b><p>${S.lang==='en'?'No cutting, app, account or special props are required. The timer is optional.':'Kesme, uygulama, hesap veya özel malzeme gerekmez. Kronometre isteğe bağlıdır.'}</p></div>`,`<button onclick="go('cover')">${C().back}</button><button class="primary" onclick="S.mission=0;go('mission')">${C().go}</button>`)}function mission(){let d=DATA[S.mission],idx=S.mission,answers=L(d.answers),solved=S.solved[idx];let map=DATA.map((x,i)=>`<span class="step ${i===idx?'now':S.solved[i]?'done':''}">${i+1}</span>`).join('')+`<span class="step ${S.stable?'done':''}">10</span>`;let buttons=answers.map(a=>`<button ${solved?'disabled':''} class="${solved&&a===L(d.correct)?'correct':''}" data-answer="${esc(a)}">${esc(a)}</button>`).join('');return shell(`${S.lang==='en'?'MISSION':'GÖREV'} ${idx+1} / 10`,L(d.title),`<div class="map">${map}</div><p><b>${L(d.skill)}</b></p><p class="lead">${L(d.q)}</p><div class="visual">${vis(d.visual)}</div><div class="answers">${buttons}</div><button onclick="toggleHint()">${C().hint}</button><div id="hint" class="hint" hidden>${L(d.hint)}</div><div class="feedback ${solved?'ok':''}">${solved?C().correct:''}</div>${solved?`<div class="hint"><b>${C().result}:</b> ${L(d.result)}</div>`:''}`,`<button onclick="prev()">${C().back}</button>${solved?`<button class="primary" onclick="next()">${idx===8?C().toControl:C().next}</button>`:''}`)}function answer(a){let d=DATA[S.mission];if(a===String(L(d.correct))){S.solved[S.mission]=true;save();render()}else{let f=document.querySelector('.feedback');f.className='feedback bad';f.textContent=C().wrong}}function toggleHint(){let h=document.getElementById('hint');h.hidden=!h.hidden}function prev(){S.mission>0?(S.mission--,save(),render()):go('guide')}function next(){if(!S.solved[S.mission])return;if(S.mission<8){S.mission++;save();render()}else go('control')}const MAPS=[['JUNCTION C','2'],['JUNCTION 4','4'],['PURPLE','1'],['3 REFLECTIONS','5'],['H-C-O-Na','3']];function control(){let opts=i=>`<select data-seq="${i}"><option value="">${S.lang==='en'?'Step':'Adım'} ${i+1}</option>${['1','2','3','4','5'].map(x=>`<option value="${x}" ${S.sequence[i]===x?'selected':''}>${x}</option>`).join('')}</select>`;return shell(S.lang==='en'?'MISSION 10 / 10':'GÖREV 10 / 10',C().control,`<div class="map">${Array.from({length:10},(_,i)=>`<span class="step ${i===9?'now':'done'}">${i+1}</span>`).join('')}</div><div class="control"><div class="reactor"></div><p>${C().controlBody}</p><p>${S.lang==='en'?'Mappings':'Eşleştirmeler'}: ${MAPS.map(x=>x.join(' → ')).join(' · ')}</p>${[0,1,2,3,4].map(opts).join('')}<p><button class="primary" onclick="checkControl()">${C().stabilize}</button></p><div id="cf" class="feedback"></div></div>`,`<button onclick="S.mission=8;go('mission')">${C().back}</button>`)}function checkControl(){let ok=S.sequence.join('-')==='2-4-1-5-3';let el=document.getElementById('cf');el.className='feedback '+(ok?'ok':'bad');el.textContent=ok?C().success:C().fail;if(ok){S.stable=true;timerPause();save();setTimeout(()=>go('cert'),650)}}function cert(){return shell('THE CHAOS LAB',C().cert,`<div class="cert"><div class="reactor"></div><p>${C().awarded}</p><input id="certName" value="${esc(S.certName)}" placeholder="${C().name}"><p>${C().certBody}</p><p>⚗  CL-10  ⚗</p></div>`,`<button onclick="go('control')">${C().back}</button><button class="primary" onclick="resetAll()">${C().again}</button>`)}function resetAll(){if(confirm(S.lang==='en'?'Erase saved progress and begin a new test?':'Kayıtlı ilerleme silinsin ve yeni test başlatılsın mı?')){timerPause();let lang=S.lang;S={lang,screen:'cover',mission:0,solved:Array(9).fill(false),sequence:['','','','',''],stable:false,certName:'',seconds:3600,running:false};save();render()}}function bind(){document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answer(b.dataset.answer));document.querySelectorAll('[data-seq]').forEach(s=>s.onchange=()=>{S.sequence[+s.dataset.seq]=s.value;save()});let n=document.getElementById('certName');if(n)n.oninput=()=>{S.certName=n.value;save()}}function render(){document.documentElement.lang=S.lang;document.getElementById('enBtn').classList.toggle('active',S.lang==='en');document.getElementById('trBtn').classList.toggle('active',S.lang==='tr');document.getElementById('resetBtn').textContent=C().reset;document.getElementById('startBtn').textContent=C().start;document.getElementById('pauseBtn').textContent=C().pause;document.getElementById('saved').textContent=C().saved;document.getElementById('bar').style.width=((S.solved.filter(Boolean).length+(S.stable?1:0))/10*100)+'%';let f={cover,guide,mission,control,cert}[S.screen]||cover;document.getElementById('app').innerHTML=f();bind();clock()}render();</script></body></html>
