<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Curse of the Mummy — Digital Companion</title>
<style>
  :root{
    --ink:#1c1710; --ink2:#262016; --gold:#c9a227; --gold-light:#e8c860;
    --teal:#2f8f7a; --red:#c0392b; --yellow:#c9a227; --purple:#7a4f9e;
    --paper:#f2ecd8; --paper2:#e9dfc0; --text:#241f14; --muted:#8a8064;
    --shadow:0 18px 40px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ background:var(--ink); color:var(--paper); font-family:'Poppins',sans-serif; min-height:100vh; }
  #app{max-width:900px; margin:0 auto; padding:0 16px 60px;}

  .sandhead{ position:relative; height:80px; overflow:hidden; margin-bottom:20px;
    background:radial-gradient(ellipse at 50% 130%, #3a2f18 0%, var(--ink) 75%);
    border-bottom:1px solid rgba(201,162,39,.3); display:flex; align-items:center; justify-content:center;
  }
  .glow{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:90px; height:90px; border-radius:50%;
    background:radial-gradient(circle, rgba(201,162,39,.45) 0%, transparent 70%); animation:pulse 3s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{opacity:.6; transform:translate(-50%,-50%) scale(1);} 50%{opacity:1; transform:translate(-50%,-50%) scale(1.1);} }
  .brand-text{ font-family:'Playfair Display',serif; font-weight:800; font-size:22px; color:var(--gold-light); position:relative; z-index:1; }
  .topbar-corner{ position:absolute; top:16px; display:flex; align-items:center; gap:10px; z-index:2; }
  .topbar-corner.left{ left:16px; } .topbar-corner.right{ right:16px; }
  .lang-toggle{ display:flex; border:1px solid var(--gold); border-radius:20px; overflow:hidden; }
  .lang-toggle button{ background:transparent; border:none; color:var(--muted); padding:5px 13px; font-family:'Poppins'; font-weight:700; font-size:11.5px; cursor:pointer; }
  .lang-toggle button.active{ background:var(--gold); color:#1c1408; }
  .turn-pill{ font-family:'Poppins'; font-weight:700; font-size:12px; color:var(--paper); border:1px solid var(--gold); background:rgba(201,162,39,.2); padding:5px 12px; border-radius:20px; }

  .card{ background:var(--paper); color:var(--text); border-radius:6px; padding:30px 28px 24px; box-shadow:var(--shadow); border:1px solid var(--gold); position:relative; animation:fadeUp .4s ease; }
  @keyframes fadeUp{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }
  .eyebrow{ font-family:'Poppins'; font-weight:700; font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--gold); margin:0 0 10px; }
  h1.t{ font-family:'Playfair Display',serif; font-weight:800; font-size:clamp(24px,4.4vw,32px); color:#1c1408; margin:0 0 14px; }
  h2.t{ font-family:'Playfair Display',serif; font-weight:800; font-size:20px; color:#1c1408; margin:0 0 12px; }
  .body p{ font-family:'Poppins',sans-serif; font-size:15.5px; line-height:1.65; color:var(--text); margin:0 0 12px; }
  .btn{ background:var(--ink); color:var(--paper); border:1px solid var(--gold); border-radius:6px; padding:12px 18px; font-family:'Poppins'; font-weight:700; font-size:14px; cursor:pointer; transition:.15s; }
  .btn:hover{ background:var(--purple); border-color:var(--gold-light); }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }
  .btn.wide{ width:100%; }
  .btn.ghost{ background:transparent; color:var(--ink); border:1px solid var(--ink); }
  .choices{ display:flex; flex-direction:column; gap:10px; margin-top:18px; }

  .board{ display:grid; grid-template-columns:repeat(6,1fr); gap:6px; margin:16px 0; }
  .cell{ position:relative; aspect-ratio:1; border-radius:8px; display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:'Poppins'; font-weight:700; font-size:13px; border:2px solid; }
  .cell.cat0{ background:#e3f2ee; border-color:var(--teal); color:var(--teal); }
  .cell.cat1{ background:#fbe4e1; border-color:var(--red); color:var(--red); }
  .cell.cat2{ background:#f7ecd0; border-color:var(--yellow); color:#8a6f10; }
  .cell.cat3{ background:#ece1f5; border-color:var(--purple); color:var(--purple); }
  .cell .pawns{ position:absolute; bottom:2px; display:flex; gap:2px; flex-wrap:wrap; justify-content:center; }
  .pawn-dot{ width:13px; height:13px; border-radius:50%; border:1.5px solid #fff; font-size:8px; color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; }
  .legend{ display:flex; gap:10px; flex-wrap:wrap; margin:10px 0 4px; justify-content:center; }
  .legend span{ font-family:'Poppins'; font-weight:700; font-size:10.5px; padding:4px 10px; border-radius:14px; color:#fff; }

  .diebox{ text-align:center; margin:18px 0; }
  .die{ width:70px; height:70px; margin:0 auto 10px; border-radius:12px; background:#fff; border:2px solid var(--ink); display:flex; align-items:center; justify-content:center; font-size:40px; }
  .die.rolling{ animation:shake .5s ease; }
  @keyframes shake{ 0%,100%{transform:rotate(0);} 25%{transform:rotate(-14deg);} 75%{transform:rotate(14deg);} }

  .cardflip{ perspective:1000px; margin:18px 0; }
  .cardflip-inner{ position:relative; width:100%; min-height:220px; transition:transform .5s; transform-style:preserve-3d; }
  .cardflip.flipped .cardflip-inner{ transform:rotateY(180deg); }
  .cf-face{ position:absolute; inset:0; backface-visibility:hidden; border-radius:10px; padding:20px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; border:2px solid; }
  .cf-front{ background:var(--ink2); color:var(--gold-light); font-family:'Playfair Display'; font-style:italic; font-size:22px; cursor:pointer; border-color:var(--gold); }
  .cf-back{ transform:rotateY(180deg); }
  .cf-cat-label{ font-family:'Poppins'; font-weight:700; font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; margin-bottom:8px; }
  .cf-prompt{ font-family:'Poppins'; font-weight:600; font-size:16px; line-height:1.5; color:var(--text); margin-bottom:10px; }
  .cf-answer{ font-family:'Poppins'; font-style:italic; font-size:14px; color:var(--muted); }

  .stamp{ display:inline-block; border:3px solid var(--purple); color:var(--purple); font-family:'Playfair Display',serif; font-weight:800; letter-spacing:.05em; padding:9px 20px; transform:rotate(-4deg); border-radius:6px; margin:8px 0 18px; font-size:18px; }
  .playergrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(90px,1fr)); gap:10px; margin:16px 0; }
  .playerchip{ border:2px solid; border-radius:10px; padding:12px 8px; text-align:center; font-family:'Poppins'; font-weight:700; cursor:pointer; transition:.15s; }
  .playerchip.selected{ box-shadow:0 0 0 3px rgba(0,0,0,.08) inset; }
  .stepper{ display:flex; align-items:center; justify-content:center; gap:16px; margin:16px 0; }
  .stepper button{ width:44px; height:44px; border-radius:50%; border:2px solid var(--ink); background:#fff; font-size:20px; font-weight:800; cursor:pointer; }
  .stepper .num{ font-family:'Playfair Display'; font-weight:800; font-size:30px; min-width:44px; text-align:center; }
  .tracker{ margin:18px 0 4px; padding:14px; border:1px solid rgba(28,23,16,.2); border-radius:10px; background:rgba(255,255,255,.45); }
  .tracker-title{ font-family:'Playfair Display',serif; font-weight:800; font-size:18px; margin:0 0 10px; }
  .tracker-note{ font-size:11px; line-height:1.45; color:var(--muted); margin:0 0 10px; }
  .tracker-row{ display:grid; grid-template-columns:minmax(88px,1.25fr) repeat(3,minmax(88px,1fr)); gap:7px; align-items:center; padding:8px 0; border-top:1px solid rgba(28,23,16,.12); }
  .tracker-row:first-of-type{ border-top:0; }
  .tracker-name{ font-weight:700; font-size:12px; }
  .tracker-control{ display:flex; align-items:center; justify-content:center; gap:6px; font-size:11px; }
  .mini{ width:25px; height:25px; border:1px solid var(--ink); border-radius:50%; background:#fff; color:var(--ink); font-weight:800; cursor:pointer; }
  .skip-btn{ border:1px solid var(--purple); color:var(--purple); background:#fff; border-radius:14px; padding:5px 8px; font-size:10px; font-weight:700; cursor:pointer; }
  .skip-btn.active{ color:#fff; background:var(--purple); }
  .answer-btn{ border:1px solid var(--ink); background:#fff; color:var(--ink); border-radius:16px; padding:6px 12px; font-family:'Poppins',sans-serif; font-weight:700; font-size:11px; cursor:pointer; margin-top:6px; }
  .safety{ margin-top:14px; padding:11px 13px; border-left:4px solid var(--red); background:#fbe4e1; color:#612219; font-size:12px; line-height:1.5; }
  .offline-note{ margin-top:16px; text-align:center; color:var(--muted); font-size:10.5px; line-height:1.5; }
  @media (max-width:520px){ .card{padding:22px 18px 20px;} .cell{font-size:11px;} }
  @media (max-width:680px){ .tracker-row{grid-template-columns:1fr 1fr;}.tracker-name{grid-column:1/-1;} }
</style>
</head>

    {en:{q:"Written in pictures, has no letters, yet tells a story — what is it?", a:"Hieroglyphs"}, tr:{q:"Yazısı resimlerle yazılır, harfi yoktur ama anlatır; nedir?", a:"Hiyeroglif"}},
    {en:{q:"Protects the dead, wrapped in linen bandages — what is it?", a:"A mummy"}, tr:{q:"Ölüleri koruyan, sargı beziyle sarılı olan nedir?", a:"Mumya"}},
    {en:{q:"1, 4, 9, 16, 25, ? — what comes next?", a:"36"}, tr:{q:"1, 4, 9, 16, 25, ? — sıradaki sayı nedir?", a:"36"}},
    {en:{q:"Crosses the desert leaving no trace, blows through the night — what is it?", a:"The wind"}, tr:{q:"Çölde iz bırakmadan geçen, gece esen nedir?", a:"Rüzgar"}},
    {en:{q:"What is Egypt's longest river?", a:"The Nile"}, tr:{q:"Mısır'ın en büyük nehri hangisidir?", a:"Nil"}},
    {en:{q:"Shines on the pharaoh's crown, but can never be held — what is it?", a:"Sunlight"}, tr:{q:"Firavunun tacında parlar ama elle tutulamaz; nedir?", a:"Güneş ışığı"}},
  ],
  trap:[
    {en:{q:"The floor is full of arrows! Stay in place, close your eyes, and mime 10 careful steps while a spotter watches.", a:""}, tr:{q:"Zemin oklarla dolu! Yerinde kal, gözlerini kapat ve bir gözetmen izlerken 10 dikkatli adım taklidi yap.", a:""}},
    {en:{q:"You're caught in a spider's web — speak only in whispers for 1 minute.", a:""}, tr:{q:"Örümcek ağına takıldın — 1 dakika sadece fısıldayarak konuş.", a:""}},

    {en:{q:"The stone door is closing! In 5 seconds, show an escape route using an animal impression.", a:""}, tr:{q:"Taş kapı kapanıyor! 5 saniyede bir hayvan taklidiyle kaçış yolunu göster.", a:""}},
    {en:{q:"Poison dart trap — close your eyes and guess the name of the player on your right.", a:""}, tr:{q:"Zehirli ok tuzağı — gözlerini kapat, sağındaki oyuncunun adını tahmin et.", a:""}},

const SPACE_CAT = [null,0,1,2,3,0,1, 3,2,1,0,3,2, 0,1,2,3,0,1, 3,2,1,0,3,2, 0,1,2,3,0,1];
const ROWS = [[1,2,3,4,5,6],[12,11,10,9,8,7],[13,14,15,16,17,18],[24,23,22,21,20,19],[25,26,27,28,29,30]];
const PAWN_COLORS = ["#2f8f7a","#c0392b","#c9a227","#7a4f9e","#2f8f7a","#c0392b"];

const STORAGE_KEY = "curseOfTheMummyStateV2";
let STATE = {
  lang:"en", screen:"cover", numPlayers:4, positions:[], current:0,
  hearts:[], skips:[], dieValue:null, drawnCat:null, cardFlipped:false,
  answerRevealed:false, currentCard:null, decks:{}, winner:null
};

function L(obj){ return obj[STATE.lang]; }
function setLang(l){
  STATE.lang = l;
  document.getElementById('btnEN').classList.toggle('active', l==='en');
  document.getElementById('btnTR').classList.toggle('active', l==='tr');
  document.getElementById('brandLabel').textContent = L(T.brand);
  render();
}
function go(id){ STATE.screen = id; window.scrollTo({top:0,behavior:'smooth'}); render(); }
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE)); }catch(_){}
}
function loadState(){
  try{
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
    if(!saved || !["en","tr"].includes(saved.lang)) return;
    STATE = {...STATE, ...saved};
    STATE.positions = Array.isArray(STATE.positions) ? STATE.positions : [];
    STATE.hearts = Array.isArray(STATE.hearts) ? STATE.hearts : [];
    STATE.skips = Array.isArray(STATE.skips) ? STATE.skips : [];
    STATE.answerRevealed = Boolean(STATE.answerRevealed);
  }catch(_){}
}
function resetGame(){
  const msg = STATE.lang==='en' ? "Start a new expedition? Current progress will be cleared." : "Yeni keşif başlatılsın mı? Mevcut ilerleme silinecek.";
  if(!window.confirm(msg)) return;
  STATE = { lang:STATE.lang, screen:"cover", numPlayers:4, positions:[], current:0, hearts:[], skips:[], dieValue:null, drawnCat:null, cardFlipped:false, answerRevealed:false, currentCard:null, decks:{}, winner:null };
  try{ localStorage.removeItem(STORAGE_KEY); }catch(_){}
  render();
}

function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function initDecks(){ STATE.decks = {}; CATS.forEach(c=>{ STATE.decks[c] = shuffle(CARDS[c].map((_,i)=>i)); }); }
function drawFromDeck(cat){
  if(!STATE.decks[cat] || STATE.decks[cat].length===0){ STATE.decks[cat] = shuffle(CARDS[cat].map((_,i)=>i)); }
  const idx = STATE.decks[cat].pop();
  return CARDS[cat][idx];
}

function startGame(){
  STATE.positions = new Array(STATE.numPlayers).fill(0);
  STATE.hearts = new Array(STATE.numPlayers).fill(3);
  STATE.skips = new Array(STATE.numPlayers).fill(false);
  STATE.current = 0;
  initDecks();
  go('play');
}
function setNumPlayers(n){ STATE.numPlayers = Math.max(4,Math.min(6,n)); render(); }

function rollDie(){
  if(STATE.dieValue !== null) return;
  const el = document.getElementById('dieEl');
  if(el) el.classList.add('rolling');
  const val = 1 + Math.floor(Math.random()*6);
  setTimeout(()=>{
    STATE.dieValue = val;
    const p = STATE.current;
    let newPos = STATE.positions[p] + val;
    if(newPos > 30) newPos = 30;
    STATE.positions[p] = newPos;
    if(newPos >= 30){
      STATE.winner = p;
      render();
      return;
    }
    STATE.drawnCat = SPACE_CAT[newPos];
    STATE.cardFlipped = false;
    STATE.currentCard = null;
    render();
  }, 480);
  render();
}
function drawCard(){
  STATE.currentCard = drawFromDeck(CATS[STATE.drawnCat]);
  STATE.answerRevealed = false;
  render();
}
function flipCard(){ STATE.cardFlipped = true; STATE.answerRevealed = false; render(); }
function toggleAnswer(){ STATE.answerRevealed = !STATE.answerRevealed; render(); }
function adjustPos(i,delta){
  STATE.positions[i] = Math.max(0, Math.min(30, (STATE.positions[i] || 0) + delta));
  if(STATE.positions[i] >= 30) STATE.winner = i;
  render();
}
function adjustHeart(i,delta){
  STATE.hearts[i] = Math.max(0, Math.min(3, (STATE.hearts[i] ?? 3) + delta));
  render();
}
function toggleSkip(i){ STATE.skips[i] = !STATE.skips[i]; render(); }
function endTurn(){
  STATE.dieValue = null; STATE.drawnCat = null; STATE.currentCard = null; STATE.cardFlipped = false; STATE.answerRevealed = false;
  let next = (STATE.current + 1) % STATE.numPlayers;
  let checked = 0;
  while(STATE.skips[next] && checked < STATE.numPlayers){
    STATE.skips[next] = false;
    next = (next + 1) % STATE.numPlayers;
    checked++;
  }
  STATE.current = next;
  render();
}

const DICE_FACES = ["","⚀","⚁","⚂","⚃","⚄","⚅"];

function renderCover(){
  return `<div class="card">
    <p class="eyebrow">${STATE.lang==='en'?'FOR EXPLORERS':'KAŞİFLER İÇİN'}</p>
    <h1 class="t">${STATE.lang==='en'?'Curse of the Mummy':'Mumyanın Laneti'}</h1>
    <div class="body"><p>${STATE.lang==='en'?'A party adventure game for 4–6 players. Descend into the depths of the pyramid, find the treasure, survive the curse.':'4-6 kişilik bir macera oyunu. Piramidin derinliklerine inin, hazineyi bulun, laneti atlatın.'}</p></div>
    <div class="choices"><button class="btn wide" onclick="go('howto')">${L(T.begin)}</button></div>
    <div class="offline-note">${L(T.offline)}</div>
  </div>`;
}
function renderHowTo(){
  return `<div class="card">
    <p class="eyebrow">${L(T.howtoTitle)}</p>
    <h2 class="t">${STATE.lang==='en'?'Before You Begin':'Başlamadan Önce'}</h2>
    <div class="body">
      ${STATE.lang==='en' ? `
      <p>Each player takes a turn rolling the die and moving their explorer along the pyramid path. The space you land on tells you which card to draw — a Riddle, a Trap, a Treasure, or a Curse.</p>
      <p>Follow the card's instructions, then pass the die to the next explorer. First to reach space 30 — the Mummy's Chamber — wins!</p>` : `
      <p>Her oyuncu sırayla zar atıp kaşifini piramit yolunda ilerletir. Bastığın kare, hangi kartı çekeceğini gösterir — bir Bilmece, bir Tuzak, bir Hazine ya da bir Lanet.</p>
      <p>Kartın talimatını uygula, sonra zarı bir sonraki kaşife ver. 30 numaralı kareye — Mumya Odası'na — ilk ulaşan kazanır!</p>`}
    </div>
    <div class="safety">${L(T.safety)}</div>
    <div class="choices"><button class="btn wide" onclick="go('setup')">${L(T.cont)}</button></div>
  </div>`;
}
function renderSetup(){
  return `<div class="card">
    <p class="eyebrow">${STATE.lang==='en'?'SETUP':'KURULUM'}</p>
    <h2 class="t">${L(T.setupTitle)}</h2>
    <p style="font-family:'Poppins'; font-size:13px; color:var(--muted); text-align:center;">${L(T.playersLbl)}</p>
    <div class="stepper">
      <button onclick="setNumPlayers(${STATE.numPlayers-1})">−</button>
      <div class="num">${STATE.numPlayers}</div>
      <button onclick="setNumPlayers(${STATE.numPlayers+1})">+</button>
    </div>
    <div class="playergrid">
      ${Array.from({length:STATE.numPlayers}).map((_,i)=>`<div class="playerchip selected" style="border-color:${PAWN_COLORS[i]}; color:${PAWN_COLORS[i]};">${STATE.lang==='en'?'Explorer':'Kaşif'} ${i+1}</div>`).join("")}
    </div>
    <div class="choices"><button class="btn wide" onclick="startGame()">${L(T.startGame)}</button></div>
  </div>`;
}
function renderBoard(){
  return `<div class="board">
    ${ROWS.map(row=>row.map(n=>{
      const cat = SPACE_CAT[n];
      const pawnsHere = STATE.positions.map((pos,i)=>pos===n?i:-1).filter(i=>i>=0);
      return `<div class="cell cat${cat}">${n}<div class="pawns">${pawnsHere.map(i=>`<span class="pawn-dot" style="background:${PAWN_COLORS[i]};">${i+1}</span>`).join("")}</div></div>`;
    }).join("")).join("")}
  </div>
  <div class="legend">
    <span style="background:var(--teal);">${L(T.riddle)}</span>
    <span style="background:var(--red);">${L(T.trap)}</span>
    <span style="background:var(--yellow); color:#000;">${L(T.treasure)}</span>
    <span style="background:var(--purple);">${L(T.curse)}</span>
  </div>`;
}
function renderTracker(){
  return `<div class="tracker">
    <div class="tracker-title">${L(T.trackerTitle)}</div>
    <p class="tracker-note">${L(T.trackerNote)}</p>
    ${Array.from({length:STATE.numPlayers}).map((_,i)=>`
      <div class="tracker-row">
        <div class="tracker-name" style="color:${PAWN_COLORS[i]};">${STATE.lang==='en'?'Explorer':'Kaşif'} ${i+1}</div>
        <div class="tracker-control"><button class="mini" onclick="adjustPos(${i},-1)">−</button><span>${L(T.position)} ${STATE.positions[i] || 0}</span><button class="mini" onclick="adjustPos(${i},1)">+</button></div>
        <div class="tracker-control"><button class="mini" onclick="adjustHeart(${i},-1)">−</button><span>♥ ${STATE.hearts[i] ?? 3}</span><button class="mini" onclick="adjustHeart(${i},1)">+</button></div>
        <button class="skip-btn ${STATE.skips[i]?'active':''}" onclick="toggleSkip(${i})">${L(T.skip)}</button>
      </div>`).join("")}
  </div>`;
}
function renderPlay(){
  if(STATE.winner !== null){
    return `<div class="card">
      <div class="stamp">${L(T.winTitle)}</div>
      <h2 class="t" style="color:${PAWN_COLORS[STATE.winner]};">${STATE.lang==='en'?'Explorer':'Kaşif'} ${STATE.winner+1}</h2>
      <div class="body"><p>${L(T.wins)}</p></div>
      ${renderBoard()}
      <div class="choices"><button class="btn wide" onclick="resetGame()">↺ ${L(T.playAgain)}</button></div>
    </div>`;
  }
  let cardSection = "";
  if(STATE.drawnCat !== null){
    const catName = L(T[CATS[STATE.drawnCat]]);
    if(!STATE.currentCard){
      cardSection = `<div class="choices"><button class="btn wide" onclick="drawCard()" style="background:${CAT_COLOR[CATS[STATE.drawnCat]]}; border-color:${CAT_COLOR[CATS[STATE.drawnCat]]}; color:#fff;">🃏 ${L(T.drawCard)} — ${catName}</button></div>`;
    } else {
      const c = STATE.currentCard[STATE.lang];
      cardSection = `
      <div class="cardflip ${STATE.cardFlipped?'flipped':''}">
        <div class="cardflip-inner">
          <div class="cf-face cf-front" onclick="flipCard()" style="border-color:${CAT_COLOR[CATS[STATE.drawnCat]]};">
            ${catName}<br><span style="font-size:13px; font-family:'Poppins'; font-style:normal; color:var(--muted); margin-top:8px;">${L(T.tapReveal)}</span>
          </div>
          <div class="cf-face cf-back" style="border-color:${CAT_COLOR[CATS[STATE.drawnCat]]};">
            <div class="cf-cat-label" style="color:${CAT_COLOR[CATS[STATE.drawnCat]]};">${catName}</div>
            <div class="cf-prompt">${c.q}</div>
            ${c.a?`<button class="answer-btn" onclick="event.stopPropagation(); toggleAnswer()">${STATE.answerRevealed?L(T.hideAnswer):L(T.showAnswer)}</button>`:""}
            ${c.a && STATE.answerRevealed?`<div class="cf-answer">${c.a}</div>`:""}
          </div>
        </div>
      </div>
      <div class="choices"><button class="btn wide" onclick="endTurn()">${L(T.endTurn)}</button></div>`;
    }
  } else {
    cardSection = `<div class="diebox">
      <div class="die" id="dieEl">${STATE.dieValue?DICE_FACES[STATE.dieValue]:'?'}</div>
      ${STATE.dieValue?`<p style="font-family:'Poppins'; font-weight:700;">${L(T.moveResult)}: ${STATE.dieValue}</p>`:`<button class="btn" onclick="rollDie()">🎲 ${L(T.rollDice)}</button>`}
    </div>`;
  }
  return `<div class="card">
    <p class="eyebrow">${L(T.turnOf)}</p>
    <h2 class="t" style="color:${PAWN_COLORS[STATE.current]};">${STATE.lang==='en'?'Explorer':'Kaşif'} ${STATE.current+1}</h2>
    ${renderBoard()}
    ${renderTracker()}
    ${cardSection}
  </div>`;
}

function render(){
  const app = document.getElementById('app');
  let html = "";
  if(STATE.screen==='cover') html = renderCover();
  else if(STATE.screen==='howto') html = renderHowTo();
  else if(STATE.screen==='setup') html = renderSetup();
  else if(STATE.screen==='play') html = renderPlay();
  app.innerHTML = html;
  const pill = document.getElementById('turnPill');
  if(pill){
    if(STATE.screen==='play' && STATE.winner===null) pill.textContent = (STATE.lang==='en'?'Explorer ':'Kaşif ') + (STATE.current+1);
    else pill.textContent = "·";
  }
  saveState();
}
loadState();
document.getElementById('btnEN').classList.toggle('active', STATE.lang==='en');
document.getElementById('btnTR').classList.toggle('active', STATE.lang==='tr');
document.getElementById('brandLabel').textContent = L(T.brand);
render();
</script>
</body>
</html>
